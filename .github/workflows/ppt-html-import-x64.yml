name: ppt-html-import-x64
# Screening net for PowerPoint's HTML import (mso tokenizer + ppcore PPTHTML*Parser + the timing
# fixup pass that runs at the end of DoReadSlide).
# Carriers are 11 HTML/MHTML decks, each a single-variable structural change against the plain
# control (nesting depth, empty/hidden items, nested slide div, VML o:spid references, duplicate
# spid, table-nested lists, missing image part, 40 items, orphan MHTML part).  Every file carries
# ZoneId=3 before opening; the log records window title, Protected View, module list and dumps.
on: [workflow_dispatch]
jobs:
  s:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
    - name: Download ODT
      shell: pwsh
      run: |
        $page = (Invoke-WebRequest -Uri "https://www.microsoft.com/en-us/download/details.aspx?id=49117" -UseBasicParsing).Content
        if ($page -match 'href=\"(https://download\.microsoft\.com/download/[^\"]+officedeploymenttool[^\"]*\.exe)\"') {
          Invoke-WebRequest -Uri $Matches[1] -OutFile odt.exe
        } else { throw 'odt link not found' }
        Start-Process -Wait -FilePath .\odt.exe -ArgumentList "/extract:odtx /quiet"
    - name: Install CurrentPreview PowerPoint (x64)
      shell: pwsh
      run: |
        $xml = '<Configuration><Add OfficeClientEdition="64" Channel="CurrentChannelPreview"><Product ID="O365ProPlusRetail"><Language ID="en-us" /><ExcludeApp ID="Word" /><ExcludeApp ID="Excel" /><ExcludeApp ID="Outlook" /><ExcludeApp ID="OneNote" /><ExcludeApp ID="Access" /><ExcludeApp ID="Publisher" /><ExcludeApp ID="Teams" /><ExcludeApp ID="SharePointDesigner" /><ExcludeApp ID="FormConverter" /></Product></Add></Configuration>'
        Set-Content -Path cfg.xml -Value $xml
        Start-Process -Wait -FilePath .\odtx\setup.exe -ArgumentList "/configure","cfg.xml"
        $p = Get-Item "C:\Program Files\Microsoft Office\root\Office16\ppcore.dll" -EA SilentlyContinue
        if (-not $p) { throw "ppcore missing" }
        "ppcore v{0} size={1}" -f $p.VersionInfo.FileVersion, $p.Length
        $p.VersionInfo.FileVersion | Out-File ver.txt
    - name: Build HTML carriers
      shell: pwsh
      run: |
        python -m pip install --quiet python-pptx
        python ppseed\ppt_html_carriers.py carriers_h
        $n = @(Get-ChildItem carriers_h -File).Count
        "carriers=$n"
        if ($n -lt 9) { throw "carrier generation failed ($n)" }
    - name: Sweep under full page heap
      shell: pwsh
      run: |
        pwsh -NoProfile -ExecutionPolicy Bypass -File ppseed\ppt_sweep.ps1 -Dir carriers_h -Tag ppthtml -Ext '.htm,.html,.mht,.mhtml' -Base (Get-Location).Path -WaitSec 60
        Get-Content out\ppthtml_log.txt | Select-Object -Last 60
    - name: Report
      shell: pwsh
      run: |
        $d = @(Get-ChildItem dumps -Filter *.dmp -EA SilentlyContinue)
        "SUMMARY cases=" + @(Get-ChildItem carriers_h -File).Count + " dumps=" + $d.Count
        ($d | ForEach-Object { $_.Name + ":" + $_.Length }) -join " "
        Get-Content out\ppthtml_log.txt | Select-String 'state='
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ppthtml-out
        path: |
          out/
          ver.txt
          dumps/
        if-no-files-found: warn
        retention-days: 30
