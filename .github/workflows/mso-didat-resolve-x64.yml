name: mso-didat-resolve-x64
# Resolve the ARM64X/x64 hybrid import slots mso cannot show statically.
#
# Several HTML-importer helpers the audit keeps hitting are not functions in the file - IDA prints
# them as __imp_ names whose qword is 0xFFFFFFFFFFFFFFFF until the loader fills them
# (FObtainXmlItemString = mso+0x194fe48, MsoConvertXmlNCRs = mso+0x1950868, PwchFetchToIhtks =
# mso+0x194fd90). The four "capacity in the callee, length in the caller" rows in
# mso-html-import-20260923/STATE.md hang on the first one. Ask the live process for the whole slot
# band, translate each filled pointer back to an RVA, then resolve names in a second session
# (ASLR-safe because the second session addresses mso relatively).
'on': {workflow_dispatch: {}}
jobs:
  t:
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
    - uses: actions/checkout@v4
    - name: Download ODT
      shell: pwsh
      run: |
        $page = (Invoke-WebRequest -Uri "https://www.microsoft.com/en-us/download/details.aspx?id=49117" -UseBasicParsing).Content
        if ($page -match 'href="(https://download\.microsoft\.com/download/[^"]+officedeploymenttool[^"]*\.exe)"') { Invoke-WebRequest -Uri $Matches[1] -OutFile odt.exe } else { throw "no odt" }
        Start-Process -Wait -FilePath .\odt.exe -ArgumentList "/extract:odtx /quiet"
    - name: Install x64 Office
      shell: pwsh
      run: |
        $xml = '<Configuration><Add OfficeClientEdition="64" Channel="CurrentChannel"><Product ID="O365ProPlusRetail"><Language ID="en-us" /><ExcludeApp ID="OneDrive" /><ExcludeApp ID="Bing" /></Product></Add><Display Level="None" AcceptEULA="TRUE" /><Updates Enabled="FALSE" /></Configuration>'
        Set-Content -Path cfg.xml -Value $xml
        Start-Process -Wait -FilePath .\odtx\setup.exe -ArgumentList "/configure","cfg.xml"
        # mso.dll is not under root\Office16 on 20430 installs; it lives in the shared OFFICE16 dir
        # (found by listing the VM: ...\root\vfs\ProgramFilesCommonX64\Microsoft Shared\OFFICE16\MSO.DLL, 45,794,072 B).
        $m = Get-ChildItem "C:\Program Files\Microsoft Office" -Recurse -Filter mso.dll -EA SilentlyContinue |
              Where-Object { $_.FullName -notmatch 'PackageFiles' } | Select-Object -First 1
        if (-not $m) { throw "mso.dll not found under the Office root" }
        "mso_path=" + $m.FullName | Tee-Object mso_path.txt
        "mso v=$($m.VersionInfo.FileVersion)" | Tee-Object ver.txt
    - name: Pass A - dump the slot band from the live process
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path out | Out-Null
        $cdb = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
        $ww = 'C:\Program Files\Microsoft Office\root\Office16\WINWORD.EXE'
        Set-Content -Path a.txt -Value @('.sympath srv*C:\sym*https://msdl.microsoft.com/download/symbols','sxe ld:mso','g','.reload','? mso','lmm m','lm m','dq mso+194f000 L600','q') -Encoding ASCII
        $p = Start-Process -FilePath $cdb -ArgumentList '-cf','a.txt','-logo','out\passA.txt',$ww,'/n' -PassThru -WindowStyle Hidden
        $sw = [Diagnostics.Stopwatch]::StartNew()
        while (-not $p.HasExited -and $sw.Elapsed.TotalSeconds -lt 260) { Start-Sleep 3 }
        Stop-Process -Name WINWORD,cdb -Force -EA SilentlyContinue
        Start-Sleep 2
        $raw = Get-Content out\passA.txt -Raw -EA SilentlyContinue
        if (-not $raw) { throw "passA empty: cdb produced nothing" }
        # cdb prints addresses as 00007ff9`12345678 (8+backtick+8), so a fixed 16-char class never
        # matches; take the module base from the lmm line and strip backticks before parsing.
        $base = $null
        foreach ($l in ($raw -split "`r?`n")) {
          if ($l -match '^\s*([0-9a-f`]+)\s+([0-9a-f`]+)\s+mso\s') { $base = [Convert]::ToUInt64(($matches[1] -replace '`',''),16); break }
        }
        if (-not $base) { foreach ($l in ($raw -split "`r?`n")) {
          if ($l -match '=\s*([0-9a-f`]{17})') { $base = [Convert]::ToUInt64(($matches[1] -replace '`',''),16); break } } }
        "base=0x{0:x}" -f [uint64]$base | Tee-Object out\passB_prep.txt
        $rv = @()
        foreach ($l in ($raw -split "`r?`n")) {
          $toks = @($l.Trim() -split '\s+' | Where-Object { $_ -match '^[0-9a-f`]{8,17}$' })
          if ($toks.Count -lt 2) { continue }
          foreach ($vt in ($toks | Select-Object -Skip 1)) {
            if ($vt.Length -lt 16) { continue }
            $val = [Convert]::ToUInt64(($vt -replace '`',''),16)
            if ($base -and $val -ge $base -and ($val - $base) -lt 0x2000000 -and ($val -band 7) -eq 0) {
              $rv += ('{0:x}' % ($val - $base))
            }
          }
        }
        $rv = @($rv | Select-Object -Unique)
        "pointers_into_image=$($rv.Count)" | Tee-Object -Append out\passB_prep.txt
        ($rv | Select-Object -First 120) | Set-Content out\rv.txt -Encoding ASCII
    - name: Pass B - resolve names for each slot target
      shell: pwsh
      run: |
        $cdb = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
        $ww = 'C:\Program Files\Microsoft Office\root\Office16\WINWORD.EXE'
        $rv = @(Get-Content out\rv.txt -EA SilentlyContinue)
        if ($rv.Count -eq 0) { throw "no slot targets resolved in pass A" }
        $cmds = @('.sympath srv*C:\sym*https://msdl.microsoft.com/download/symbols','sxe ld:mso','g','.reload')
        foreach ($r in $rv) { $cmds += ('.printf "SLOT rva={0} ->\\n"; ln mso+{0}' -f $r) }
        $cmds += 'q'
        Set-Content -Path b.txt -Value $cmds -Encoding ASCII
        $p = Start-Process -FilePath $cdb -ArgumentList '-cf','b.txt','-logo','out\passB.txt',$ww,'/n' -PassThru -WindowStyle Hidden
        $sw = [Diagnostics.Stopwatch]::StartNew()
        while (-not $p.HasExited -and $sw.Elapsed.TotalSeconds -lt 300) { Start-Sleep 3 }
        Stop-Process -Name WINWORD,cdb -Force -EA SilentlyContinue
        Start-Sleep 2
        "passB_lines=$( @(Get-Content out\passB.txt -EA SilentlyContinue).Count )" | Tee-Object -Append out\passB_prep.txt
        (Get-Content out\passB.txt | Where-Object { $_ -match 'SLOT rva=|^mso\+|start of|+0x' } | Select-Object -First 200) | Tee-Object -Append out\passB_prep.txt
    - name: Upload
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mso-didat-resolve-x64
        path: |
          out
          ver.txt
