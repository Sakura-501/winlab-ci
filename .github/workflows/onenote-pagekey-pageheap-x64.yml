name: onenote-pagekey-pageheap-x64
# OneNote find-path arm against the onmain!CFindPageHitList::IsPageHit stack copy.
#
# Static side (findings/MSRC/M365-Insider/onenote-find-pagehit-stackoverflow-20260926/STATE.md SS16):
# in the in-service build 16.0.20430.20092 the function initialises a 20-byte stack slot
# (sp+0x10: 16-byte Jot::c_gosidNull + a 4-byte dword) and then calls
#   Memory::Copy(atom+8, sp+0x10, [atom+4] & 0x3fffffff)
# with no comparison against 0x14 anywhere; the only precondition is bit26 of the property's
# type dword, which is the low bit of the file-side 5-bit value type tag (odd tags, VT_BINARY=7
# among them). Every ty==7 property value in a real .one carries its own u32 length, so a
# size-invariant edit of that dword is the carrier - 30 variants over 10 sites, generated on the
# runner from the base file with ppseed/mk_pagekey_carriers.py.
#
# The VM cannot run this arm: `query user` shows the console session Active but LogonUI is
# running, and the find step needs keystrokes. The runner job does sit in an interactive session
# (session self-test prints it), which is the channel the project already uses for windowed
# browser measurements.
'on':
  workflow_dispatch:
    inputs:
      cap:
        description: 'max carriers'
        required: false
        default: '31'
      query:
        description: 'find query string'
        required: false
        default: 'a'
      dirs:
        description: 'which carrier dirs to sweep (corpus | corpus2 | both)'
        required: false
        default: 'both'
      mode:
        description: 'both = Ctrl+E then Ctrl+F; findpage = only the in-page find accelerator'
        required: false
        default: 'both'
jobs:
  t:
    runs-on: windows-latest
    timeout-minutes: 200
    steps:
    - uses: actions/checkout@v4

    - name: Download ODT
      shell: pwsh
      run: |
        $page = (Invoke-WebRequest -Uri "https://www.microsoft.com/en-us/download/details.aspx?id=49117" -UseBasicParsing).Content
        if ($page -match 'href="(https://download\.microsoft\.com/download/[^"]+officedeploymenttool[^"]*\.exe)"') {
          Invoke-WebRequest -Uri $Matches[1] -OutFile odt.exe
        } else { throw "odt link not found" }
        Start-Process -Wait -FilePath .\odt.exe -ArgumentList "/extract:odtx /quiet"

    - name: Install x64 Office (OneNote needed)
      shell: pwsh
      run: |
        $xml = '<Configuration><Add OfficeClientEdition="64" Channel="CurrentChannel"><Product ID="O365ProPlusRetail"><Language ID="en-us" /><ExcludeApp ID="OneDrive" /><ExcludeApp ID="Lync" /><ExcludeApp ID="Bing" /></Product></Add><Display Level="None" AcceptEULA="TRUE" /><Updates Enabled="FALSE" /></Configuration>'
        Set-Content -Path cfg.xml -Value $xml
        Start-Process -Wait -FilePath .\odtx\setup.exe -ArgumentList "/configure","cfg.xml"
        $o = Get-Item "C:\Program Files\Microsoft Office\root\Office16\ONENOTE.EXE" -EA SilentlyContinue
        if (-not $o) { throw "onenote install failed" }
        $om = Get-Item "C:\Program Files\Microsoft Office\root\Office16\onmain.dll" -EA SilentlyContinue
        "onenote v=$($o.VersionInfo.FileVersion) size=$($o.Length); onmain v=$($om.VersionInfo.FileVersion) size=$($om.Length)"
        $om.VersionInfo.FileVersion | Out-File ver.txt

    - name: Page heap for ONENOTE plus WER full dumps
      shell: pwsh
      run: |
        $log = "out\setup_log.txt"
        New-Item -ItemType Directory -Force -Path out, C:\dumps | Out-Null
        $gfs = @(Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Debuggers" -Recurse -Include gflags.exe -EA SilentlyContinue)
        $gf = @($gfs | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1)
        if (-not $gf) { $gf = @($gfs | Select-Object -First 1) }
        if ($gf) {
          try { & $gf.FullName /p /enable ONENOTE.EXE /full | Out-Null; "gflags_path=$($gf.FullName)" | Add-Content $log }
          catch { "gflags_unusable=$($gf.FullName) -> registry page heap only" | Add-Content $log }
        }
        $k = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\ONENOTE.EXE"
        New-Item -Path $k -Force | Out-Null
        Set-ItemProperty -Path $k -Name GlobalFlag -Value 0x02000000 -Type DWord
        Set-ItemProperty -Path $k -Name EnableVerifier -Value 1 -Type DWord
        Set-ItemProperty -Path $k -Name VerifierFlags -Value 0 -Type DWord
        Set-ItemProperty -Path $k -Name PageHeapFlags -Value 0x3 -Type DWord
        $ld = "HKLM:\SOFTWARE\Microsoft\Windows Error Reporting\LocalDumps"
        New-Item -Path $ld -Force | Out-Null
        Set-ItemProperty -Path $ld -Name DumpFolder -Value "C:\dumps" -Type ExpandString
        Set-ItemProperty -Path $ld -Name DumpType -Value 2 -Type DWord
        Set-ItemProperty -Path $ld -Name DumpCount -Value 40 -Type DWord
        "pageheap GlobalFlag=$((Get-ItemProperty $k).GlobalFlag) verifier=$((Get-ItemProperty $k).EnableVerifier)" | Tee-Object -FilePath $log -Append

    - name: Build carriers
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path corpus | Out-Null
        [IO.File]::WriteAllBytes("base_one.one", [Convert]::FromBase64String((Get-Content data\onebase.b64 -Raw)))
        [IO.File]::WriteAllBytes("base_two.one", [Convert]::FromBase64String((Get-Content data\onebase2.b64 -Raw)))
        $b = Get-Item base_one.one
        $b2 = Get-Item base_two.one
        "base_one=$($b.Length) bytes base_two=$($b2.Length) bytes"
        if ($b.Length -lt 10000 -or $b2.Length -lt 10000) { throw "base .one did not materialize" }
        $env:PK_ONE_PER_PID = "1"
        [IO.File]::WriteAllBytes("base_four.one", [Convert]::FromBase64String((Get-Content data\onebase4.b64 -Raw)))
        "base_four=" + (Get-Item base_four.one).Length + " bytes"
        python ppseed\mk_pagekey_carriers.py base_one.one corpus pk
        python ppseed\mk_pagekey_carriers.py base_two.one corpus2 qk
        python ppseed\mk_ty9_carriers.py base_four.one corpus3 t9
        [IO.File]::WriteAllBytes("base_five.one", [Convert]::FromBase64String((Get-Content data\onebase5.b64 -Raw)))
        [IO.File]::WriteAllBytes("base_six.one", [Convert]::FromBase64String((Get-Content data\onebase6.b64 -Raw)))
        "base_five=" + (Get-Item base_five.one).Length + " base_six=" + (Get-Item base_six.one).Length
        python ppseed\mk_pagekey_carriers.py base_five.one corpus4 rk
        python ppseed\mk_pagekey_carriers.py base_six.one corpus5 sk
        $n = @(Get-ChildItem corpus, corpus2, corpus3, corpus4, corpus5 -Filter *.one -File).Count
        # every dir needs its own unmutated twin, otherwise "no dump" cannot be separated from
        # "OneNote never opened any file of this shape"
        Copy-Item base_one.one corpus\zz_baseline.one -Force
        Copy-Item base_two.one corpus2\zz_baseline.one -Force
        Copy-Item base_four.one corpus3\zz_baseline.one -Force
        Copy-Item base_five.one corpus4\zz_baseline.one -Force
        Copy-Item base_six.one corpus5\zz_baseline.one -Force
        foreach ($dd in @('corpus','corpus2','corpus3','corpus4','corpus5')) {
          $bl = @(Get-ChildItem $dd -Filter zz_baseline.one -EA SilentlyContinue).Count
          "$dd files=$(@(Get-ChildItem $dd -Filter *.one -File).Count) baseline=$bl"
        }
        "carriers=$n (plus 2 baselines)"
        if ($n -lt 24) { throw "carrier generation failed ($n)" }
        (Get-ChildItem corpus\manifest.txt, corpus2\manifest.txt -EA SilentlyContinue | ForEach-Object { Get-Content $_ }) -join "`n"

    - name: Positive control - page heap must be loaded in ONENOTE
      shell: pwsh
      run: |
        $exe = "C:\Program Files\Microsoft Office\root\Office16\ONENOTE.EXE"
        $k2 = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\ONENOTE.EXE"
        # The "How do you want to start OneNote?" bambino dialog is a per-profile first-run state;
        # turning it off up front keeps every later window title a document window.
        foreach ($rk in @('HKCU:\Software\Microsoft\Office\16.0\ONENOTE\Options',
                          'HKCU:\Software\Microsoft\Office\15.0\ONENOTE\Options')) {
          New-Item -Path $rk -Force -EA SilentlyContinue | Out-Null
          Set-ItemProperty -Path $rk -Name EnableBambino -Value 0 -Type DWord -EA SilentlyContinue
        }
        ("bambino HKCU16={0} HKCU15={1}" -f (Get-ItemProperty 'HKCU:\Software\Microsoft\Office\16.0\ONENOTE\Options' -EA SilentlyContinue).EnableBambino,
          (Get-ItemProperty 'HKCU:\Software\Microsoft\Office\15.0\ONENOTE\Options' -EA SilentlyContinue).EnableBambino) | Tee-Object -FilePath out\control.txt
        Add-Type -AssemblyName System.Windows.Forms,System.Drawing
        $sig = '[DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h); [DllImport("user32.dll")] public static extern bool ShowWindowAsync(IntPtr h, int n);'
        $w32pre = Add-Type -MemberDefinition $sig -Name W32a -Namespace WinA -PassThru
        $p = Start-Process -FilePath $exe -ArgumentList "/nologo" -PassThru
        $ver = 0; $title = ''
        for ($i = 0; $i -lt 45; $i++) {
          Start-Sleep -Seconds 2
          try {
            $mods = @($p.Modules | ForEach-Object { $_.ModuleName.ToLower() })
            if ($mods -contains 'verifier.dll') { $ver = 1 }
          } catch { }
          $tt = @(Get-Process ONENOTE -EA SilentlyContinue | ForEach-Object { $_.MainWindowTitle } | Where-Object { $_ })
          if ($tt.Count) { $title = $tt[0] }
          if ($ver -eq 1 -and $title) { break }
          if ($p.HasExited) { break }
        }
        "CONTROL verifier_loaded=$ver title=$title exited=$($p.HasExited)" | Tee-Object -FilePath out\control.txt
        $k2v = Get-ItemProperty $k2
        "CONTROL readback GlobalFlag=$($k2v.GlobalFlag) PageHeapFlags=$($k2v.PageHeapFlags) EnableVerifier=$($k2v.EnableVerifier)" | Add-Content out\control.txt
        # Clear the first-run experience ("How do you want to start OneNote?"): {ESC} makes OneNote exit
        # with code 0 and no document is ever opened, which is what made run 36506481092's opened=1 rows vacuous.
        $fr = 0
        for ($i = 0; $i -lt 8; $i++) {
          $ps = @(Get-Process ONENOTE -EA SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 })
          if (-not $ps.Count) { break }
          $tt = "" + $ps[0].MainWindowTitle
          if ($tt -notlike '*start OneNote*') { break }
          $fr = 1
          try {
            [void]$w32pre::ShowWindowAsync($ps[0].MainWindowHandle, 9)
            [void]$w32pre::SetForegroundWindow($ps[0].MainWindowHandle)
            Start-Sleep -Milliseconds 400
            [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
          } catch { "firstrun_send_fail " + $_.Exception.Message | Add-Content out\control.txt }
          Start-Sleep -Seconds 3
        }
        ("FIRSTRUN seen={0} procs_after={1}" -f $fr, @(Get-Process ONENOTE -EA SilentlyContinue).Count) | Add-Content out\control.txt
        Get-Process ONENOTE -EA SilentlyContinue | Stop-Process -Force -EA SilentlyContinue
        if ($ver -ne 1 -and $k2v.EnableVerifier -ne 1) { throw "page heap neither loaded into ONENOTE nor present in IFEO: every dump=0 row below would be an instrument failure" }
        if ($fr -eq 1) {
          $still = @(Get-Process ONENOTE -EA SilentlyContinue | ForEach-Object { "" + $_.MainWindowTitle } | Where-Object { $_ -like '*start OneNote*' })
          if ($still.Count) { throw "the first-run window is still up after {ENTER}: no carrier could reach OneNote, so every dump=0 row would be an instrument artifact" }
        }

    - name: Open each carrier, run the find, watch for faults
      shell: pwsh
      run: |
        $exe = "C:\Program Files\Microsoft Office\root\Office16\ONENOTE.EXE"
        $log = "out\sweep_log.txt"
        $query = '${{ github.event.inputs.query }}'
        $cap = [int]('${{ github.event.inputs.cap }}')
        if ($cap -le 0) { $cap = 31 }
        $mode = '${{ github.event.inputs.mode }}'
        $prim = '^e'
        if ($mode -eq 'findpage') { $prim = '^f' }
        "mode=$mode prim=$prim"
        Add-Type -AssemblyName System.Windows.Forms,System.Drawing
        Add-Type -AssemblyName UIAutomationClient,UIAutomationTypes,WindowsBase
        $AE = [System.Windows.Automation.AutomationElement]
        $TRUEC = [System.Windows.Automation.Condition]::TrueCondition
        $SC = [System.Windows.Automation.TreeScope]
        $INVP = [System.Windows.Automation.InvokePattern]
        $VALP = [System.Windows.Automation.ValuePattern]
        function UiaWins {
          $pids = @(Get-Process ONENOTE -EA SilentlyContinue | ForEach-Object { $_.Id })
          $r = @()
          try {
            foreach ($w in $script:AE::RootElement.FindAll($script:SC::Children, $script:TRUEC)) {
              try { if ($pids -contains $w.Current.ProcessId) { $r += $w } } catch { }
            }
          } catch { }
          return ,$r
        }
        function UiaDesc($w) { try { return @($w.FindAll($script:SC::Descendants, $script:TRUEC)) } catch { return @() } }
        function UiaDismiss {
          $n = 0
          foreach ($w in (UiaWins)) {
            foreach ($e in (UiaDesc $w)) {
              try {
                if ($e.Current.IsInvokePatternAvailable -and $e.Current.Name -match '^(Continue for free|Not now|No thanks|Maybe later|Skip|Later|Start using)$') {
                  ($e.GetCurrentPattern($script:INVP::Pattern)).Invoke(); $n++; Start-Sleep -Seconds 2
                }
              } catch { }
            }
          }
          return $n
        }
        function UiaAllWins { $r=@(); try { foreach ($w in $script:AE::RootElement.FindAll($script:SC::Children, $script:TRUEC)) { $r += $w } } catch { }; return ,$r }
        function UiaModal {
          $m = 0
          foreach ($w in (UiaAllWins)) { foreach ($e in (UiaDesc $w)) { try { if ($e.Current.Name -match 'Welcome to free|Continue for free|How do you want to start|Get more with a trial|View plan options') { $m = 1 } } catch { } } }
          return $m
        }
        function UiaClickDismiss {
          $n = 0
          foreach ($w in (UiaAllWins)) {
            foreach ($e in (UiaDesc $w)) {
              try {
                $nm = $e.Current.Name
                if ($nm -match '^(Continue for free|Not now|No thanks|Maybe later|Skip|Later|Start using|I have a subscription or product key)$') {
                  $done = $false
                  try {
                    if ($e.Current.IsLegacyIAccessiblePatternAvailable) { ($e.GetCurrentPattern([System.Windows.Automation.LegacyIAccessiblePattern]::Pattern)).DoDefaultAction(); $done = $true; $n++ }
                  } catch { }
                  if (-not $done) {
                    try {
                      $cp = $e.Current.ClickablePoint
                      if ($cp.IsEmpty) { $r = $e.Current.BoundingRectangle; $cx = [int](($r.Left + $r.Right) / 2); $cy = [int](($r.Top + $r.Bottom) / 2) } else { $cx = [int]$cp.X; $cy = [int]$cp.Y }
                      [void]$script:w32::SetForegroundWindow($w.Current.NativeWindowHandle)
                      [void]$script:w32::SetCursorPos($cx, $cy); Start-Sleep -Milliseconds 250
                      [void]$script:w32::mouse_event(0x0002, 0, 0, 0, 0); [void]$script:w32::mouse_event(0x0004, 0, 0, 0, 0)
                      $done = $true; $n++
                    } catch { }
                  }
                  "click_dismiss name=$nm done=$done" | Add-Content out\sweep_extra.txt
                  Start-Sleep -Seconds 2
                }
              } catch { }
            }
          }
          return $n
        }
        function UiaNames([string]$tag) {
          $lines = @()
          foreach ($w in (UiaWins)) {
            $all = UiaDesc $w
            $lines += "win title=$($w.Current.Name) descendants=$($all.Count)"
            $k = 0
            foreach ($e in $all) {
              if ($k -ge 60) { break }
              try {
                $nm = $e.Current.Name; $ct = $e.Current.ControlType.ProgrammaticName
                $ok = $e.Current.IsInvokePatternAvailable; $ov = $e.Current.IsValuePatternAvailable; $oa = $e.Current.IsKeyboardFocusable
                if ($nm -or $ov -or $ok) { $lines += "  [$k] $ct name=$nm inv=$ok val=$ov foc=$oa auto=$($e.Current.AutomationId)"; $k++ }
              } catch { }
            }
          }
          $lines -join "`r`n" | Add-Content out\sweep_extra.txt
        }
        function UiaSearch([string]$q) {
          $n = 0
          foreach ($w in (UiaWins)) {
            foreach ($e in (UiaDesc $w)) {
              try {
                if ($e.Current.IsInvokePatternAvailable -and $e.Current.Name -match 'Search|Find|Look up') {
                  ($e.GetCurrentPattern($script:INVP::Pattern)).Invoke(); $n++; Start-Sleep -Seconds 2; break
                }
              } catch { }
            }
            foreach ($e in (UiaDesc $w)) {
              try {
                if ($e.Current.IsValuePatternAvailable -and $e.Current.ControlType.ProgrammaticName -match 'Edit|ComboBox') {
                  ($e.GetCurrentPattern($script:VALP::Pattern)).SetValue($q); $n++; Start-Sleep -Seconds 2
                  try { if ($e.Current.IsInvokePatternAvailable) { ($e.GetCurrentPattern($script:INVP::Pattern)).Invoke() } } catch { }
                  break
                }
              } catch { }
            }
          }
          return $n
        }
        $sig = '[DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h); [DllImport("user32.dll")] public static extern bool ShowWindowAsync(IntPtr h, int n); [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y); [DllImport("user32.dll")] public static extern void mouse_event(uint f, uint x, uint y, uint d, int e);'
        $w32 = Add-Type -MemberDefinition $sig -Name W32b -Namespace Win2 -PassThru
        function DumpList { @(Get-ChildItem C:\dumps -EA SilentlyContinue | ForEach-Object { $_.Name }) }
        function Shot($tag) {
          try {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.X, $b.Y, 0, 0, $bmp.Size)
            $bmp.Save(('out\shots\' + $tag + '.png'))
            $g.Dispose(); $bmp.Dispose()
          } catch { "shot_failed $tag " + $_.Exception.Message | Add-Content out\sweep_extra.txt }
        }
        New-Item -ItemType Directory -Force -Path out\shots | Out-Null
        $dirs = @('corpus', 'corpus2', 'corpus3')
        $want = '${{ github.event.inputs.dirs }}'
        if ($want -ne 'both') { $dirs = @($want.Split(',')) }
        $files = @(Get-ChildItem $dirs -Filter *.one | Sort-Object Name | Select-Object -First $cap)
        "cases=$($files.Count) dirs=$($dirs -join ',')" | Tee-Object -FilePath $log
        if ($files.Count -lt 1) { throw "corpus not materialized in $($dirs -join ' and ') (cases=$($files.Count))" }
        $bad = @(); $unopened = @(); $nosend = @(); $docSeen = 0
        foreach ($f in $files) {
          $before = DumpList
          Set-Content -Path ($f.FullName + ':Zone.Identifier') -Value "[ZoneTransfer]`r`nZoneId=3" -Encoding ASCII
          $streams = (@(Get-Item $f.FullName -Stream * | ForEach-Object { $_.Stream }) -join ",")
          $t0 = Get-Date
          $p = Start-Process -FilePath $exe -ArgumentList ('"' + $f.FullName + '"') -PassThru
          $alive = 1; $opened = 0; $ver = 0; $exit = ''; $title = ''; $sent = 0
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 2
            try { if ($p.HasExited) { $alive = 0; $exit = '0x' + ('{0:X8}' -f $p.ExitCode); break } } catch { $alive = 0; break }
            try { if (@($p.Modules | Where-Object { $_.ModuleName -ieq 'verifier.dll' }).Count) { $ver = 1 } } catch { }
            $tt = @(Get-Process ONENOTE -EA SilentlyContinue | ForEach-Object { $_.MainWindowTitle } | Where-Object { $_ })
            $title = ($tt | Where-Object { $_ -like '*Microsoft OneNote' -and $_ -ne 'Microsoft OneNote' } | Select-Object -First 1)
            if (-not $title) { $title = ($tt | Select-Object -First 1) }
            if ($title -like '*Microsoft OneNote' -and $title -ne 'Microsoft OneNote') { $opened = 1; break }
            if ("" + ($tt | Select-Object -First 1) -like '*start OneNote*') {
              $d = UiaDismiss
              if ($d -eq 0) {
                try { [void]$w32::ShowWindowAsync((@(Get-Process ONENOTE -EA SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 })[0]).MainWindowHandle, 9); [void]$w32::SetForegroundWindow((@(Get-Process ONENOTE -EA SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 })[0]).MainWindowHandle); [System.Windows.Forms.SendKeys]::SendWait("{ENTER}") } catch { }
              }
              "firstrun_dismiss $($f.Name) uia=$d" | Add-Content out\sweep_extra.txt
            }
            if ((DumpList).Count -gt $before.Count) { break }
          }
          if ($opened -eq 1 -and $alive -eq 1) {
            # The free-OneNote upsell ("Welcome to free Microsoft OneNote" / Continue for free) and the
            # first-run picker are modal and take the foreground, so keystrokes never reach OneNote's
            # search box. Dismiss every dialog button we can name, up to three rounds.
            $mg = 1
            for ($r = 0; $r -lt 6; $r++) {
              [void](UiaDismiss); [void](UiaClickDismiss)
              $mg = UiaModal
              "modal_gate round=$r still_modal=$mg" | Add-Content out\sweep_extra.txt
              if ($mg -eq 0) { break }
              Start-Sleep -Seconds 2
            }
            if ($mg -ne 0) { "INSTRUMENT_FAIL $($f.Name) modal_never_dismissed" | Add-Content out\sweep_extra.txt; throw "instrument fail: upsell modal still on top for $($f.Name)" }
            "upsell_dismissed $($f.Name)" | Add-Content out\sweep_extra.txt
            $h = 0
            foreach ($pr in @(Get-Process ONENOTE -EA SilentlyContinue)) { if ($pr.MainWindowHandle -ne 0) { $h = $pr.MainWindowHandle; break } }
            if ($h) {
              [void]$w32::ShowWindowAsync($h, 9); Start-Sleep -Milliseconds 400
              [void]$w32::SetForegroundWindow($h); Start-Sleep -Milliseconds 400
              # The hit list that calls IsPageHit is the notebook-wide Search's, and OneNote's
              # search-box accelerator differs by version (Ctrl+E in the desktop client, Ctrl+F in
              # others), so both are fired and each is followed by its own query+Enter.
              try {
                [System.Windows.Forms.SendKeys]::SendWait($prim)
                Start-Sleep -Milliseconds 1500
                [System.Windows.Forms.SendKeys]::SendWait($query)
                Start-Sleep -Milliseconds 800
                [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
                Start-Sleep -Seconds 4
                [System.Windows.Forms.SendKeys]::SendWait($prim)
                Start-Sleep -Milliseconds 800
                [System.Windows.Forms.SendKeys]::SendWait("{ESC}")
                [System.Windows.Forms.SendKeys]::SendWait("^f")
                Start-Sleep -Milliseconds 1500
                [System.Windows.Forms.SendKeys]::SendWait($query)
                Start-Sleep -Milliseconds 800
                [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
                Start-Sleep -Seconds 4
                $sent = 1
              } catch { "sendkeys_fail $($f.Name) " + $_.Exception.Message | Add-Content out\sweep_extra.txt }
              for ($r = 0; $r -lt 2; $r++) { if ((UiaDismiss) -eq 0) { break }; Start-Sleep -Seconds 2 }
              # 模态窗在按键时仍在最前（05:43 截图实证），所以这里改成用 UIA 直接操作查找控件本身：
              # 先枚举可用 Edit，SetFocus + SetValue + ENTER；一个都取不到就 INSTRUMENT_FAIL 退出，
              # 绝不再产出"零故障"这种无法自证的读数。
              $edits = @()
              foreach ($w3 in (UiaWins)) {
                foreach ($e3 in (UiaDesc $w3)) {
                  try { if ($e3.Current.ControlType.ProgrammaticName -match 'Edit|ComboBox' -and $e3.Current.IsValuePatternAvailable) { $edits += $e3 } } catch { }
                }
              }
              "edit_ctl " + $f.Name + " n=" + $edits.Count + " names=" + ((@($edits | ForEach-Object { $_.Current.Name + '/' + $_.Current.AutomationId })) -join ';') | Add-Content out\sweep_extra.txt
              if ($edits.Count -eq 0) {
                $modal = 0
                foreach ($w4 in (UiaWins)) { foreach ($e4 in (UiaDesc $w4)) { try { if ($e4.Current.Name -match 'Welcome to free|Continue for free|How do you want to start') { $modal = 1 } } catch { } } }
                "INSTRUMENT_FAIL " + $f.Name + " no_edit_control modal=" + $modal | Add-Content out\sweep_extra.txt
                throw ("instrument fail: no addressable find control for " + $f.Name)
              }
              $tgt = $edits[-1]
              try {
                $tgt.SetFocus(); Start-Sleep -Milliseconds 500
                ($tgt.GetCurrentPattern($script:VALP::Pattern)).SetValue($query)
                Start-Sleep -Milliseconds 700
                [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
                $sent = 1
                "uia_find_ok " + $f.Name | Add-Content out\sweep_extra.txt
              } catch { "uia_find_FAIL " + $f.Name + " " + $_.Exception.Message | Add-Content out\sweep_extra.txt }
              Start-Sleep -Seconds 6
              UiaNames ("post_uia_find " + $f.Name)
              $dd = @(Get-ChildItem C:\dumps -EA SilentlyContinue)
              "post_uia_dumps " + $f.Name + " n=" + $dd.Count | Add-Content out\sweep_extra.txt
              try {
                [void]$w32::SetForegroundWindow($h); Start-Sleep -Milliseconds 500
                [System.Windows.Forms.SendKeys]::SendWait($prim)
                Start-Sleep -Milliseconds 1500
                [System.Windows.Forms.SendKeys]::SendWait($query)
                Start-Sleep -Milliseconds 800
                [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
                Start-Sleep -Seconds 5
              } catch { "sendkeys2_fail $($f.Name) " + $_.Exception.Message | Add-Content out\sweep_extra.txt }
              $uw = @(UiaWins).Count
              UiaNames ("post_keys " + $f.Name)
              $ui = UiaSearch $query
              "uia_pass $($f.Name) wins=$uw search_hits=$ui" | Add-Content out\sweep_extra.txt
              if ($ui -gt 0) { $sent = 1 }
              # 实测作用域是 All Notebooks，而独立 .one 挂在 Open Sections 下不参与笔记本索引，
              # 所以把元素树里所有作用域/页内查找相关的可调用项逐个 Invoke 后再补一次查询。
              $sc = 0
              foreach ($w2 in (UiaWins)) {
                foreach ($e2 in (UiaDesc $w2)) {
                  try {
                    $nm2 = $e2.Current.Name
                    if ($nm2 -match 'No matches|Find on page|Current Section|This Section|Open Section|Current Page|All Notebooks') {
                      "scope_el $($f.Name) | $($e2.Current.ControlType.ProgrammaticName) | $nm2 | inv=$($e2.Current.IsInvokePatternAvailable)" | Add-Content out\sweep_extra.txt
                      if ($e2.Current.IsInvokePatternAvailable) { ($e2.GetCurrentPattern($script:INVP::Pattern)).Invoke(); $sc++; Start-Sleep -Seconds 3 }
                    }
                  } catch { }
                }
              }
              "scope_invoke $($f.Name) n=$sc" | Add-Content out\sweep_extra.txt
              Start-Sleep -Seconds 2
              try {
                [void]$w32::SetForegroundWindow($h); Start-Sleep -Milliseconds 400
                [System.Windows.Forms.SendKeys]::SendWait($query); Start-Sleep -Milliseconds 900
                [System.Windows.Forms.SendKeys]::SendWait("{ENTER}"); Start-Sleep -Seconds 5
              } catch { "sendkeys3_fail $($f.Name) " + $_.Exception.Message | Add-Content out\sweep_extra.txt }
              UiaNames ("post_scope " + $f.Name)
            }
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Seconds 2
              if ((DumpList).Count -gt $before.Count) { break }
              try { if ($p.HasExited) { $alive = 0; $exit = '0x' + ('{0:X8}' -f $p.ExitCode); break } } catch { $alive = 0; break }
            }
          }
          if ($sent -eq 0) { $nosend += $f.Name }
          Shot $f.BaseName
          $after = DumpList
          $new = @($after | Where-Object { $before -notcontains $_ })
          $line = '{0,-34} alive={1} opened={2} sent={3} verifier={4} dumps={5} exit={6} s={7} streams={8} title={9}' -f $f.Name, $alive, $opened, $sent, $ver, $new.Count, $exit, [int]((Get-Date) - $t0).TotalSeconds, $streams, $title
          $line | Tee-Object -FilePath $log -Append
          if ($opened -eq 1) { $docSeen++ }
          if (-not $opened) { $unopened += $f.Name }
          if ($new.Count -or ($alive -eq 0 -and $opened -eq 1)) {
            $bad += $f.Name
            New-Item -ItemType Directory -Force -Path out\bad | Out-Null
            Copy-Item $f.FullName ('out\bad\CRASH_' + $f.Name) -Force -EA SilentlyContinue
            foreach ($d in $new) { Copy-Item ('C:\dumps\' + $d) ('out\bad\' + $d) -Force -EA SilentlyContinue }
          }
          Get-Process ONENOTE -EA SilentlyContinue | Stop-Process -Force -EA SilentlyContinue
          for ($i = 0; $i -lt 30; $i++) { if (-not (Get-Process ONENOTE -EA SilentlyContinue)) { break }; Start-Sleep -Milliseconds 500 }
        }
        "SUMMARY cases=$($files.Count) flagged=$($bad.Count) [$($bad -join ' ')]" | Tee-Object -FilePath $log -Append
        "unopened=$($unopened.Count) [$($unopened -join ' ')]" | Tee-Object -FilePath $log -Append
        "nosend=$($nosend.Count) [$($nosend -join ' ')]" | Tee-Object -FilePath $log -Append
        if ($unopened.Count * 20 -gt $files.Count) { throw "$($unopened.Count)/$($files.Count) carriers never opened a OneNote window: the sweep would read as clean without covering them (first: $($unopened[0]))" }
        if ($nosend.Count * 20 -gt $files.Count) { throw "$($nosend.Count)/$($files.Count) cases never got the find keystrokes: the find path was not exercised (first: $($nosend[0]))" }
        $nodoc = @()
        if ($docSeen -lt $files.Count / 2) { throw "only $docSeen/$($files.Count) cases reached a OneNote document window (title '<page> - Microsoft OneNote'): the sweep would read as clean without the documents ever opening" }
        "dumps_total=$((DumpList).Count)" | Tee-Object -FilePath $log -Append
        $bad -join "`r`n" | Out-File out\bad.txt

    - name: Attribute any dump to onmain
      if: always()
      shell: pwsh
      run: |
        $cdb = @("C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe",
                 "C:\Program Files (x86)\Windows Kits\10\Debuggers\arm64\cdb.exe") |
               Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
        $out = "out\attribution.txt"
        "cdb=$cdb" | Tee-Object -FilePath $out
        foreach ($d in @(Get-ChildItem out\bad -Filter *.dmp -EA SilentlyContinue)) {
          "== $($d.Name) ==" | Tee-Object -FilePath $out -Append
          if ($cdb) {
            & $cdb -z $d.FullName -c ".symfix srv*C:\\symbols*https://msdl.microsoft.com/download/symbols; .reload /f onmain.dll; |; .ecxr; k 24; lmvm onmain; q" 2>&1 | Select-Object -Last 80 | Tee-Object -FilePath $out -Append
          } else { "no cdb" | Tee-Object -FilePath $out -Append }
        }
        if (-not @(Get-ChildItem out\bad -Filter *.dmp -EA SilentlyContinue).Count) { "no dumps to attribute" | Tee-Object -FilePath $out -Append }

    - name: Report
      if: always()
      shell: pwsh
      run: |
        foreach ($f in @('out\sweep_log.txt','out\control.txt','out\attribution.txt','out\sweep_extra.txt')) {
          "##### $f"
          if (Test-Path $f) { Get-Content $f -Encoding Unicode | Select-Object -Last 90 } else { "missing" }
        }

    - name: Upload evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: onenote-pagekey-pageheap
        path: |
          out
          ver.txt
          corpus
