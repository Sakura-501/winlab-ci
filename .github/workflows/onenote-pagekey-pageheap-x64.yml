name: onenote-pagekey-pageheap-x64
# OneNote find-path arm against the onmain!CFindPageHitList::IsPageHit stack copy.
#
# Static side (findings/MSRC/M365-Insider/onenote-find-pagehit-stackoverflow-20260926/STATE.md SS16):
# in the in-service build 16.0.20430.20092 the function initialises a 20-byte stack slot
# (sp+0x10: 16-byte Jot::c_gosidNull + a 4-byte dword) and then calls
#   Memory::Copy(atom+8, sp+0x10, [atom+4] & 0x3fffffff)
# with no comparison against 0x14 anywhere; the only precondition is bit26 of the property's
# type dword, which is the low bit of the file-side 5-bit value type tag (odd tags, VT_BINARY=7
# among them). Every ty==7 property value in a real .one carries its own u32 length, so a
# size-invariant edit of that dword is the carrier - 30 variants over 10 sites, generated on the
# runner from the base file with ppseed/mk_pagekey_carriers.py.
#
# The VM cannot run this arm: `query user` shows the console session Active but LogonUI is
# running, and the find step needs keystrokes. The runner job does sit in an interactive session
# (session self-test prints it), which is the channel the project already uses for windowed
# browser measurements.
'on':
  workflow_dispatch:
    inputs:
      cap:
        description: 'max carriers'
        required: false
        default: '31'
      query:
        description: 'find query string'
        required: false
        default: 'a'
jobs:
  t:
    runs-on: windows-latest
    timeout-minutes: 200
    steps:
    - uses: actions/checkout@v4

    - name: Download ODT
      shell: pwsh
      run: |
        $page = (Invoke-WebRequest -Uri "https://www.microsoft.com/en-us/download/details.aspx?id=49117" -UseBasicParsing).Content
        if ($page -match 'href="(https://download\.microsoft\.com/download/[^"]+officedeploymenttool[^"]*\.exe)"') {
          Invoke-WebRequest -Uri $Matches[1] -OutFile odt.exe
        } else { throw "odt link not found" }
        Start-Process -Wait -FilePath .\odt.exe -ArgumentList "/extract:odtx /quiet"

    - name: Install x64 Office (OneNote needed)
      shell: pwsh
      run: |
        $xml = '<Configuration><Add OfficeClientEdition="64" Channel="CurrentChannel"><Product ID="O365ProPlusRetail"><Language ID="en-us" /><ExcludeApp ID="OneDrive" /><ExcludeApp ID="Lync" /><ExcludeApp ID="Bing" /></Product></Add><Display Level="None" AcceptEULA="TRUE" /><Updates Enabled="FALSE" /></Configuration>'
        Set-Content -Path cfg.xml -Value $xml
        Start-Process -Wait -FilePath .\odtx\setup.exe -ArgumentList "/configure","cfg.xml"
        $o = Get-Item "C:\Program Files\Microsoft Office\root\Office16\ONENOTE.EXE" -EA SilentlyContinue
        if (-not $o) { throw "onenote install failed" }
        $om = Get-Item "C:\Program Files\Microsoft Office\root\Office16\onmain.dll" -EA SilentlyContinue
        "onenote v=$($o.VersionInfo.FileVersion) size=$($o.Length); onmain v=$($om.VersionInfo.FileVersion) size=$($om.Length)"
        $om.VersionInfo.FileVersion | Out-File ver.txt

    - name: Page heap for ONENOTE plus WER full dumps
      shell: pwsh
      run: |
        $log = "out\setup_log.txt"
        New-Item -ItemType Directory -Force -Path out, C:\dumps | Out-Null
        $gfs = @(Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Debuggers" -Recurse -Include gflags.exe -EA SilentlyContinue)
        $gf = @($gfs | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1)
        if (-not $gf) { $gf = @($gfs | Select-Object -First 1) }
        if ($gf) {
          try { & $gf.FullName /p /enable ONENOTE.EXE /full | Out-Null; "gflags_path=$($gf.FullName)" | Add-Content $log }
          catch { "gflags_unusable=$($gf.FullName) -> registry page heap only" | Add-Content $log }
        }
        $k = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\ONENOTE.EXE"
        New-Item -Path $k -Force | Out-Null
        Set-ItemProperty -Path $k -Name GlobalFlag -Value 0x02000000 -Type DWord
        Set-ItemProperty -Path $k -Name EnableVerifier -Value 1 -Type DWord
        Set-ItemProperty -Path $k -Name VerifierFlags -Value 0 -Type DWord
        Set-ItemProperty -Path $k -Name PageHeapFlags -Value 0x3 -Type DWord
        $ld = "HKLM:\SOFTWARE\Microsoft\Windows Error Reporting\LocalDumps"
        New-Item -Path $ld -Force | Out-Null
        Set-ItemProperty -Path $ld -Name DumpFolder -Value "C:\dumps" -Type ExpandString
        Set-ItemProperty -Path $ld -Name DumpType -Value 2 -Type DWord
        Set-ItemProperty -Path $ld -Name DumpCount -Value 40 -Type DWord
        "pageheap GlobalFlag=$((Get-ItemProperty $k).GlobalFlag) verifier=$((Get-ItemProperty $k).EnableVerifier)" | Tee-Object -FilePath $log -Append

    - name: Build carriers
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path corpus | Out-Null
        Cert-Util -decode data\onebase.b64 base_one.one | Out-Null
        $b = Get-Item base_one.one
        "base_one=$($b.Length) bytes"
        if ($b.Length -lt 10000) { throw "base .one did not materialize" }
        python ppseed\mk_pagekey_carriers.py base_one.one corpus
        $n = @(Get-ChildItem corpus -Filter *.one -File).Count
        Copy-Item base_one.one corpus\zz_baseline.one -Force
        "carriers=$n (plus baseline)"
        if ($n -lt 20) { throw "carrier generation failed ($n)" }
        (Get-ChildItem corpus\manifest.txt -EA SilentlyContinue | ForEach-Object { Get-Content $_ }) -join "`n"

    - name: Positive control - page heap must be loaded in ONENOTE
      shell: pwsh
      run: |
        $exe = "C:\Program Files\Microsoft Office\root\Office16\ONENOTE.EXE"
        $k2 = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\ONENOTE.EXE"
        $p = Start-Process -FilePath $exe -ArgumentList "/nologo" -PassThru
        $ver = 0; $title = ''
        for ($i = 0; $i -lt 45; $i++) {
          Start-Sleep -Seconds 2
          try {
            $mods = @($p.Modules | ForEach-Object { $_.ModuleName.ToLower() })
            if ($mods -contains 'verifier.dll') { $ver = 1 }
          } catch { }
          $tt = @(Get-Process ONENOTE -EA SilentlyContinue | ForEach-Object { $_.MainWindowTitle } | Where-Object { $_ })
          if ($tt.Count) { $title = $tt[0] }
          if ($ver -eq 1 -and $title) { break }
          if ($p.HasExited) { break }
        }
        "CONTROL verifier_loaded=$ver title=$title exited=$($p.HasExited)" | Tee-Object -FilePath out\control.txt
        $k2v = Get-ItemProperty $k2
        "CONTROL readback GlobalFlag=$($k2v.GlobalFlag) PageHeapFlags=$($k2v.PageHeapFlags) EnableVerifier=$($k2v.EnableVerifier)" | Add-Content out\control.txt
        Get-Process ONENOTE -EA SilentlyContinue | Stop-Process -Force -EA SilentlyContinue
        if ($ver -ne 1 -and $k2v.EnableVerifier -ne 1) { throw "page heap neither loaded into ONENOTE nor present in IFEO: every dump=0 row below would be an instrument failure" }

    - name: Open each carrier, run the find, watch for faults
      shell: pwsh
      run: |
        $exe = "C:\Program Files\Microsoft Office\root\Office16\ONENOTE.EXE"
        $log = "out\sweep_log.txt"
        $query = '${{ github.event.inputs.query }}'
        $cap = [int]('${{ github.event.inputs.cap }}')
        if ($cap -le 0) { $cap = 31 }
        Add-Type -AssemblyName System.Windows.Forms,System.Drawing
        $sig = "[DllImport(\"user32.dll\")] public static extern bool SetForegroundWindow(IntPtr h); [DllImport(\"user32.dll\")] public static extern bool ShowWindowAsync(IntPtr h, int n);"
        $w32 = Add-Type -MemberDefinition $sig -Name W32b -Namespace Win2 -PassThru
        function DumpList { @(Get-ChildItem C:\dumps -EA SilentlyContinue | ForEach-Object { $_.Name }) }
        function Shot($tag) {
          try {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.X, $b.Y, 0, 0, $bmp.Size)
            $bmp.Save(('out\shots\' + $tag + '.png'))
            $g.Dispose(); $bmp.Dispose()
          } catch { "shot_failed $tag " + $_.Exception.Message | Add-Content out\sweep_extra.txt }
        }
        New-Item -ItemType Directory -Force -Path out\shots | Out-Null
        $files = @(Get-ChildItem corpus -Filter *.one | Sort-Object Name | Select-Object -First $cap)
        "cases=$($files.Count)" | Tee-Object -FilePath $log
        if ($files.Count -lt 20) { throw "corpus not materialized in corpus\ (cases=$($files.Count))" }
        $bad = @(); $unopened = @(); $nosend = @()
        foreach ($f in $files) {
          $before = DumpList
          Set-Content -Path ($f.FullName + ':Zone.Identifier') -Value "[ZoneTransfer]`r`nZoneId=3" -Encoding ASCII
          $streams = (@(Get-Item $f.FullName -Stream * | ForEach-Object { $_.Stream }) -join ",")
          $t0 = Get-Date
          $p = Start-Process -FilePath $exe -ArgumentList ('"' + $f.FullName + '"') -PassThru
          $alive = 1; $opened = 0; $ver = 0; $exit = ''; $title = ''; $sent = 0
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 2
            try { if ($p.HasExited) { $alive = 0; $exit = '0x' + ('{0:X8}' -f $p.ExitCode); break } } catch { $alive = 0; break }
            try { if (@($p.Modules | Where-Object { $_.ModuleName -ieq 'verifier.dll' }).Count) { $ver = 1 } } catch { }
            $tt = @(Get-Process ONENOTE -EA SilentlyContinue | ForEach-Object { $_.MainWindowTitle } | Where-Object { $_ })
            $title = ($tt | Select-Object -First 1)
            if ($title -like '*OneNote*') { $opened = 1; break }
            if ((DumpList).Count -gt $before.Count) { break }
          }
          if ($opened -eq 1 -and $alive -eq 1) {
            $h = 0
            foreach ($pr in @(Get-Process ONENOTE -EA SilentlyContinue)) { if ($pr.MainWindowHandle -ne 0) { $h = $pr.MainWindowHandle; break } }
            if ($h) {
              [void]$w32::ShowWindowAsync($h, 9); Start-Sleep -Milliseconds 400
              [void]$w32::SetForegroundWindow($h); Start-Sleep -Milliseconds 400
              try {
                [System.Windows.Forms.SendKeys]::SendWait("{ESC}")
                Start-Sleep -Milliseconds 600
                [System.Windows.Forms.SendKeys]::SendWait("^f")
                Start-Sleep -Milliseconds 1500
                [System.Windows.Forms.SendKeys]::SendWait($query)
                Start-Sleep -Milliseconds 800
                [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
                $sent = 1
              } catch { "sendkeys_fail $($f.Name) " + $_.Exception.Message | Add-Content out\sweep_extra.txt }
            }
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Seconds 2
              if ((DumpList).Count -gt $before.Count) { break }
              try { if ($p.HasExited) { $alive = 0; $exit = '0x' + ('{0:X8}' -f $p.ExitCode); break } } catch { $alive = 0; break }
            }
          }
          if ($sent -eq 0) { $nosend += $f.Name }
          Shot $f.BaseName
          $after = DumpList
          $new = @($after | Where-Object { $before -notcontains $_ })
          $line = '{0,-34} alive={1} opened={2} sent={3} verifier={4} dumps={5} exit={6} s={7} streams={8} title={9}' -f $f.Name, $alive, $opened, $sent, $ver, $new.Count, $exit, [int]((Get-Date) - $t0).TotalSeconds, $streams, $title
          $line | Tee-Object -FilePath $log -Append
          if (-not $opened) { $unopened += $f.Name }
          if ($new.Count -or ($alive -eq 0 -and $opened -eq 1)) {
            $bad += $f.Name
            New-Item -ItemType Directory -Force -Path out\bad | Out-Null
            Copy-Item $f.FullName ('out\bad\CRASH_' + $f.Name) -Force -EA SilentlyContinue
            foreach ($d in $new) { Copy-Item ('C:\dumps\' + $d) ('out\bad\' + $d) -Force -EA SilentlyContinue }
          }
          Get-Process ONENOTE -EA SilentlyContinue | Stop-Process -Force -EA SilentlyContinue
          for ($i = 0; $i -lt 30; $i++) { if (-not (Get-Process ONENOTE -EA SilentlyContinue)) { break }; Start-Sleep -Milliseconds 500 }
        }
        "SUMMARY cases=$($files.Count) flagged=$($bad.Count) [$($bad -join ' ')]" | Tee-Object -FilePath $log -Append
        "unopened=$($unopened.Count) [$($unopened -join ' ')]" | Tee-Object -FilePath $log -Append
        "nosend=$($nosend.Count) [$($nosend -join ' ')]" | Tee-Object -FilePath $log -Append
        if ($unopened.Count * 20 -gt $files.Count) { throw "$($unopened.Count)/$($files.Count) carriers never opened a OneNote window: the sweep would read as clean without covering them (first: $($unopened[0]))" }
        if ($nosend.Count * 20 -gt $files.Count) { throw "$($nosend.Count)/$($files.Count) cases never got the find keystrokes: the find path was not exercised (first: $($nosend[0]))" }
        "dumps_total=$((DumpList).Count)" | Tee-Object -FilePath $log -Append
        $bad -join "`r`n" | Out-File out\bad.txt

    - name: Attribute any dump to onmain
      if: always()
      shell: pwsh
      run: |
        $cdb = @("C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe",
                 "C:\Program Files (x86)\Windows Kits\10\Debuggers\arm64\cdb.exe") |
               Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
        $out = "out\attribution.txt"
        "cdb=$cdb" | Tee-Object -FilePath $out
        foreach ($d in @(Get-ChildItem out\bad -Filter *.dmp -EA SilentlyContinue)) {
          "== $($d.Name) ==" | Tee-Object -FilePath $out -Append
          if ($cdb) {
            & $cdb -z $d.FullName -c ".ecxr; k 20; lmvm onmain; |; q" 2>&1 | Select-Object -Last 60 | Tee-Object -FilePath $out -Append
          } else { "no cdb" | Tee-Object -FilePath $out -Append }
        }
        if (-not @(Get-ChildItem out\bad -Filter *.dmp -EA SilentlyContinue).Count) { "no dumps to attribute" | Tee-Object -FilePath $out -Append }

    - name: Report
      if: always()
      shell: pwsh
      run: |
        foreach ($f in @('out\sweep_log.txt','out\control.txt','out\attribution.txt','out\sweep_extra.txt')) {
          "##### $f"
          if (Test-Path $f) { Get-Content $f -Encoding Unicode | Select-Object -Last 90 } else { "missing" }
        }

    - name: Upload evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: onenote-pagekey-pageheap
        path: |
          out
          ver.txt
          corpus
