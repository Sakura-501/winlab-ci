name: delprop-memmove-probe
'on': {workflow_dispatch: null}
jobs:
  t:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
    - name: Download ODT
      shell: pwsh
      run: "$page = (Invoke-WebRequest -Uri \"https://www.microsoft.com/en-us/download/details.aspx?id=49117\" -UseBasicParsing).Content\nif ($page -match 'href=\\\"(https://download\\.microsoft\\.com/download/[^\\\"]+officedeploymenttool[^\\\"]*\\.exe)\\\"') {\n  Invoke-WebRequest -Uri $Matches[1] -OutFile odt.exe\n} else { throw \"odt link not found\" }\nStart-Process -Wait -FilePath .\\odt.exe -ArgumentList \"/extract:odtx /quiet\""
    - name: Install CurrentPreview x64 Word
      shell: pwsh
      run: '$xml = ''<Configuration><Add OfficeClientEdition="64" Channel="CurrentChannelPreview"><Product ID="O365ProPlusRetail"><Language ID="en-us" /><ExcludeApp ID="Excel" /><ExcludeApp ID="PowerPoint" /><ExcludeApp ID="Outlook" /><ExcludeApp ID="OneDrive" /><ExcludeApp ID="OneNote" /><ExcludeApp ID="Lync" /><ExcludeApp ID="Bing" /></Product></Add><Display Level="None" AcceptEULA="TRUE" /><Updates Enabled="FALSE" /></Configuration>''

        Set-Content -Path cfg.xml -Value $xml

        Start-Process -Wait -FilePath .\odtx\setup.exe -ArgumentList "/configure","cfg.xml"

        $w = Get-Item "C:\Program Files\Microsoft Office\root\Office16\wwlib.dll" -ErrorAction SilentlyContinue

        if (-not $w) { throw "install failed" }

        "wwlib: {0} bytes v{1}" -f $w.Length, $w.VersionInfo.FileVersion

        $w.VersionInfo.FileVersion | Out-File ver.txt'
    - name: Write docs
      shell: pwsh
      run: '[IO.File]::WriteAllBytes("$PWD\base_clean.doc", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\poc_sepx_oob.doc", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\poc_sepx_prcdata.doc", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\poc_sepx_tamper.doc", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\diag_nfib193.doc", [Convert]::FromBase64String(""))'
    - name: Configure LocalDumps
      shell: pwsh
      run: '$k = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\WINWORD.EXE"

        New-Item -Path $k -Force | Out-Null

        Set-ItemProperty -Path $k -Name DumpFolder -Value "C:\dumps" -Type ExpandString

        Set-ItemProperty -Path $k -Name DumpType -Value 2 -Type DWord'
    - name: Build minidbg15 and resolve DeleteProperty
      shell: pwsh
      run: "[IO.File]::WriteAllBytes(\"$PWD\\minidbg15.cs\", [Convert]::FromBase64String(\"\"\
        ))\n$csc = \"C:\\Windows\\Microsoft.NET\\Framework64\\v4.0.30319\\csc.exe\"\n& $csc /nologo /out:minidbg15.exe minidbg15.cs\nif (-not (Test-Path minidbg15.exe)) { throw 'csc failed' }\n$ww = [IO.File]::ReadAllBytes('C:\\Program Files\\Microsoft Office\\root\\Office16\\wwlib.dll')\n\"wwlib bytes: \" + $ww.Length\nAdd-Type -TypeDefinition @'\nusing System;\npublic static class Scan2 {\n  public static string Find(byte[] d, byte[] sig, int add) {\n    int idx = -1;\n    for (int i = 0; i + sig.Length < d.Length; i++) {\n      bool ok = true;\n      for (int j = 0; j < sig.Length; j++) if (d[i + j] != sig[j]) { ok = false; break; }\n      if (ok) { idx = i; break; }\n    }\n    if (idx < 0) return \"NOTFOUND\";\n    int pe = BitConverter.ToInt32(d, 0x3C);\n    ushort nsec = BitConverter.ToUInt16(d, pe + 6);\n    ushort szopt = BitConverter.ToUInt16(d, pe + 20);\n    int so = pe + 24 + szopt;\n    for (int s2 = 0; s2 < nsec; s2++) {\n      int e = so + 40 * s2;\n      uint vsz = BitConverter.ToUInt32(d, e + 8);\n      uint va = BitConverter.ToUInt32(d, e + 12);\n      uint praw = BitConverter.ToUInt32(d, e + 16);\n      uint poff = BitConverter.ToUInt32(d, e + 20);\n      uint span = Math.Max(vsz, praw);\n      if (idx >= (int)poff && idx < (int)(poff + span))\n        return (va + (uint)(idx - (int)poff) + (uint)add).ToString(\"X\");\n    }\n    return \"SECTMAPFAIL_\" + idx;\n  }\n}\n'@\n$sig = [byte[]](0x40,0x53,0x55,0x56,0x57,0x48,0x83,0xEC,0x28,0x44,0x0F,0xB7,0x0A)\n$rva = [Scan2]::Find($ww, $sig, 129)\nWrite-Host ('DELETEPROPERTY memmove-call RVA hex: ' + $rva)\nSet-Content -Path dp_rva.txt -Value $rva"
    - name: Probe control and each crafted doc
      shell: pwsh
      run: "$word = \"C:\\Program Files\\Microsoft Office\\root\\Office16\\WINWORD.EXE\"\n$rva = (Get-Content dp_rva.txt).Trim()\nif ($rva -notmatch '^[0-9A-Fa-f]+$') { Write-Host ('RESOLVE FAILED: ' + $rva); exit 0 }\nforeach ($n in @('base_clean','poc_sepx_oob','poc_sepx_prcdata','poc_sepx_tamper','diag_nfib193')) {\n  Write-Host \"===== PROBE $n =====\"\n  Remove-Item -Path 'HKCU:\\Software\\Microsoft\\Office\\16.0\\Word\\Resiliency' -Recurse -ErrorAction SilentlyContinue\n  & .\\minidbg15.exe $word (Resolve-Path \"$n.doc\").Path -- 45 \"0x$rva=mm\" 2>&1 | Tee-Object \"probe_$n.txt\" | Select-String -Pattern \"HIT |MM |DST0|SRC0|ccess violation|usage|EXCEPTION\" | ForEach-Object { $_.Line }\n  Get-Process WINWORD -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue\n  Start-Sleep 2\n}\nGet-ChildItem C:\\dumps -ErrorAction SilentlyContinue | ForEach-Object { Write-Host (\"DUMP: \" + $_.Name + \" \" + $_.Length) }"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: delprop-probe
        path: 'probe_base_clean.txt

          probe_poc_sepx_oob.txt

          probe_poc_sepx_prcdata.txt

          probe_poc_sepx_tamper.txt

          probe_diag_nfib193.txt

          dp_rva.txt

          ver.txt'
        if-no-files-found: ignore
