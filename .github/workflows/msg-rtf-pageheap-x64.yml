name: msg-rtf-pageheap-x64
'on': {workflow_dispatch: null}
jobs:
  t:
    runs-on: windows-latest
    timeout-minutes: 170
    steps:
    - name: Download ODT
      shell: pwsh
      run: "$page = (Invoke-WebRequest -Uri \"https://www.microsoft.com/en-us/download/details.aspx?id=49117\" -UseBasicParsing).Content\nif ($page -match 'href=\\\"(https://download\\.microsoft\\.com/download/[^\\\"]+officedeploymenttool[^\\\"]*\\.exe)\\\"') {\n  Invoke-WebRequest -Uri $Matches[1] -OutFile odt.exe\n} else { throw \"odt link not found\" }\nStart-Process -Wait -FilePath .\\odt.exe -ArgumentList \"/extract:odtx /quiet\""
    - name: Install CurrentPreview x64 Word+Outlook
      shell: pwsh
      run: '$xml = ''<Configuration><Add OfficeClientEdition="64" Channel="CurrentChannelPreview"><Product ID="O365ProPlusRetail"><Language ID="en-us" /><ExcludeApp ID="Excel" /><ExcludeApp ID="PowerPoint" /><ExcludeApp ID="OneDrive" /><ExcludeApp ID="OneNote" /><ExcludeApp ID="Lync" /><ExcludeApp ID="Bing" /></Product></Add><Display Level="None" AcceptEULA="TRUE" /><Updates Enabled="FALSE" /></Configuration>''

        Set-Content -Path cfg.xml -Value $xml

        Start-Process -Wait -FilePath .\odtx\setup.exe -ArgumentList "/configure","cfg.xml"

        $o = Get-Item "C:\Program Files\Microsoft Office\root\Office16\OUTLOOK.EXE" -ErrorAction SilentlyContinue

        if (-not $o) { throw "outlook install failed" }

        "outlook: {0} bytes" -f $o.Length

        $w = Get-Item "C:\Program Files\Microsoft Office\root\Office16\wwlib.dll"

        "wwlib v{0}" -f $w.VersionInfo.FileVersion

        $w.VersionInfo.FileVersion | Out-File ver.txt'
    - name: Install python deps
      shell: pwsh
      run: 'python -m pip install --quiet compressed-rtf olefile

        python -c "import compressed_rtf, olefile; print(''deps ok'')"'
    - name: Build .msg form battery
      shell: pwsh
      run: '[IO.File]::WriteAllBytes("$PWD\cfbtool.py", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\make_rtf_msg.py", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\template.msg", [Convert]::FromBase64String(""))

        python make_rtf_msg.py --battery template.msg carriers

        (Get-ChildItem carriers -Filter *.msg).Count | Out-File carriers_count.txt

        "carriers=" + (Get-Content carriers_count.txt)'
    - name: Sweep every form under full page heap
      shell: pwsh
      run: "\n$ErrorActionPreference = 'Continue'\n$forms = @('bin_huge','bin_short','cellx_max','cellx_neg','datafield','datastore','dbcs_gbk_trail40','dbcs_skip_over_close','deep_nest','deff_huge','fonttbl_ref_missing','fs_overflow','ind_overflow','listtable_big','listtemplate_many','nestcellx','objdata_nested_rtf','object_bad_hex','object_objdata','oversize_line','pict_emf','pict_neg_dims','pict_png_trunc','pict_wmf','pict_wmf_decl_trunc','shppict_wmf','tabs_many','tabs_max','trowd_cell_mismatch','u_huge','uc_neg','xmlns_prefix')\n$car = \"carriers\"\nNew-Item -ItemType Directory -Force -Path $car, \"out\" | Out-Null\n$log = \"out\\sweep_log.txt\"\nAdd-Type -AssemblyName System.Drawing -EA SilentlyContinue\n\nfunction DumpList { @(Get-ChildItem C:\\dumps -EA SilentlyContinue | Where-Object { $_.Extension -in '.dmp', '.dump' } | ForEach-Object { $_.Name }) }\n\n# --- page heap: prefer gflags, fall back to the documented IFEO value triple\n$gf = Get-ChildItem \"C:\\Program Files (x86)\\Windows Kits\\10\\Debuggers\" -Recurse -Include gflags.exe -EA SilentlyContinue | Select-Object -First 1\nif ($gf) {\n    & $gf.FullName /p /enable OUTLOOK.EXE /full | Out-Null\n    \"gflags_path=\" + $gf.FullName | Add-Content $log\n}\n$k = \"HKLM:\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Image File Execution Options\\OUTLOOK.EXE\"\nNew-Item -Path $k -Force | Out-Null\nSet-ItemProperty -Path $k -Name GlobalFlag -Value 0x200 -Type DWord\nSet-ItemProperty -Path $k -Name EnableVerifier -Value 1 -Type DWord\nSet-ItemProperty -Path $k -Name VerifierFlags -Value 0 -Type DWord\n$ld = \"HKLM:\\SOFTWARE\\Microsoft\\Windows Error Reporting\\LocalDumps\"\nNew-Item -Path $ld -Force | Out-Null\nSet-ItemProperty -Path $ld -Name DumpFolder -Value \"C:\\dumps\" -Type ExpandString\nSet-ItemProperty -Path $ld -Name DumpType -Value 2 -Type DWord\nSet-ItemProperty -Path $ld -Name DumpCount -Value 8 -Type DWord\n\"pageheap GlobalFlag=\" + (Get-ItemProperty $k).GlobalFlag + \" verifier=\" + (Get-ItemProperty $k).EnableVerifier | Add-Content $log\n\"olk=\" + (Get-Item \"C:\\Program Files\\Microsoft Office\\root\\Office16\\OUTLOOK.EXE\").Length | Add-Content $log\nSet-Content -Path C:\\dumps\\SELFTEST.dmp -Value sentinel -EA SilentlyContinue\n\"dumps_before=\" + (DumpList).Count | Add-Content $log\nRemove-Item C:\\dumps\\SELFTEST.dmp -EA SilentlyContinue\n\n$prev = DumpList\nforeach ($f in $forms) {\n    $msg = Join-Path $car (\"r_\" + $f + \".msg\")\n    if (-not (Test-Path $msg)) { \"name=$f MISSING\" | Add-Content $log; continue }\n    Get-Process OUTLOOK -EA SilentlyContinue | Stop-Process -Force\n    for ($i = 0; $i -lt 60; $i++) { if (-not (Get-Process OUTLOOK -EA SilentlyContinue)) { break }; Start-Sleep -Milliseconds 500 }\n    Remove-Item \"HKCU:\\Software\\Microsoft\\Office\\16.0\\Outlook\\Resiliency\" -Recurse -Force -EA SilentlyContinue\n    Set-Content -Path $msg -Stream 'Zone.Identifier' -Value \"[ZoneTransfer]`r`nZoneId=3\" -Encoding ASCII\n    $zone = (Get-Content $msg -Stream 'Zone.Identifier' -EA SilentlyContinue) -join '|'\n    $streams = (Get-Item $msg -Stream *).Stream -join ','\n    $t0 = Get-Date\n    $p = Start-Process -FilePath \"C:\\Program Files\\Microsoft Office\\root\\Office16\\OUTLOOK.EXE\" -ArgumentList \"/f `\"$((Resolve-Path $msg).Path)`\"\" -PassThru\n    $title = ''\n    while (((Get-Date) - $t0).TotalSeconds -lt 110) {\n        Start-Sleep -Milliseconds 900\n        try { $p.Refresh() } catch { }\n        if ($p.MainWindowTitle -like (\"*rtfb_\" + $f + \"*\")) { $title = $p.MainWindowTitle; break }\n        $other = Get-Process OUTLOOK -EA SilentlyContinue | Where-Object { $_.MainWindowTitle -like (\"*rtfb_\" + $f + \"*\") } | Select-Object -First 1\n        if ($other) { $title = $other.MainWindowTitle; break }\n    }\n    $elapsed = [int]((Get-Date) - $t0).TotalSeconds\n    $alive = $true\n    try { $alive = -not $p.HasExited } catch { }\n    Start-Sleep -Seconds 3\n    $exit = ''\n    try { if ($p.HasExited) { $exit = $p.ExitCode } } catch { }\n    Get-Process OUTLOOK -EA SilentlyContinue | Stop-Process -Force\n    for ($i = 0; $i -lt 60; $i++) { if (-not (Get-Process OUTLOOK -EA SilentlyContinue)) { break }; Start-Sleep -Milliseconds 500 }\n    $now = DumpList\n    $new = @($now | Where-Object { $prev -notcontains $_ })\n    $prev = $now\n    $line = \"{0}`topened={1}`tsize={2}`tzone=[{3}]`tstreams=[{4}]`ttitle=[{5}]`talive={6}`texit={7}`tsecs={8}`tnewdumps={9}`tdumpnames={10}\" -f `\n        $f, [bool]$title, (Get-Item $msg).Length, $zone, $streams, $title, $alive, $exit, $elapsed, $new.Count, ($new -join ',')\n    Add-Content $log $line\n    Write-Host $line\n}\n\"SWEEPDONE\" | Add-Content $log\n"
    - name: Analyse dumps with cdb + msdl symbols
      shell: pwsh
      run: "\n$ErrorActionPreference = 'Continue'\n$cdb = Get-ChildItem \"C:\\Program Files (x86)\\Windows Kits\\10\\Debuggers\" -Recurse -Include cdb.exe -EA SilentlyContinue |\n    Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1\nif (-not $cdb) { $cdb = Get-ChildItem \"C:\\Program Files (x86)\\Windows Kits\\10\\Debuggers\" -Recurse -Include cdb.exe -EA SilentlyContinue | Select-Object -First 1 }\n\"cdb=\" + $cdb.FullName | Out-File out\\analyze_log.txt -Encoding utf8\n$dumps = @(Get-ChildItem C:\\dumps -EA SilentlyContinue | Where-Object { $_.Extension -eq '.dmp' -and $_.Name -like 'OUTLOOK*' })\n\"count=\" + $dumps.Count | Out-File out\\analyze_log.txt -Append -Encoding utf8\nforeach ($d in $dumps) {\n    \"===== $($d.Name) $($d.Length)\" | Out-File (\"out\\analyze_\" + $d.BaseName + \".txt\") -Encoding utf8\n    & $cdb.FullName -z $d.FullName -y \"srv*C:\\symbols*https://msdl.microsoft.com/download/symbols\" `\n        -c \".ecxr; k 30; !analyze -v; lmvm wwlib; lmvm OUTLOOK; q\" 2>&1 |\n        Select-String -Pattern \"Exception|FAULTING|STACK|#[ 0-9]+ |ModLoad|ImagePath|Failure|BUGCHECK|MAPI|Olk|Wwlib|Rtf|Cch|Hr\" |\n        Select-Object -First 120 | Out-File (\"out\\analyze_\" + $d.BaseName + \".txt\") -Append -Encoding utf8\n}\n\"ANALYZEDONE\" | Out-File out\\analyze_log.txt -Append -Encoding utf8\n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: msg-rtf-pageheap-x64
        path: 'out

          ver.txt

          carriers_count.txt'
        if-no-files-found: ignore
