    - name: fetch-edge-package
      shell: pwsh
      run: |
        $d = 'C:\edgebat\out'
        if (-not (Test-Path $d)) { New-Item -ItemType Directory -Force -Path $d | Out-Null }
        $exe = 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
        if (Test-Path $exe) {
          $v = (Get-Item $exe).VersionInfo.FileVersion
          "edge_version=$v" | Out-File -Encoding ascii "$d\version.txt"
          Copy-Item 'C:\Program Files (x86)\Microsoft\Edge\Application\mspdf.dll' "$d\mspdf_x64.dll" -EA SilentlyContinue
          "mspdf copied: " + (Test-Path "$d\mspdf_x64.dll") | Out-File -Append -Encoding ascii "$d\version.txt"
        }
      continue-on-error: true
    - name: upload
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: edgebat-out
        path: C:\edgebat\out
        if-no-files-found: warn
