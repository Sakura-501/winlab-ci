name: edge-external-url-probe
'on':
  workflow_dispatch: {}
jobs:
  t:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
    - name: install-current-stable-edge
      shell: pwsh
      continue-on-error: true
      run: |
        $j = (Invoke-WebRequest -Uri 'https://edgeupdates.microsoft.com/api/products' -UseBasicParsing -TimeoutSec 60).Content | ConvertFrom-Json
        $rel = $null
        foreach ($p in $j) {
          if ($p.Product -ne 'Stable') { continue }
          foreach ($r in $p.Releases) {
            if ($r.Platform -eq 'Windows' -and $r.Architecture -eq 'x64') {
              if (-not $rel -or [Version]$r.ProductVersion -gt [Version]$rel.ProductVersion) { $rel = $r }
            }
            if ($r.Platform -eq 'Windows x64') {
              if (-not $rel -or [Version]$r.ProductVersion -gt [Version]$rel.ProductVersion) { $rel = $r }
            }
          }
        }
        if (-not $rel) { Write-Host 'no stable x64 release in api'; exit 0 }
        $art = $rel.Artifacts | Where-Object { $_.ArtifactName -eq 'msi' } | Select-Object -First 1
        Write-Host ('target_version=' + $rel.ProductVersion)
        Invoke-WebRequest -Uri $art.Location -OutFile edge.msi -UseBasicParsing -TimeoutSec 900
        Write-Host ('installed_before=' + (Get-Item 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe' -EA SilentlyContinue).VersionInfo.FileVersion)
        $p = Start-Process msiexec.exe -ArgumentList '/i','edge.msi','/quiet','/norestart' -Wait -PassThru
        Write-Host ('msiexec_exit=' + $p.ExitCode)
