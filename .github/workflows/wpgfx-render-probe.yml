name: wpgfx-render-probe
on:
  workflow_dispatch:
    inputs:
      groups:
        description: 'DEF instruction groups'
        required: false
        default: '6000'
      pageheap:
        description: 'full page heap (on/off)'
        required: false
        default: 'off'
      runtime:
        description: '.NET runtime to pin (10.0.11 / 10.0.12)'
        required: false
        default: '10.0.12'
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: pin runtime ${{ github.event.inputs.runtime }}
        run: |
          $v = "${{ github.event.inputs.runtime }}"
          if ($v -ne "default") {
            $dn = "C:\Program Files\dotnet"
            Invoke-WebRequest "https://builds.dotnet.microsoft.com/dotnet/Runtime/$v/dotnet-runtime-$v-win-x64.zip" -OutFile rt.zip
            Invoke-WebRequest "https://builds.dotnet.microsoft.com/dotnet/WindowsDesktop/$v/windowsdesktop-runtime-$v-win-x64.zip" -OutFile wd.zip
            Expand-Archive rt.zip -DestinationPath rt -Force
            Expand-Archive wd.zip -DestinationPath wd -Force
            Copy-Item -Recurse -Force rt\shared\* "$dn\shared\"
            Copy-Item -Recurse -Force wd\shared\* "$dn\shared\"
          }
          dotnet --list-runtimes | Select-String WindowsDesktop
      - name: build probe
        run: dotnet build tools/wpgfx-render-probe/shaderprobe.csproj -c Release -v q
      - name: pageheap config
        run: |
          $k="HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\shaderprobe.exe"
          if ("${{ github.event.inputs.pageheap }}" -eq "on") {
            New-Item -Path $k -Force | Out-Null
            New-ItemProperty -Path $k -Name PageHeapFlags -Value 2 -PropertyType DWord -Force | Out-Null
            New-ItemProperty -Path $k -Name ExecuteOptions -Value 0x400 -PropertyType DWord -Force | Out-Null
          }
      - name: benign control
        continue-on-error: true
        env: { MODE: benign, DOTNET_ROLL_FORWARD: LatestPatch }
        run: |
          $env:GROUPS="${{ github.event.inputs.groups }}"
          & tools/wpgfx-render-probe/bin/Release/net10.0-windows/shaderprobe.exe *>&1 | Tee-Object benign.txt
          "BENIGN_EXIT=0x{0:X8}" -f $LASTEXITCODE | Tee-Object -Append benign.txt
      - name: attack run
        continue-on-error: true
        env: { MODE: attack, DOTNET_ROLL_FORWARD: LatestPatch }
        run: |
          $env:GROUPS="${{ github.event.inputs.groups }}"
          & tools/wpgfx-render-probe/bin/Release/net10.0-windows/shaderprobe.exe *>&1 | Tee-Object attack.txt
          "ATTACK_EXIT=0x{0:X8}" -f $LASTEXITCODE | Tee-Object -Append attack.txt
      - name: dcl benign control
        continue-on-error: true
        env: { MODE: dclbenign, DOTNET_ROLL_FORWARD: LatestPatch }
        run: |
          $env:GROUPS="${{ github.event.inputs.groups }}"
          & tools/wpgfx-render-probe/bin/Release/net10.0-windows/shaderprobe.exe *>&1 | Tee-Object dclbenign.txt
          "DCL_BENIGN_EXIT=0x{0:X8}" -f $LASTEXITCODE | Tee-Object -Append dclbenign.txt
      - name: dcl attack run
        continue-on-error: true
        env: { MODE: dclattack, DOTNET_ROLL_FORWARD: LatestPatch }
        run: |
          $env:GROUPS="${{ github.event.inputs.groups }}"
          & tools/wpgfx-render-probe/bin/Release/net10.0-windows/shaderprobe.exe *>&1 | Tee-Object dclattack.txt
          "DCL_ATTACK_EXIT=0x{0:X8}" -f $LASTEXITCODE | Tee-Object -Append dclattack.txt
      - name: roll pageheap
        if: always()
        run: Remove-Item -Recurse -Force "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\shaderprobe.exe" -EA SilentlyContinue
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ github.event.inputs.runtime }}-g${{ github.event.inputs.groups }}-ph${{ github.event.inputs.pageheap }}
          path: |
            benign.txt
            attack.txt
            dclbenign.txt
            dclattack.txt
