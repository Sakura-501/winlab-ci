name: olm-html-dph-x64
# In-process sweep of OLMAPI32's exported HTML<->RTF/plain-text converters (classes HTMLPARSE,
# HTMLRTF, RTFHTML, HTMLHTML, INPOP, OUTSTM, CONV@RtfHtml -- 316 named functions in the module's
# own decompilation) over a boundary-targeted corpus of attacker-authored message bodies, on a
# native x64 build under a behaviourally-gated full page heap.
# Those exports take a pair of in-memory IStreams, so the converter runs inside this process with
# no Outlook profile and no message store.  Nothing in the earlier waves entered them: the
# RTF/TNEF/MIME benches carry no HTML input at all (grep -c -i html crtfbench.cpp = 0) and no
# message in the 1,200-file .msg corpus has a PR_HTML (__substg1.0_1016...) stream.
# Stage gates: the harness must fault on its own deliberate one-byte-past write before any "0
# faults" reading is taken, and a control run must convert non-empty output before a sweep counts.
'on':
  workflow_dispatch:
    inputs:
      chunk:
        description: 'dense-corpus records per dense stage (0 = skip the dense stages)'
        required: false
        default: '1000'
jobs:
  t:
    runs-on: windows-latest
    timeout-minutes: 170
    steps:
    - name: Download ODT
      shell: pwsh
      run: |
        $urls = @()
        for ($t = 0; $t -lt 4 -and $urls.Count -eq 0; $t++) {
          try {
            $page = (Invoke-WebRequest -Uri "https://www.microsoft.com/en-us/download/details.aspx?id=49117" -UseBasicParsing -TimeoutSec 90).Content
            foreach ($m in [regex]::Matches($page, 'https://download[.]microsoft[.]com/download/[^ <>"]+officedeploymenttool[^ <>"]+[.]exe')) { $urls += $m.Value }
          } catch { "fetch attempt $t failed: $($_.Exception.Message)" }
          if ($urls.Count -eq 0) { Start-Sleep -Seconds (5 * ($t + 1)) }
        }
        if ($urls.Count -eq 0) { throw "odt link not found after retries" }
        $got = $false
        foreach ($u in $urls) {
          for ($t = 0; $t -lt 3 -and -not $got; $t++) {
            try { Invoke-WebRequest -Uri $u -OutFile odt.exe -UseBasicParsing -TimeoutSec 300; if ((Get-Item odt.exe).Length -gt 1MB) { $got = $true } }
            catch { "dl attempt $t failed: $($_.Exception.Message)"; Start-Sleep -Seconds (5 * ($t + 1)) }
          }
          if ($got) { break }
        }
        if (-not $got) { throw "odt.exe download failed" }
        Remove-Item odtx -Recurse -Force -EA SilentlyContinue
        $x = $false
        for ($t = 0; $t -lt 3 -and -not $x; $t++) {
          Start-Process -Wait -FilePath .\odt.exe -ArgumentList "/extract:`"$PWD\odtx`" /quiet"
          $x = Test-Path odtx\setup.exe
          if (-not $x) { "extract attempt $t produced no setup.exe"; Start-Sleep -Seconds (5 * ($t + 1)) }
        }
        if (-not $x) { throw "odt extract failed" }

    - name: Install Current x64 (Outlook kept, rest excluded)
      shell: pwsh
      run: |
        $xml = '<Configuration><Add OfficeClientEdition="64" Channel="Current"><Product ID="O365ProPlusRetail"><Language ID="en-us" /><ExcludeApp ID="Excel" /><ExcludeApp ID="PowerPoint" /><ExcludeApp ID="OneDrive" /><ExcludeApp ID="OneNote" /><ExcludeApp ID="Lync" /><ExcludeApp ID="Access" /><ExcludeApp ID="Groove" /><ExcludeApp ID="Publisher" /><ExcludeApp ID="Teams" /><ExcludeApp ID="Bing" /><ExcludeApp ID="Word" /></Product></Add><Display Level="None" AcceptEULA="TRUE" /><Updates Enabled="FALSE" /></Configuration>'
        Set-Content -Path cfg.xml -Value $xml
        Start-Process -Wait -FilePath .\odtx\setup.exe -ArgumentList "/configure","cfg.xml"
        if (-not (Test-Path "C:\Program Files\Microsoft Office\root\Office16\OUTLOOK.EXE")) { throw "outlook install failed" }
        $olm = Get-Item "C:\Program Files\Microsoft Office\root\Office16\OLMAPI32.DLL"
        "olmapi32 len=$($olm.Length) v=$($olm.VersionInfo.FileVersion)" | Tee-Object ver.txt
        $ol = Get-Item "C:\Program Files\Microsoft Office\root\Office16\OUTLMIME.DLL"
        "outlmime len=$($ol.Length) v=$($ol.VersionInfo.FileVersion)" | Tee-Object -Append ver.txt

    - name: Materialize harness and corpus generator
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path bin, build, corpus, out, tools | Out-Null
        Set-Content -Path cpp.b64 -Value "" -NoNewline
        Set-Content -Path gen.b64 -Value "" -NoNewline
        python -c "import base64;open('bin/htmlbench.c','wb').write(base64.b64decode(open('cpp.b64').read()))"
        python -c "import base64;open('tools/mk_html_corpus.py','wb').write(base64.b64decode(open('gen.b64').read()))"
        Get-Item bin\htmlbench.c, tools\mk_html_corpus.py | Select-Object Name, Length | Format-Table | Out-String

    - name: Build harness (x64)
      shell: pwsh
      run: |
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
        "vs=$vs"
        $vc = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
        if (-not (Test-Path $vc)) { $vc = Join-Path $vs 'VC\Auxiliary\Build\vcvarsall.bat' }
        $cmd = '"' + $vc + '" x64 && cl /nologo /O2 /W3 /std:c17 /Tc bin\htmlbench.c /Fe:bin\htmlbench_x64.exe /Fo:build\ /link ole32.lib oleaut32.lib uuid.lib shell32.lib advapi32.lib user32.lib'
        cmd /c $cmd 2>&1 | Tee-Object out\build.txt | Select-Object -Last 10
        if (-not (Test-Path bin\htmlbench_x64.exe)) { throw "harness build failed" }

    - name: Arm full page heap and gate it behaviourally
      shell: pwsh
      run: |
        $k = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\htmlbench_x64.exe"
        New-Item -Path $k -Force | Out-Null
        New-ItemProperty -Path $k -Name GlobalFlag -Value 0x02000000 -PropertyType DWord -Force | Out-Null
        New-ItemProperty -Path $k -Name PageHeapFlags -Value 0x3 -PropertyType DWord -Force | Out-Null
        "GlobalFlag=$((Get-Item $k).GetValue('GlobalFlag')) PageHeapFlags=$((Get-Item $k).GetValue('PageHeapFlags'))" | Tee-Object out\pageheap.txt
        $s = & .\bin\htmlbench_x64.exe selftest 2>&1 | Out-String
        $rc = $LASTEXITCODE -band [int]0xFFFFFFFF
        $hex = '{0:X8}' -f $rc
        $armed = if ($hex -eq 'C0000005' -and $s -notmatch 'NOT_DETECTED' -and $s -match 'ABOUT_TO_WRITE_PAST_END') { 'ARMED' } else { 'NOT_ARMED' }
        "SELFTEST rc=0x$hex verdict=$armed log=$(($s.Trim() -replace '\r?\n',' | '))" | Tee-Object out\selftest.txt
        if ($armed -ne 'ARMED') { throw "instrument blind: aborting" }
        # the selftest run leaves $LASTEXITCODE at the expected fault code; without an explicit
        # exit 0 GitHub marks this step failed and every sweep stage is skipped.
        exit 0

    - name: Control that the converters really run
      shell: pwsh
      run: |
        python tools\mk_html_corpus.py corpus
        "base_html=" + (Get-Item corpus\html.txt).Length
        $o = & .\bin\htmlbench_x64.exe corpus\html.txt 40 2>&1 | Out-String
        $o | Out-File out\ctrl.txt
        ($o -split "`n" | Where-Object { $_ -match 'OLMAPI32=|K HTPT|HTML50|K0=|AV ' }) -join "`n" | Tee-Object out\ctrl_sum.txt
        if ($o -notmatch 'nonzero_out=[1-9]') { throw "control converted nothing - reads unusable" }
        if ($o -match 'AV rw') { throw "control faulted" }

    - name: Stage A - hand-written HTML and RTF bodies through all three converters
      shell: pwsh
      run: |
        $o = & .\bin\htmlbench_x64.exe corpus\html.txt 2>&1 | Out-String
        $o | Out-File out\stageA.txt
        ($o -split "`n" | Where-Object { $_ -match 'HTML50|K0=|AV rw|FAULTR' }) -join "`n" | Tee-Object out\stageA_sum.txt

    - name: Stage B - dense length sweeps, first chunk
      shell: pwsh
      run: |
        $n = [int]"${{ inputs.chunk }}"
        if ($n -le 0) { "chunk=0 -> dense stages skipped"; exit 0 }
        python tools\mk_html_corpus.py corpus dense
        "dense_html=" + (Get-Item corpus\html.txt).Length
        $o = & .\bin\htmlbench_x64.exe corpus\html.txt $n 946 2>&1 | Out-String
        $o | Out-File out\stageB.txt
        $keep = ($o -split "`n" | Where-Object { $_ -match 'HTML50|K0=|AV rw|FAULTR|P r=' } | Select-Object -Last 6) -join "`n"
        $keep | Tee-Object out\stageB_sum.txt

    - name: Stage C - dense length sweeps, second chunk
      shell: pwsh
      run: |
        $n = [int]"${{ inputs.chunk }}"
        if ($n -le 0) { exit 0 }
        $o = & .\bin\htmlbench_x64.exe corpus\html.txt ($n*2) $n 2>&1 | Out-String
        $o | Out-File out\stageC.txt
        $keep = ($o -split "`n" | Where-Object { $_ -match 'HTML50|K0=|AV rw|FAULTR|P r=' } | Select-Object -Last 6) -join "`n"
        $keep | Tee-Object out\stageC_sum.txt

    - name: Harvest faulting records
      if: always()
      shell: pwsh
      run: |
        Get-ChildItem out\*.txt | ForEach-Object { "==== $($_.Name) ($($_.Length) B)" }
        $bad = @()
        foreach ($f in Get-ChildItem out\stage*.txt -ErrorAction SilentlyContinue) { $bad += Select-String -Path $f.FullName -Pattern 'AV rw|FAULTR' }
        if ($bad.Count -gt 0) { $bad | ForEach-Object { $_.Line } | Set-Content out\FAULTS.txt; "FAULT_LINES=" + $bad.Count } else { "no fault lines in stage logs" }

    - name: Upload evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: olm-html-dph-x64
        path: |
          out
          ver.txt
