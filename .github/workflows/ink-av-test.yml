name: Windows Ink AV Reproduction Test
on:
  workflow_dispatch:
jobs:
  repro:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ink-av-test
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        shell: pwsh
        run: |
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $wmd = "C:\Windows\System32\WinMetadata"
          & $csc /nologo /target:exe /out:isfuzz.exe /r:System.Runtime.WindowsRuntime.dll /r:"$wmd\Windows.Foundation.winmd" /r:"$wmd\Windows.UI.winmd" /r:"$wmd\Windows.Storage.winmd" isfuzz_source.cs
      - name: Run PoC
        shell: pwsh
        run: |
          $output = & .\isfuzz.exe . 10 progress.txt 2>&1 | Out-String
          $output | Out-File result.txt -Encoding UTF8
          Write-Host $output
          if ($output -match "AccessViolationException") { "VULN_CONFIRMED" | Out-File verdict.txt -Encoding UTF8 } else { "NOT_VULNERABLE" | Out-File verdict.txt -Encoding UTF8 }
      - name: Check
        shell: pwsh
        run: |
          Write-Host "VERDICT: $(Get-Content verdict.txt)"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: result.txt
