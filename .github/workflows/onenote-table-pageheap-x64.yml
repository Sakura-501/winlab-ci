name: onenote-table-pageheap-x64
# Open .one carriers whose table ColumnCount field is enlarged, with ONENOTE on full page
# heap and WER full dumps, then attribute the fault. No in-app action is needed for this
# face: OneNote lays tables out while rendering the page after the file opens.
on:
  workflow_dispatch:
    inputs:
      cap:
        description: 'max carriers'
        required: false
        default: '3'
jobs:
  t:
    runs-on: windows-latest
    timeout-minutes: 200
    steps:
    - uses: actions/checkout@v4

    - name: Download ODT
      shell: pwsh
      run: |
        $page = (Invoke-WebRequest -Uri "https://www.microsoft.com/en-us/download/details.aspx?id=49117" -UseBasicParsing).Content
        if ($page -match 'href="(https://download\.microsoft\.com/download/[^"]+officedeploymenttool[^"]*\.exe)"') {
          Invoke-WebRequest -Uri $Matches[1] -OutFile odt.exe
        } else { throw "odt link not found" }
        Start-Process -Wait -FilePath .\odt.exe -ArgumentList "/extract:odtx /quiet"

    - name: Install x64 Office (OneNote needed)
      shell: pwsh
      run: |
        $xml = '<Configuration><Add OfficeClientEdition="64" Channel="CurrentChannel"><Product ID="O365ProPlusRetail"><Language ID="en-us" /><ExcludeApp ID="OneDrive" /><ExcludeApp ID="Lync" /><ExcludeApp ID="Bing" /></Product></Add><Display Level="None" AcceptEULA="TRUE" /><Updates Enabled="FALSE" /></Configuration>'
        Set-Content -Path cfg.xml -Value $xml
        Start-Process -Wait -FilePath .\odtx\setup.exe -ArgumentList "/configure","cfg.xml"
        $o = Get-Item "C:\Program Files\Microsoft Office\root\Office16\ONENOTE.EXE" -EA SilentlyContinue
        if (-not $o) { throw "onenote install failed" }
        $om = Get-Item "C:\Program Files\Microsoft Office\root\Office16\onmain.dll" -EA SilentlyContinue
        "onenote v=$($o.VersionInfo.FileVersion) onmain v=$($om.VersionInfo.FileVersion)"
        $om.VersionInfo.FileVersion | Out-File ver.txt

    - name: Page heap for ONENOTE plus WER full dumps
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path out, C:\dumps | Out-Null
        $k = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\ONENOTE.EXE"
        New-Item -Path $k -Force | Out-Null
        Set-ItemProperty -Path $k -Name GlobalFlag -Value 0x02000000 -Type DWord
        Set-ItemProperty -Path $k -Name EnableVerifier -Value 1 -Type DWord
        Set-ItemProperty -Path $k -Name VerifierFlags -Value 0 -Type DWord
        Set-ItemProperty -Path $k -Name PageHeapFlags -Value 0x3 -Type DWord
        $ld = "HKLM:\SOFTWARE\Microsoft\Windows Error Reporting\LocalDumps"
        New-Item -Path $ld -Force | Out-Null
        Set-ItemProperty -Path $ld -Name DumpFolder -Value "C:\dumps" -Type ExpandString
        Set-ItemProperty -Path $ld -Name DumpType -Value 2 -Type DWord
        Set-ItemProperty -Path $ld -Name DumpCount -Value 40 -Type DWord
        "readback GlobalFlag=$((Get-ItemProperty $k).GlobalFlag) PageHeapFlags=$((Get-ItemProperty $k).PageHeapFlags) EnableVerifier=$((Get-ItemProperty $k).EnableVerifier)" | Tee-Object out\setup_log.txt

    - name: Lay carriers
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path tbl | Out-Null
        [IO.File]::WriteAllBytes("tbl\s2.one", [Convert]::FromBase64String((Get-Content data\tbl_s2.b64 -Raw)))
        [IO.File]::WriteAllBytes("tbl\r8_colffff.one", [Convert]::FromBase64String((Get-Content data\tbl_r8_colffff.b64 -Raw)))
        [IO.File]::WriteAllBytes("tbl\r8_both.one", [Convert]::FromBase64String((Get-Content data\tbl_r8_both.b64 -Raw)))
        [IO.File]::WriteAllBytes("tbl\c40.one", [Convert]::FromBase64String((Get-Content data\tbl_c40.one -Raw)))
        [IO.File]::WriteAllBytes("tbl\c80.one", [Convert]::FromBase64String((Get-Content data\tbl_c80.one -Raw)))
        [IO.File]::WriteAllBytes("tbl\c20.one", [Convert]::FromBase64String((Get-Content data\tbl_c20.one -Raw)))
        [IO.File]::WriteAllBytes("tbl\c40k.one", [Convert]::FromBase64String((Get-Content data\tbl_c40k.one -Raw)))
        [IO.File]::WriteAllBytes("tbl\wff.one", [Convert]::FromBase64String((Get-Content data\tbl_wff.one -Raw)))
        [IO.File]::WriteAllBytes("tbl\w40.one", [Convert]::FromBase64String((Get-Content data\tbl_w40.one -Raw)))
        [IO.File]::WriteAllBytes("tbl\w05.one", [Convert]::FromBase64String((Get-Content data\tbl_w05.one -Raw)))
        $f=@(Get-ChildItem tbl -Filter *.one -File); "carriers=$($f.Count) sizes=$(($f.Length) -join ',')"
        if ($f.Count -lt 2) { throw "carriers not materialized" }

    - name: Warm the first run then open each carrier
      shell: pwsh
      run: |
        $log="out\sweep_log.txt"; New-Item -ItemType Directory -Force -Path out,out\bad | Out-Null
        function L($s) { $s | Tee-Object -FilePath $log -Append }
        Add-Type -AssemblyName UIAutomationClient,UIAutomationTypes
        $sigw = '[DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h); [DllImport("user32.dll")] public static extern bool ShowWindowAsync(IntPtr h, int n); [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y); [DllImport("user32.dll")] public static extern void mouse_event(uint f, uint x, uint y, uint d, int e);'
        $script:w32 = Add-Type -MemberDefinition $sigw -Name W32t -Namespace WinT -PassThru
        function UiaAllWins { $r=@(); try { foreach ($w in $script:AE::RootElement.FindAll($script:SC::Children, $script:TRUEC)) { $r += $w } } catch { }; return ,$r }
        function UiaModal {
          $m = 0
          foreach ($w in (UiaAllWins)) { foreach ($e in (UiaDesc $w)) { try { if ($e.Current.Name -match 'Welcome to free|Continue for free|How do you want to start|Get more with a trial|View plan options') { $m = 1 } } catch { } } }
          return $m
        }
        function UiaClickDismiss {
          $n = 0
          foreach ($w in (UiaAllWins)) {
            foreach ($e in (UiaDesc $w)) {
              try {
                $nm = $e.Current.Name
                if ($nm -match '^(Continue for free|Not now|No thanks|Maybe later|Skip|Later|Start using|I have a subscription or product key)$') {
                  $done = $false
                  try {
                    if ($e.Current.IsLegacyIAccessiblePatternAvailable) { ($e.GetCurrentPattern([System.Windows.Automation.LegacyIAccessiblePattern]::Pattern)).DoDefaultAction(); $done = $true; $n++ }
                  } catch { }
                  if (-not $done) {
                    try {
                      $cp = $e.Current.ClickablePoint
                      if ($cp.IsEmpty) { $r = $e.Current.BoundingRectangle; $cx = [int](($r.Left + $r.Right) / 2); $cy = [int](($r.Top + $r.Bottom) / 2) } else { $cx = [int]$cp.X; $cy = [int]$cp.Y }
                      [void]$script:w32::SetForegroundWindow($w.Current.NativeWindowHandle)
                      [void]$script:w32::SetCursorPos($cx, $cy); Start-Sleep -Milliseconds 250
                      [void]$script:w32::mouse_event(0x0002, 0, 0, 0, 0); [void]$script:w32::mouse_event(0x0004, 0, 0, 0, 0)
                      $done = $true; $n++
                    } catch { }
                  }
                  "click_dismiss name=$nm done=$done" | L
                  Start-Sleep -Seconds 2
                }
              } catch { }
            }
          }
          return $n
        }
        $script:TRUEC = [System.Windows.Automation.Condition]::TrueCondition
        $script:SC = [System.Windows.Automation.TreeScope]
        $script:INVP = [System.Windows.Automation.InvokePattern]
        function UiaWins { $r=@(); try { $pids=@(@(Get-Process ONENOTE -EA SilentlyContinue).Id); foreach ($w in $script:AE::RootElement.FindAll($script:SC::Children, $script:TRUEC)) { try { if ($pids -contains $w.Current.ProcessId) { $r += $w } } catch { } } } catch { }; return ,$r }
        function UiaDesc($w) { try { return @($w.FindAll($script:SC::Descendants, $script:TRUEC)) } catch { return @() } }
        function UiaDismiss { $n=0; foreach ($w in (UiaWins)) { foreach ($e in (UiaDesc $w)) { try { if ($e.Current.IsInvokePatternAvailable -and $e.Current.Name -match 'Continue for free|Continue|Skip|Later|Set up|Keep|Start using|No thanks|Maybe later|Not now|Notebooks on this PC|This PC|OK') { ($e.GetCurrentPattern($script:INVP::Pattern)).Invoke(); $n++; Start-Sleep -Seconds 2 } } catch { } } }; return $n }
        $exe="C:\Program Files\Microsoft Office\root\Office16\ONENOTE.EXE"
        try { Start-Process $exe -EA SilentlyContinue | Out-Null } catch { }
        for ($i=0; $i -lt 25; $i++) { Start-Sleep -Seconds 2; if (@(Get-Process ONENOTE -EA SilentlyContinue).Count -gt 0) { break } }
        Start-Sleep -Seconds 10
        $script:AE = [System.Windows.Automation.AutomationElement]
        $mg = 1
        for ($r2 = 0; $r2 -lt 8; $r2++) {
          [void](UiaDismiss); [void](UiaClickDismiss)
          $mg = UiaModal
          L ("warmup_gate round=$r2 still_modal=$mg")
          if ($mg -eq 0) { break }
          Start-Sleep -Seconds 2
        }
        if ($mg -ne 0) { L "INSTRUMENT_FAIL modal_never_cleared"; throw "instrument fail: OneNote modal window never cleared" }
        $wt=''
        $wq=@(Get-Process ONENOTE -EA SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 })
        if ($wq.Count -gt 0) { $wt = $wq[0].MainWindowTitle }
        Get-Process ONENOTE -EA SilentlyContinue | Stop-Process -Force -EA SilentlyContinue
        Start-Sleep -Seconds 3
        L ("warmup_procs=" + (@(Get-Process ONENOTE -EA SilentlyContinue).Count) + " warmup_title=" + $wt)
        $cap=[int]'${{ inputs.cap }}'
        $files=@(Get-ChildItem tbl -Filter *.one -File | Sort-Object Name | Select-Object -First $cap)
        L ("cases=$($files.Count)")
        foreach ($f in $files) {
          Get-Process ONENOTE -EA SilentlyContinue | Stop-Process -Force -EA SilentlyContinue
          Start-Sleep -Seconds 2
          Set-Content -Path $f.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3" -Encoding ASCII -EA SilentlyContinue
          $streams=@(Get-Item $f.FullName -Stream * -EA SilentlyContinue).Stream -join ','
          $before=@(Get-ChildItem C:\dumps -File -EA SilentlyContinue).Count
          $t0=Get-Date
          $p=Start-Process -FilePath $exe -ArgumentList "`"$($f.FullName)`"" -PassThru
          $title=''; $alive=1; $exit=''
          for ($i=0; $i -lt 95; $i++) {
            Start-Sleep -Milliseconds 1000
            if ($i % 12 -eq 11) { [void](UiaClickDismiss) }
            $pr=@(Get-Process ONENOTE -EA SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 })
            if ($pr.Count -gt 0 -and $pr[0].MainWindowTitle) { $title=$pr[0].MainWindowTitle; if ($title -notmatch '^Microsoft OneNote$' -and $title -notmatch 'How do you want to start') { break } }
            if (@(Get-Process ONENOTE -EA SilentlyContinue).Count -eq 0) { $alive=0; try { $exit='0x' + ('{0:x8}' -f $p.ExitCode) } catch { $exit='?' }; Start-Sleep -Seconds 8; break }
          }
          $after=@(Get-ChildItem C:\dumps -File -EA SilentlyContinue)
          $new=@($after | Where-Object { $_.CreationTime -gt $t0 })
          L ("{0,-18} alive={1} exited={2} exit={3} dumps={4} s={5} streams={6} title={7}" -f $f.Name,$alive,(0+($alive -eq 0)),$exit,$new.Count,[int]((Get-Date)-$t0).TotalSeconds,$streams,$title)
          $new | ForEach-Object { Copy-Item $_.FullName ("out\bad\" + $f.Name + '_' + $_.Name) -Force -EA SilentlyContinue }
          $ev=@(Get-WinEvent -FilterHashtable @{LogName='Application'} -MaxEvents 40 -EA SilentlyContinue | Where-Object { $_.Message -match 'ONENOTE' -and $_.TimeCreated -gt $t0 })
          foreach ($q in $ev) { "APPERR $($f.Name) | " + ((($q.ProviderName + ' | ' + $q.Message) -replace '\s+',' ').Substring(0,[Math]::Min(320,($q.ProviderName + ' | ' + $q.Message).Length))) | Add-Content out\sweep_extra.txt }
          $ver=(@(& tasklist /FI "IMAGENAME eq ONENOTE.EXE") -join ' ')
          L ("still_running=" + ($ver -match 'ONENOTE'))
          if ($alive -eq 1 -and ($title -match '^Microsoft OneNote$' -or $title -match 'How do you want to start')) { L "NOTOPENED $($f.Name) title=$title" } else { L "OPENOK $($f.Name) title=$title" }
          Get-Process ONENOTE -EA SilentlyContinue | Stop-Process -Force -EA SilentlyContinue
        }
        $d=@(Get-ChildItem out\bad -File -EA SilentlyContinue)
        $opened_n = @(Select-String -Path $log -Pattern "OPENOK ").Count
        $notop_n = @(Select-String -Path $log -Pattern "NOTOPENED ").Count
        L ("SUMMARY cases=$($files.Count) dumps_total=$($d.Count) opened=$opened_n notopened=$notop_n")
        Get-ChildItem C:\dumps -File -EA SilentlyContinue | ForEach-Object { Copy-Item $_.FullName ("out\bad\" + $_.Name) -Force -EA SilentlyContinue }
        if ($opened_n -eq 0 -and $d.Count -eq 0) { L "INSTRUMENT_FAIL no case opened a page window and no fault" }

    - name: Run the carriers under cdb to capture the fault site
      if: always()
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path out,C:\tbcdb | Out-Null
        $cdbPath = @('C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe','C:\Program Files\Windows Kits\10\Debuggers\x64\cdb.exe') |
          Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
        "cdb=$cdbPath" | Add-Content out\cdb_log.txt
        if (-not $cdbPath) { "CDB_MISSING" | Add-Content out\cdb_log.txt; exit 0 }
        $txt = ".symfix`r`n.reload /f onmain.dll`r`nsxe -c `".ecxr; k 40; r; dq @rsp L20; g`" av`r`nsxe -c `".ecxr; k 40; r; g`" e06d7363`r`nsxe -c `".ecxr; k 40; g`" 015125c9`r`nsxd e06d7364`r`ng`r`n"
        [IO.File]::WriteAllText("C:\tbcdb\cmds.txt", $txt)
        "cmds=" + ($txt -replace "`r`n",' | ') | Add-Content out\cdb_log.txt
        $exe = 'C:\Program Files\Microsoft Office\root\Office16\ONENOTE.EXE'
        $sym = 'srv*C:\symbols*https://msdl.microsoft.com/download/symbols'
        foreach ($n in @('s2','c40','c80','wff','w40','w05','c20')) {
          $f = (Resolve-Path ("tbl\" + $n + ".one") -EA SilentlyContinue).Path
          if (-not $f) { "skip missing $n" | Add-Content out\cdb_log.txt; continue }
          Get-Process ONENOTE,cdb -EA SilentlyContinue | Stop-Process -Force -EA SilentlyContinue
          Start-Sleep -Seconds 2
          Set-Content -LiteralPath $f -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3" -Encoding ASCII -EA SilentlyContinue
          $t0 = Get-Date
          "===== $n start " + (Get-Date -Format s) | Add-Content out\cdb_log.txt
          $argl = '-G -norecord -y "' + $sym + '" -c "$$<C:\tbcdb\cmds.txt" "' + $exe + '" "' + $f + '"'
          "argv=" + $argl | Add-Content out\cdb_log.txt
          $o = "out\cdb_" + $n + ".txt"; $e = "out\cdb_" + $n + "_err.txt"
          Remove-Item $o,$e -Force -EA SilentlyContinue
          $p = Start-Process -FilePath $cdbPath -ArgumentList $argl -PassThru -RedirectStandardOutput $o -RedirectStandardError $e
          for ($i = 0; $i -lt 110; $i++) {
            Start-Sleep -Seconds 2
            if ($p.HasExited) { break }
          }
          $exited = $p.HasExited
          if (-not $exited) { Stop-Process -Id $p.Id -Force -EA SilentlyContinue }
          Get-Process ONENOTE,cdb -EA SilentlyContinue | Stop-Process -Force -EA SilentlyContinue
          $sz = 0; if (Test-Path -LiteralPath $o) { $sz = (Get-Item -LiteralPath $o).Length }
          $av = 0; $cpp = 0; $mod = 0
          if ($sz -gt 0) {
            $av  = @(Select-String -LiteralPath $o -Pattern 'Access violation' -EA SilentlyContinue).Count
            $cpp = @(Select-String -LiteralPath $o -Pattern 'E06D7363|e06d7363' -EA SilentlyContinue).Count
            $mod = @(Select-String -LiteralPath $o -Pattern 'ModLoad.*onmain' -EA SilentlyContinue).Count
          }
          $esz = 0; if (Test-Path -LiteralPath $e) { $esz = (Get-Item -LiteralPath $e).Length }
          "$n exited=$exited outbytes=$sz errbytes=$esz modload_onmain=$mod av=$av cpp=$cpp s=$((Get-Date)-$t0).TotalSeconds" | Add-Content out\cdb_log.txt
          Get-Content -LiteralPath $o -EA SilentlyContinue |
            Select-String -Pattern 'Access violation|Second chance|first chance|onmain!|STACK_TRACE|Child-SP|^ *[0-9a-f`]{2} |Exception code|ModLoad.*onmain|bad_alloc|_purecall|CrashWithRecovery|Memory expression' |
            Select-Object -First 70 | ForEach-Object { "  | " + ($_.Line -replace '\s+',' ') } | Add-Content out\cdb_log.txt
          if ($esz -gt 0) { Get-Content -LiteralPath $e -EA SilentlyContinue | Select-Object -First 15 | ForEach-Object { "  ERR | " + $_ } | Add-Content out\cdb_log.txt }
        }
        "CDB_DONE" | Add-Content out\cdb_log.txt

    - name: Attribute dumps
      shell: pwsh
      run: |
        $cdb=@(Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Debuggers" -Recurse -Include cdb.exe -EA SilentlyContinue | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1)
        "cdb=$($cdb.FullName)" | Out-File out\attribution.txt
        $d=@(Get-ChildItem out\bad -File -EA SilentlyContinue)
        "dumps=$($d.Count)" | Add-Content out\attribution.txt
        foreach ($x in $d) {
          "===== $($x.Name) size=$($x.Length)" | Add-Content out\attribution.txt
          if ($cdb) { & $cdb.FullName -z $x.FullName -c ".symfix; .reload /f onmain.dll; !analyze -v; k 20; .ecxr; r; lmvm onmain" 2>&1 | Select-Object -First 120 | Add-Content out\attribution.txt }
        }

    - name: Report
      shell: pwsh
      run: |
        if (Test-Path ver.txt) { Get-Content ver.txt }
        if (Test-Path out\sweep_log.txt) { Get-Content out\sweep_log.txt }
        if (Test-Path out\cdb_log.txt) { Get-Content out\cdb_log.txt | Select-Object -First 220 }
        if (Test-Path out\attribution.txt) { Get-Content out\attribution.txt | Select-Object -First 60 }

    - name: Collect evidence
      if: always()
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path evid | Out-Null
        Copy-Item out\* evid\ -Recurse -Force -EA SilentlyContinue
        if (Test-Path ver.txt) { Copy-Item ver.txt evid\ver.txt -Force }

    - name: Upload evidence
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: onenote-table-pageheap
        path: evid
