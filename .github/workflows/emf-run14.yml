name: emf-run14
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Download ODT
        shell: pwsh
        run: |
          $page = (Invoke-WebRequest -Uri "https://www.microsoft.com/en-us/download/details.aspx?id=49117" -UseBasicParsing).Content
          if ($page -match 'href="(https://download\.microsoft\.com/download/[^"]+officedeploymenttool[^"]*\.exe)"') {
            Invoke-WebRequest -Uri $Matches[1] -OutFile odt.exe
          } else { throw "odt link not found" }
          Start-Process -Wait -FilePath .\odt.exe -ArgumentList "/extract:odtx /quiet"
      - name: Install CurrentPreview x64 Office (Word)
        shell: pwsh
        run: |
          $xml = '<Configuration><Add OfficeClientEdition="64" Channel="http://officecdn.microsoft.com/pr/5440fd1f-7ecb-4221-8110-145efaa6372f"><Product ID="O365ProPlusRetail"><Language ID="en-us" /><ExcludeApp ID="Excel" /><ExcludeApp ID="PowerPoint" /><ExcludeApp ID="Outlook" /><ExcludeApp ID="OneDrive" /><ExcludeApp ID="OneNote" /><ExcludeApp ID="Lync" /><ExcludeApp ID="Bing" /></Product></Add><Display Level="None" AcceptEULA="TRUE" /><Updates Enabled="FALSE" /></Configuration>'
          Set-Content -Path cfg.xml -Value $xml
          Start-Process -Wait -FilePath .\odtx\setup.exe -ArgumentList "/configure","cfg.xml"
          (Get-Item "C:\Program Files\Microsoft Office\root\Office16\WINWORD.EXE").VersionInfo.FileVersion | Out-File ver.txt
      - name: Stage tools + carriers + cdb
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\emfwork\tools,C:\emfwork\out,C:\sym | Out-Null
          Copy-Item tools\emfprobe\* C:\emfwork\tools\ -Recurse -Force
          winget install Microsoft.WinDbg --accept-source-agreements --accept-package-agreements --disable-interactivity | Out-Null
          $c=Get-ChildItem 'C:\Program Files\WindowsApps' -Directory -Filter 'Microsoft.WinDbg*' | ForEach-Object { Get-ChildItem $_.FullName -Recurse -Filter cdb.exe | Where-Object {$_.DirectoryName -match 'amd64'} } | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path C:\emfwork\dbg | Out-Null
          Copy-Item $c.FullName C:\emfwork\dbg\cdb.exe
          Get-ChildItem $c.DirectoryName -Filter *.dll | Copy-Item -Destination C:\emfwork\dbg\ -Force
          python C:\emfwork\tools\gen_emf.py good C:\emfwork\good.emf
          python C:\emfwork\tools\gen_emf.py patch C:\emfwork\good.emf C:\emfwork\evil.emf
          Set-Content C:\emfwork\seed.txt 'seed'
      - name: Run 14 probes
        shell: powershell
        run: |
          $env:EMFTOOLS='C:\emfwork\tools'
          & C:\emfwork\tools\run14.ps1
      - name: Show
        if: always()
        shell: pwsh
        run: |
          Get-Content C:\emfwork\out\r14.txt -ErrorAction SilentlyContinue
          "--- bps ---"
          Get-Content C:\emfwork\dbgcmd14.txt -ErrorAction SilentlyContinue
      - name: Collect
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ${{ github.workspace }}\out14 | Out-Null
          Copy-Item C:\emfwork\out\* -Destination ${{ github.workspace }}\out14 -Force -ErrorAction SilentlyContinue
          Copy-Item ver.txt -Destination ${{ github.workspace }}\out14 -Force -ErrorAction SilentlyContinue
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run14-logs
          path: out14/**
          if-no-files-found: warn
