name: mso-htmllen-smoke-x64
# Single-carrier smoke run: proves the cdb argv, the three anchors and the breakpoint payloads
# actually work before a full wave is committed.
# The instrument anchors four sites inside the installed mso.dll by code signature (no PDB, no
# symbol server), then opens every HTML carrier under cdb with full page heap armed and reports how
# often the commit runs, how often the fetched count comes out negative, and the length handed to
# the copy.  Carriers are generated at run time from ppseed/ppt_html_carriers.py, so no document
# payload is stored in this repository.
on: [workflow_dispatch]
jobs:
  p:
    runs-on: windows-latest
    timeout-minutes: 330
    steps:
    - uses: actions/checkout@v4
    - name: Syntax gate for the probe script
      shell: pwsh
      run: |
        $errs = $null
        [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\ppseed\mso_html_len_probe.ps1", [ref]$null, [ref]$errs)
        if ($errs) { $errs | ForEach-Object { "PARSE " + $_.Extent.StartLineNumber + " " + $_.Message }; exit 1 }
        "PARSE_OK"
    - name: Download ODT
      shell: pwsh
      run: |
        $page = (Invoke-WebRequest -Uri "https://www.microsoft.com/en-us/download/details.aspx?id=49117" -UseBasicParsing).Content
        if ($page -match 'href="(https://download\.microsoft\.com/download/[^"]+officedeploymenttool[^"]*\.exe)"') {
          Invoke-WebRequest -Uri $Matches[1] -OutFile odt.exe
        } else { throw 'odt link not found' }
        Start-Process -Wait -FilePath .\odt.exe -ArgumentList "/extract:odtx /quiet"
    - name: Install CurrentPreview Office (x64)
      shell: pwsh
      run: |
        $cfg = '<Configuration><Add OfficeClientEdition="64" Channel="{0}"><Product ID="O365ProPlusRetail"><Language ID="en-us" /><ExcludeApp ID="Excel" /><ExcludeApp ID="OneNote" /><ExcludeApp ID="Access" /><ExcludeApp ID="Publisher" /><ExcludeApp ID="Teams" /><ExcludeApp ID="SharePointDesigner" /><ExcludeApp ID="FormConverter" /></Product></Add><Display Level="None" AcceptEULA="TRUE" /><Updates Enabled="FALSE" /></Configuration>'
        foreach ($ch in @('CurrentChannelPreview','CurrentChannel','MonthlyChannel')) {
          $xml = $cfg -f $ch
          Set-Content -Path cfg.xml -Value $xml
          "trying channel=$ch"
          $r = Start-Process -Wait -PassThru -FilePath .\odtx\setup.exe -ArgumentList "/configure","cfg.xml"
          "setup exit=$($r.ExitCode)"
          $msoCand = @('C:\Program Files\Common Files\Microsoft Shared\OFFICE16\mso.dll','C:\Program Files\Microsoft Office\root\vfs\ProgramFilesCommonX64\Microsoft Shared\OFFICE16\mso.dll','C:\Program Files\Microsoft Office\root\vfs\ProgramFilesCommonX86\Microsoft Shared\OFFICE16\mso.dll','C:\Program Files\Microsoft Office\root\Office16\mso.dll')
          $m = $null
          foreach ($cp in $msoCand) { $t = Get-Item $cp -EA SilentlyContinue; if ($t) { $m = $t; break } }
          if (-not $m) { $m = Get-ChildItem 'C:\Program Files\Microsoft Office\root' -Recurse -Filter mso.dll -EA SilentlyContinue | Sort-Object Length -Descending | Select-Object -First 1 }
          if ($m) {
            "mso v{0} size={1} path={2}" -f $m.VersionInfo.FileVersion, $m.Length, $m.FullName
            ("{0} {1}" -f $ch, $m.VersionInfo.FileVersion) | Out-File ver.txt
            break
          }
          (Get-Content setup.log -EA SilentlyContinue | Select-Object -Last 25) -join "`n"
          $pp = Get-Item "C:\Program Files\Microsoft Office\root\Office16\POWERPNT.EXE" -EA SilentlyContinue
          "after $ch : mso=$([bool]$m) pp=$([bool]$pp)"
          Start-Process -Wait -FilePath .\odtx\setup.exe -ArgumentList "/configure","cfg.xml","/force-downgrade" -EA SilentlyContinue
        }
        $found = @($msoCand | Where-Object { Test-Path $_ })
        if ($found.Count -eq 0) {
          $h = Get-ChildItem 'C:\Program Files\Microsoft Office\root' -Recurse -Filter mso.dll -EA SilentlyContinue | Sort-Object Length -Descending | Select-Object -First 1
          if ($h) { $found = @($h.FullName) }
        }
        "mso locations: $($found -join ' | ')"
        if ($found.Count -eq 0) {
          "Office16 listing:"; ((Get-ChildItem "C:\Program Files\Microsoft Office\root\Office16" -EA SilentlyContinue | Select-Object -First 40).Name -join " ")
          throw "mso missing after all channels"
        }
    - name: Build HTML carriers
      shell: pwsh
      run: |
        python ppseed\ppt_html_carriers.py carriers_h
        $n = @(Get-ChildItem carriers_h -File).Count
        "carriers=$n"
        if ($n -lt 12) { throw "carrier generation failed ($n)" }
    - name: Probe the div/span length path in PowerPoint
      continue-on-error: true
      shell: pwsh
      run: |
        pwsh -NoProfile -ExecutionPolicy Bypass -File ppseed\mso_html_len_probe.ps1 -Dir carriers_h -Tag htmllenpp -App POWERPNT.EXE -Base (Get-Location).Path -WaitSec 240 -NameFilter "^h01_plain$"
    - name: Report
      shell: pwsh
      if: always()
      run: |
        foreach ($t in @('htmllenpp','htmllenwd')) {
          $f = "out\$($t)_log.txt"
          "##### $t"
          if (Test-Path $f) { Get-Content $f | Select-String 'SIG |TRY |state=|ANCHOR|NO_CDB|dump_total|GlobalFlag|cases=|msoPath|DUMP_CHANNEL|INSTRUMENT|cdb=|PARSE' } else { "missing" }
        }
        "dumps=" + @(Get-ChildItem dumps -Filter *.dmp -EA SilentlyContinue).Count
        (Get-ChildItem dumps -Filter *.dmp -EA SilentlyContinue | ForEach-Object { $_.Name + ":" + $_.Length }) -join " "
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: htmllen-smoke-out
        path: |
          out/
          ver.txt
          dumps/
        if-no-files-found: warn
        retention-days: 30
