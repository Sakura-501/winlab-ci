name: html5-delprop-probe
'on':
  workflow_dispatch: null
jobs:
  t:
    runs-on: windows-latest
    timeout-minutes: 110
    steps:
    - name: Download ODT
      shell: pwsh
      run: "$page = (Invoke-WebRequest -Uri \"https://www.microsoft.com/en-us/download/details.aspx?id=49117\" -UseBasicParsing).Content\nif ($page -match 'href=\\\"(https://download\\.microsoft\\.com/download/[^\\\"]+officedeploymenttool[^\\\"]*\\.exe)\\\"') {\n  Invoke-WebRequest -Uri $Matches[1] -OutFile odt.exe\n} else { throw \"odt link not found\" }\nStart-Process -Wait -FilePath .\\odt.exe -ArgumentList \"/extract:odtx /quiet\""
    - name: Install CurrentPreview x64 Word
      shell: pwsh
      run: '$xml = ''<Configuration><Add OfficeClientEdition="64" Channel="CurrentChannelPreview"><Product ID="O365ProPlusRetail"><Language ID="en-us" /><ExcludeApp ID="Excel" /><ExcludeApp ID="PowerPoint" /><ExcludeApp ID="Outlook" /><ExcludeApp ID="OneDrive" /><ExcludeApp ID="OneNote" /><ExcludeApp ID="Lync" /><ExcludeApp ID="Bing" /></Product></Add><Display Level="None" AcceptEULA="TRUE" /><Updates Enabled="FALSE" /></Configuration>''

        Set-Content -Path cfg.xml -Value $xml

        Start-Process -Wait -FilePath .\odtx\setup.exe -ArgumentList "/configure","cfg.xml"

        $w = Get-Item "C:\Program Files\Microsoft Office\root\Office16\wwlib.dll" -ErrorAction SilentlyContinue

        if (-not $w) { throw "install failed" }

        "wwlib: {0} bytes v{1}" -f $w.Length, $w.VersionInfo.FileVersion

        $w.VersionInfo.FileVersion | Out-File ver.txt'
    - name: Write carriers
      shell: pwsh
      run: '[IO.File]::WriteAllBytes("$PWD\ctl_base_clean.doc", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\h_dup_1.htm", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\h_dup_1020.htm", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\h_dup_1023.doc", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\h_dup_1023.htm", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\h_dup_1024.htm", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\h_dup_128.htm", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\h_dup_2.htm", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\h_dup_252.htm", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\h_dup_253.doc", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\h_dup_253.htm", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\h_dup_254.htm", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\h_dup_254.html", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\h_dup_255.htm", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\h_dup_256.htm", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\h_dup_257.htm", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\h_dup_300.htm", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\h_dup_508.htm", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\h_dup_510.htm", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\h_dup_64.htm", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\h_dup_8.htm", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\h_dup_two_par.doc", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\h_dup_two_par.htm", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\h_mixed_kinds.doc", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\h_mixed_kinds.htm", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\h_near_2.htm", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\h_near_253.htm", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\h_near_253.html", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\h_near_254.htm", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\h_near_300.htm", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\h_near_8.htm", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\h_paraonly_1023.htm", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\h_paraonly_253.htm", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\h_paraonly_254.htm", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\h_paraonly_8.htm", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\h_styleonly_1023.htm", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\h_styleonly_253.htm", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\h_styleonly_254.htm", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\h_styleonly_8.htm", [Convert]::FromBase64String(""))'
    - name: Configure LocalDumps
      shell: pwsh
      run: '$k = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\WINWORD.EXE"

        New-Item -Path $k -Force | Out-Null

        Set-ItemProperty -Path $k -Name DumpFolder -Value "C:\dumps" -Type ExpandString

        Set-ItemProperty -Path $k -Name DumpType -Value 2 -Type DWord'
    - name: Enable full page heap for WINWORD
      shell: pwsh
      run: "$log = \"out\\pageheap.txt\"\nNew-Item -ItemType Directory -Force -Path out | Out-Null\n$roots = @(\"C:\\Program Files (x86)\\Windows Kits\\10\\Debuggers\", \"C:\\Program Files (x86)\\Windows Kits\\10\\bin\")\n$cands = @()\nforeach ($r in $roots) {\n  if (Test-Path $r) {\n    $cands += @(Get-ChildItem $r -Recurse -Include gflags.exe -ErrorAction SilentlyContinue |\n                Where-Object { $_.FullName -notmatch 'arm64' })\n  }\n}\nif (Test-Path \"C:\\Windows\\System32\\gflags.exe\") { $cands += @(Get-Item \"C:\\Windows\\System32\\gflags.exe\") }\n\"candidates=\" + (($cands | ForEach-Object { $_.FullName }) -join \"; \") | Add-Content $log\nforeach ($g in $cands) {\n  try {\n    & $g.FullName /p /enable WINWORD.EXE /full | Out-Null\n    \"gflags_ok=$($g.FullName)\" | Add-Content $log\n    break\n  } catch {\n    \"gflags_fail=$($g.FullName) $($_.Exception.Message)\" | Add-Content $log\n  }\n}\n$k = \"HKLM:\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Image File Execution Options\\WINWORD.EXE\"\nNew-Item -Path $k -Force | Out-Null\nSet-ItemProperty -Path $k -Name GlobalFlag -Value 0x200 -Type DWord\nSet-ItemProperty -Path $k -Name EnableVerifier -Value 1 -Type DWord\nSet-ItemProperty -Path $k -Name VerifierFlags -Value 0 -Type DWord\n\"registry GlobalFlag=$((Get-ItemProperty $k).GlobalFlag) EnableVerifier=$((Get-ItemProperty $k).EnableVerifier)\" | Add-Content $log\nGet-Content $log\n"
    - name: Build minidbg16 and resolve sites
      shell: pwsh
      run: "[IO.File]::WriteAllBytes(\"$PWD\\minidbg16.cs\", [Convert]::FromBase64String(\"\"\
        ))\n$csc = \"C:\\Windows\\Microsoft.NET\\Framework64\\v4.0.30319\\csc.exe\"\n& $csc /nologo /out:minidbg16.exe minidbg16.cs\nif (-not (Test-Path minidbg16.exe)) { throw 'csc failed' }\n$ww = [IO.File]::ReadAllBytes('C:\\Program Files\\Microsoft Office\\root\\Office16\\wwlib.dll')\n\"wwlib bytes: \" + $ww.Length\nAdd-Type -TypeDefinition @'\nusing System;\npublic static class Scan5 {\n  public static string Find(byte[] d, byte[] sig, int add) {\n    int idx = -1;\n    for (int i = 0; i + sig.Length < d.Length; i++) {\n      bool ok = true;\n      for (int j = 0; j < sig.Length; j++) if (d[i + j] != sig[j]) { ok = false; break; }\n      if (ok) { idx = i; break; }\n    }\n    if (idx < 0) return \"NOTFOUND\";\n    int pe = BitConverter.ToInt32(d, 0x3C);\n    ushort nsec = BitConverter.ToUInt16(d, pe + 6);\n    ushort szopt = BitConverter.ToUInt16(d, pe + 20);\n    int so = pe + 24 + szopt;\n    for (int s2 = 0; s2 < nsec; s2++) {\n      int e = so + 40 * s2;\n      uint vsz = BitConverter.ToUInt32(d, e + 8);\n      uint va = BitConverter.ToUInt32(d, e + 12);\n      uint praw = BitConverter.ToUInt32(d, e + 16);\n      uint poff = BitConverter.ToUInt32(d, e + 20);\n      uint span = Math.Max(vsz, praw);\n      if (idx >= (int)poff && idx < (int)(poff + span))\n        return (va + (uint)(idx - (int)poff) + (uint)add).ToString(\"X\");\n    }\n    return \"SECTMAPFAIL_\" + idx;\n  }\n}\n'@\n$sa = [Scan5]::Find($ww, [byte[]](0x48,0x89,0x5C,0x24,0x18,0x55,0x56,0x57,0x41,0x54,0x41,0x55,0x41,0x56,0x41,0x57,0x48,0x83,0xEC,0x50,0x48,0x8B,0xFA), 0x287)\n$sb = [Scan5]::Find($ww, [byte[]](0x48,0x89,0x5C,0x24,0x18,0x55,0x56,0x57,0x41,0x54,0x41,0x55,0x41,0x56,0x41,0x57,0x48,0x83,0xEC,0x50,0x48,0x8B,0xFA), 0x20B)\n$sd = [Scan5]::Find($ww, [byte[]](0x40,0x53,0x55,0x56,0x57,0x48,0x83,0xEC,0x28,0x44,0x0F,0xB7,0x0A), 0x81)\nWrite-Host (\"RVA ap tail mm: $sa $sb $sd\")\nSet-Content -Path rvas.txt -Value (\"$sa $sb $sd\")"
    - name: Probe each carrier
      shell: pwsh
      run: "$word = \"C:\\Program Files\\Microsoft Office\\root\\Office16\\WINWORD.EXE\"\n$r = (Get-Content rvas.txt).Split(\" \")\nif ($r[0] -notmatch '^[0-9A-Fa-f]+$' -or $r[2] -notmatch '^[0-9A-Fa-f]+$') { Write-Host \"RESOLVE FAILED: $r\"; exit 0 }\n$bps = \"0x$($r[0])=ap,0x$($r[1])=tail,0x$($r[2])=mm\"\nforeach ($n in @('ctl_base_clean','h_dup_1','h_dup_1020','h_dup_1023','h_dup_1023','h_dup_1024','h_dup_128','h_dup_2','h_dup_252','h_dup_253','h_dup_253','h_dup_254','h_dup_254','h_dup_255','h_dup_256','h_dup_257','h_dup_300','h_dup_508','h_dup_510','h_dup_64','h_dup_8','h_dup_two_par','h_dup_two_par','h_mixed_kinds','h_mixed_kinds','h_near_2','h_near_253','h_near_253','h_near_254','h_near_300','h_near_8','h_paraonly_1023','h_paraonly_253','h_paraonly_254','h_paraonly_8','h_styleonly_1023','h_styleonly_253','h_styleonly_254','h_styleonly_8')) {\n  Write-Host \"===== PROBE $n =====\"\n  Remove-Item -Path 'HKCU:\\Software\\Microsoft\\Office\\16.0\\Word\\Resiliency' -Recurse -ErrorAction SilentlyContinue\n  $f = (Get-ChildItem -Path \".\" -Filter \"$n.*\" | Select-Object -First 1).FullName\n  & .\\minidbg16.exe $word $f -- 60 \"$bps\" 2>&1 | Tee-Object \"probe_$n.txt\" | Select-String -Pattern \"HIT |MM |AP |TAIL |ccess violation|usage|EXCEPTION\" | ForEach-Object { $_.Line }\n  Get-Process WINWORD -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue\n  Start-Sleep 2\n}\nGet-ChildItem C:\\dumps -ErrorAction SilentlyContinue | ForEach-Object { Write-Host (\"DUMP: \" + $_.Name + \" \" + $_.Length) }"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: html5-delprop-probe
        path: 'probe_ctl_base_clean.txt

          probe_h_dup_1.txt

          probe_h_dup_1020.txt

          probe_h_dup_1023.txt

          probe_h_dup_1023.txt

          probe_h_dup_1024.txt

          probe_h_dup_128.txt

          probe_h_dup_2.txt

          probe_h_dup_252.txt

          probe_h_dup_253.txt

          probe_h_dup_253.txt

          probe_h_dup_254.txt

          probe_h_dup_254.txt

          probe_h_dup_255.txt

          probe_h_dup_256.txt

          probe_h_dup_257.txt

          probe_h_dup_300.txt

          probe_h_dup_508.txt

          probe_h_dup_510.txt

          probe_h_dup_64.txt

          probe_h_dup_8.txt

          probe_h_dup_two_par.txt

          probe_h_dup_two_par.txt

          probe_h_mixed_kinds.txt

          probe_h_mixed_kinds.txt

          probe_h_near_2.txt

          probe_h_near_253.txt

          probe_h_near_253.txt

          probe_h_near_254.txt

          probe_h_near_300.txt

          probe_h_near_8.txt

          probe_h_paraonly_1023.txt

          probe_h_paraonly_253.txt

          probe_h_paraonly_254.txt

          probe_h_paraonly_8.txt

          probe_h_styleonly_1023.txt

          probe_h_styleonly_253.txt

          probe_h_styleonly_254.txt

          probe_h_styleonly_8.txt

          rvas.txt

          ver.txt'
        if-no-files-found: ignore
