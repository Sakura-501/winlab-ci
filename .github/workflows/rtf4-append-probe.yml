name: rtf4-append-probe
on:
  workflow_dispatch: null
jobs:
  t:
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
    - name: Download ODT
      shell: pwsh
      run: "$page = (Invoke-WebRequest -Uri \"https://www.microsoft.com/en-us/download/details.aspx?id=49117\" -UseBasicParsing).Content\nif ($page -match 'href=\\\"(https://download\\.microsoft\\.com/download/[^\\\"]+officedeploymenttool[^\\\"]*\\.exe)\\\"') {\n  Invoke-WebRequest -Uri $Matches[1] -OutFile odt.exe\n} else { throw \"odt link not found\" }\nStart-Process -Wait -FilePath .\\odt.exe -ArgumentList \"/extract:odtx /quiet\""
    - name: Install CurrentChannelPreview x64 Word
      shell: pwsh
      run: '$xml = ''<Configuration><Add OfficeClientEdition="64" Channel="CurrentChannelPreview"><Product ID="O365ProPlusRetail"><Language ID="en-us" /><ExcludeApp ID="Excel" /><ExcludeApp ID="PowerPoint" /><ExcludeApp ID="Outlook" /><ExcludeApp ID="OneDrive" /><ExcludeApp ID="OneNote" /><ExcludeApp ID="Lync" /><ExcludeApp ID="Bing" /></Product></Add><Display Level="None" AcceptEULA="TRUE" /><Updates Enabled="FALSE" /></Configuration>''

        Set-Content -Path cfg.xml -Value $xml

        Start-Process -Wait -FilePath .\odtx\setup.exe -ArgumentList "/configure","cfg.xml"

        $w = Get-Item "C:\Program Files\Microsoft Office\root\Office16\wwlib.dll" -ErrorAction SilentlyContinue

        if (-not $w) { throw "install failed" }

        "wwlib v$($w.VersionInfo.FileVersion)"

        $w.VersionInfo.FileVersion | Out-File ver.txt'
    - name: Write carriers
      shell: pwsh
      run: '[IO.File]::WriteAllBytes("$PWD\base_clean.doc", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\poc_sepx_oob.doc", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\poc_sepx_tamper.doc", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\poc_sepx_prcdata.doc", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\diag_nfib193.doc", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\lotab.doc", [Convert]::FromBase64String(""))'
    - name: LocalDumps
      shell: pwsh
      run: '$ld = "HKLM:\SOFTWARE\Microsoft\Windows Error Reporting\LocalDumps"

        New-Item -Path $ld -Force | Out-Null

        Set-ItemProperty -Path $ld -Name DumpFolder -Value "C:\dumps" -Type ExpandString

        Set-ItemProperty -Path $ld -Name DumpType -Value 2 -Type DWord

        Set-ItemProperty -Path $ld -Name DumpCount -Value 12 -Type DWord

        New-Item -ItemType Directory -Force -Path C:\dumps | Out-Null'
    - name: Build minidbg16 and resolve sites
      shell: pwsh
      run: "[IO.File]::WriteAllBytes(\"$PWD\\minidbg16.cs\", [Convert]::FromBase64String(\"\"\
        ))\n$csc = \"C:\\Windows\\Microsoft.NET\\Framework64\\v4.0.30319\\csc.exe\"\n& $csc /nologo /out:minidbg16.exe minidbg16.cs\nif (-not (Test-Path minidbg16.exe)) { throw 'csc failed' }\n$ww = [IO.File]::ReadAllBytes('C:\\Program Files\\Microsoft Office\\root\\Office16\\wwlib.dll')\nAdd-Type -TypeDefinition @'\nusing System;\npublic static class Scan5 {\n  public static string Find(byte[] d, byte[] sig, int add) {\n    int idx = -1;\n    for (int i = 0; i + sig.Length < d.Length; i++) {\n      bool ok = true;\n      for (int j = 0; j < sig.Length; j++) if (d[i + j] != sig[j]) { ok = false; break; }\n      if (ok) { idx = i; break; }\n    }\n    if (idx < 0) return \"NOTFOUND\";\n    int pe = BitConverter.ToInt32(d, 0x3C);\n    ushort nsec = BitConverter.ToUInt16(d, pe + 6);\n    ushort szopt = BitConverter.ToUInt16(d, pe + 20);\n    int so = pe + 24 + szopt;\n    for (int s2 = 0; s2 < nsec; s2++) {\n      int e = so + 40 * s2;\n      uint vsz = BitConverter.ToUInt32(d, e + 8);\n      uint va = BitConverter.ToUInt32(d, e + 12);\n      uint praw = BitConverter.ToUInt32(d, e + 16);\n      uint poff = BitConverter.ToUInt32(d, e + 20);\n      uint span = Math.Max(vsz, praw);\n      if (idx >= (int)poff && idx < (int)(poff + span))\n        return (va + (uint)(idx - (int)poff) + (uint)add).ToString(\"X\");\n    }\n    return \"SECTMAPFAIL\";\n  }\n}\n'@\n$sa = [Scan5]::Find($ww, [byte[]](0x48,0x89,0x5C,0x24,0x18,0x55,0x56,0x57,0x41,0x54,0x41,0x55,0x41,0x56,0x41,0x57,0x48,0x83,0xEC,0x50,0x48,0x8B,0xFA), 0x287)\n$sb = [Scan5]::Find($ww, [byte[]](0x48,0x89,0x5C,0x24,0x18,0x55,0x56,0x57,0x41,0x54,0x41,0x55,0x41,0x56,0x41,0x57,0x48,0x83,0xEC,0x50,0x48,0x8B,0xFA), 0x20B)\n$sd = [Scan5]::Find($ww, [byte[]](0x40,0x53,0x55,0x56,0x57,0x48,0x83,0xEC,0x28,0x44,0x0F,0xB7,0x0A), 0x81)\nSet-Content -Path rvas.txt -Value (\"$sa $sb $sd\")\n\"FAppend memcpy-call=$sa  FAppend memmove-call=$sb  Delete memmove-call=$sd\"\n"
    - name: Probe each carrier
      shell: pwsh
      run: "$word = 'C:\\Program Files\\Microsoft Office\\root\\Office16\\WINWORD.EXE'\n$r = (Get-Content rvas.txt).Split(\" \")\nif ($r[0] -notmatch '^[0-9A-Fa-f]+$' -or $r[2] -notmatch '^[0-9A-Fa-f]+$') { Write-Host \"RESOLVE FAILED: $r\"; exit 0 }\n$bps = \"0x$($r[0])=mm,0x$($r[1])=mm,0x$($r[2])=mm\"\nforeach ($n in @('base_clean','poc_sepx_oob','poc_sepx_tamper','poc_sepx_prcdata','diag_nfib193','lotab')) {\n  Write-Host \"===== PROBE $n =====\"\n  Remove-Item -Path 'HKCU:\\Software\\Microsoft\\Office\\16.0\\Word\\Resiliency' -Recurse -ErrorAction SilentlyContinue\n  $f = (Get-ChildItem -Path '.' -Filter \"$n.doc\" | Select-Object -First 1).FullName\n  & .\\minidbg16.exe $word $f -- 60 \"$bps\" 2>&1 | Tee-Object \"probe_$n.txt\" | Select-String -Pattern \"HIT |MM |Access violation|EXCEPTION|usage\" | ForEach-Object { $_.Line }\n  Get-Process WINWORD -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue\n  Start-Sleep 2\n}\nGet-ChildItem C:\\dumps -ErrorAction SilentlyContinue | ForEach-Object { Write-Host (\"DUMP: \" + $_.Name + \" \" + $_.Length) }"
    - uses: actions/upload-artifact@v4
      with:
        name: rtf4-append-probe
        path: 'probe_*.txt

          rvas.txt

          ver.txt'
      if: always()
