        tar -xzf C:\edgebat\p.gz -C C:\edgebat
        Get-ChildItem C:\edgebat | ForEach-Object { '{0} {1}' -f $_.Name, $_.Length }
        python -c "import ast;ast.parse(open(r'C:\edgebat\server.py').read());print('server_parses')"
        $tok=$null; $err=$null
