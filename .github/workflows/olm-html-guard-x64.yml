name: olm-html-guard-x64

# Guard-page sweep of OLMAPI32's RTF<->HTML converter engine on native x64.
#
# The engine takes its allocator from two global function-pointer slots
# (?lpRTFHTMLAllocateBuffer / ?lpRTFHTMLFreeBuffer; 121 engine functions read them and only the
# initializer additionally calls the real MAPI*Buffer routines), so a test process can re-home
# every engine allocation.  The replacement tail-aligns each block against a PAGE_NOACCESS page
# and decommits pages on free, so a one-byte write past the requested size faults, a freed block
# cannot be touched silently, and a second free is reported instead of corrupting the heap.
#
# Nothing is concluded from a "0 events" reading unless the same binary first reports PROBE_OK
# with off=+0 on its own deliberate overflow - that gate runs before any sweep stage.

on:
  workflow_dispatch:
    inputs:
      dense_per_stage:
        description: 'dense-corpus records per dense stage (0 = skip dense stages)'
        default: '3000'

jobs:
  guard:
    runs-on: windows-latest
    steps:
    - name: Download ODT
      run: |
        $ProgressPreference='SilentlyContinue'
        $urls = @(
          'https://download.microsoft.com/download/14/5/b/145b1cb9-d708-4e2e-8f1a-a0c66b3e651c/officedeploymenttool_18827-20262.exe',
          'https://download.microsoft.com/download/2/7/A/27AF1BE6-DD20-4CB4-B154-EBAB8A7D4A7E/officedeploymenttool_13127-20612.exe'
        )
        foreach ($u in $urls) {
          try { Invoke-WebRequest -Uri $u -OutFile odt.exe -ErrorAction Stop; break } catch { "odt fetch failed: $($_.Exception.Message)" }
        }
        if (-not (Test-Path odt.exe)) { throw 'no ODT available' }
        Start-Process -FilePath .\odt.exe -ArgumentList '/quiet','/norestart' -Wait
    - name: Install Current x64 (Outlook kept, rest excluded)
      run: |
        New-Item -ItemType Directory -Force -Path cfg | Out-Null
        $xml = @'
        <Configuration>
          <Add OfficeClientEdition="64" Channel="Current">
            <Product ID="O365ProPlusRetail"><Language ID="en-us" /></Product>
          </Add>
          <ExcludeApp ID="Access" /><ExcludeApp ID="Lync" /><ExcludeApp ID="OneDrive" />
          <ExcludeApp ID="Groove" /><ExcludeApp ID="Publisher" /><ExcludeApp ID="SharePointDesigner" />
          <ExcludeApp ID="Teams" /><ExcludeApp ID="FormParser" /><ExcludeApp ID="Bing" /><ExcludeApp ID="CoPilot" />
          <Display Level="None" AcceptEULA="TRUE" />
        </Configuration>
        '@
        $xml | Out-File cfg\c.xml -Encoding ascii
        $setup = (Get-ChildItem 'C:\Program Files*' -Recurse -Filter 'setup.exe' -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'Office' } | Select-Object -First 1).FullName
        "setup=$setup"
        Start-Process -FilePath $setup -ArgumentList '/configure','cfg\c.xml' -Wait
        Get-Item 'C:\Program Files\Microsoft Office\root\Office16\OLMAPI32.DLL' | Select-Object Name, Length, @{n='ver';e={$_.VersionInfo.FileVersion}} | Format-Table | Out-String
    - name: Materialize harness and corpus generator
      run: |
        New-Item -ItemType Directory -Force -Path bin, build, corpus, out, tools | Out-Null
        Set-Content -Path gb.b64 -Value '' -NoNewline
        Set-Content -Path gen.b64 -Value '' -NoNewline
        python -c "import base64;open('bin/guardbench.c','wb').write(base64.b64decode(open('gb.b64').read()))"
        python -c "import base64;open('tools/mk_html_corpus.py','wb').write(base64.b64decode(open('gen.b64').read()))"
        Get-Item bin\guardbench.c, tools\mk_html_corpus.py | Select-Object Name, Length | Format-Table | Out-String
    - name: Build harness (x64)
      run: |
        $vc = (Get-ChildItem 'C:\Program Files\Microsoft Visual Studio' -Recurse -Filter 'VsDevCmd.bat' -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
        $cmd = '"' + $vc + '" -arch=x64 && cl /nologo /O2 /W3 /std:c17 /Tc bin\guardbench.c /Fe:bin\gbx.exe /Fo:build\ /link ole32.lib oleaut32.lib advapi32.lib user32.lib'
        cmd /c $cmd
        if (-not (Test-Path bin\gbx.exe)) { throw 'harness build failed' }
    - name: Gate the instrument on itself
      run: |
        $env:PATH = 'C:\Program Files\Microsoft Office\root\Office16;' + $env:PATH
        $o = & .\bin\gbx.exe probe 2>&1 | Out-String
        $o | Out-File out\probe.txt
        $ok = ($o -match 'PROBE_OK') -and ($o -match 'OOBWRITE PAST_END') -and ($o -match 'off=\+0') -and ($o -match 'DOUBLEFREE') -and ($o -match 'slots_found=1')
        ($o -split "`n" | Where-Object { $_ -match 'PROBE|OOBWRITE|DOUBLEFREE|PATCHED|RVA_SLOTS|rc=' }) -join ' | ' | Tee-Object out\probe_sum.txt
        "probe verdict=$(if($ok){'ARMED'}else{'BLIND'})"
        if (-not $ok) { throw 'instrument blind: aborting' }
        exit 0
    - name: Control that the engine allocates through the shim
      run: |
        $env:PATH = 'C:\Program Files\Microsoft Office\root\Office16;' + $env:PATH
        python tools\mk_html_corpus.py corpus
        "base_html=" + (Get-Item corpus\html.txt).Length
        $o = & .\bin\gbx.exe sweep corpus\html.txt 60 0 slot out\ctl_log.txt 2>&1 | Out-String
        $o | Out-File out\control.txt
        ($o -split "`n" | Where-Object { $_ -match 'PATCHED|after_warmup|GUARD totals|GB50|NOEXPORTS|SHIM_UNUSED' }) -join ' | ' | Tee-Object out\control_sum.txt
        if ($o -notmatch 'after_warmup_under_shim allocs=[1-9]') { throw 'shim is not the engine allocator' }
        if ($o -notmatch 'nonzero_out=[1-9]') { throw 'converters produced no output' }
        exit 0
    - name: Stage A - hand-written boundary corpus
      run: |
        $env:PATH = 'C:\Program Files\Microsoft Office\root\Office16;' + $env:PATH
        $o = & .\bin\gbx.exe sweep corpus\html.txt 4000 0 slot out\stageA_log.txt 2>&1 | Out-String
        $o | Out-File out\stageA.txt
        ($o -split "`n" | Where-Object { $_ -match 'GUARD totals|GB50|OOBWRITE|OOBREAD|UAF-|DOUBLEFREE|STOP_EVENT' }) -join "`n" | Tee-Object out\stageA_sum.txt
        exit 0
    - name: Stage B - dense length sweep, first chunk
      run: |
        $n = [int]${{ inputs.dense_per_stage }}
        if ($n -le 0) { 'dense stages skipped'; exit 0 }
        $env:PATH = 'C:\Program Files\Microsoft Office\root\Office16;' + $env:PATH
        python tools\mk_html_corpus.py corpus dense
        "dense_html=" + (Get-Item corpus\html.txt).Length
        $o = & .\bin\gbx.exe sweep corpus\html.txt $n 946 slot out\stageB_log.txt 2>&1 | Out-String
        $o | Out-File out\stageB.txt
        ($o -split "`n" | Where-Object { $_ -match 'GUARD totals|GB50|OOBWRITE|OOBREAD|UAF-|DOUBLEFREE|STOP_EVENT' }) -join "`n" | Tee-Object out\stageB_sum.txt
        exit 0
    - name: Stage C - dense length sweep, second chunk
      run: |
        $n = [int]${{ inputs.dense_per_stage }}
        if ($n -le 0) { 'dense stages skipped'; exit 0 }
        $env:PATH = 'C:\Program Files\Microsoft Office\root\Office16;' + $env:PATH
        $s = 946 + $n
        $o = & .\bin\gbx.exe sweep corpus\html.txt $n $s slot out\stageC_log.txt 2>&1 | Out-String
        $o | Out-File out\stageC.txt
        ($o -split "`n" | Where-Object { $_ -match 'GUARD totals|GB50|OOBWRITE|OOBREAD|UAF-|DOUBLEFREE|STOP_EVENT' }) -join "`n" | Tee-Object out\stageC_sum.txt
        exit 0
    - name: Harvest guard events
      run: |
        $ev = Get-ChildItem out\*_log.txt -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -ErrorAction SilentlyContinue }
        $hits = @($ev | Select-String 'OOBWRITE|OOBREAD|UAF-|DOUBLEFREE')
        "event_lines=" + $hits.Count
        $hits | Select-Object -First 40 | ForEach-Object Line | Out-File out\events.txt
        $ev | Select-String 'GUARD totals|GB50|STOP_EVENT' | ForEach-Object Line | Out-File -Append out\events.txt
        Get-Content out\events.txt
    - name: Upload evidence
      uses: actions/upload-artifact@v4
      with:
        name: olm-html-guard
        path: out
        if-no-files-found: warn
