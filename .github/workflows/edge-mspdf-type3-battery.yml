name: edge-mspdf-type3-battery
'on':
  workflow_dispatch: {}
jobs:
  t:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
    - name: install-current-stable-edge
      shell: pwsh
      run: |
        $j = (Invoke-WebRequest -Uri 'https://edgeupdates.microsoft.com/api/products' -UseBasicParsing -TimeoutSec 60).Content | ConvertFrom-Json
        $rel = $null
        foreach ($p in $j) {
          if ($p.Product -ne 'Stable') { continue }
          foreach ($r in $p.Releases) {
            if ($r.Platform -eq 'Windows' -and $r.Architecture -eq 'x64') {
              if (-not $rel -or [Version]$r.ProductVersion -gt [Version]$rel.ProductVersion) { $rel = $r }
            }
            if ($r.Platform -eq 'Windows x64') {
              if (-not $rel -or [Version]$r.ProductVersion -gt [Version]$rel.ProductVersion) { $rel = $r }
            }
          }
        }
        if (-not $rel) { Write-Host 'no stable x64 release in api'; exit 0 }
        $art = $rel.Artifacts | Where-Object { $_.ArtifactName -eq 'msi' } | Select-Object -First 1
        Write-Host ('target_version=' + $rel.ProductVersion + ' platform=' + $rel.Platform + ' arch=' + $rel.Architecture)
        Invoke-WebRequest -Uri $art.Location -OutFile edge.msi -UseBasicParsing -TimeoutSec 900
        $h = (Get-FileHash edge.msi -Algorithm SHA256).Hash
        Write-Host ('downloaded_sha256=' + $h + ' match=' + ($h -eq $art.Hash))
        Write-Host ('installed_before=' + (Get-Item 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe' -EA SilentlyContinue).VersionInfo.FileVersion)
        $p = Start-Process msiexec.exe -ArgumentList '/i','edge.msi','/quiet','/norestart' -Wait -PassThru
        Write-Host ('msiexec_exit=' + $p.ExitCode)
        Write-Host ('installed_after=' + (Get-Item 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe' -EA SilentlyContinue).VersionInfo.FileVersion)
      continue-on-error: true

    - name: stage-and-run
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path C:\edgebat | Out-Null
        $b64 = @'
__LINES__
        '@
        $clean = ($b64 -split "\s+" | Where-Object { $_ -ne '' }) -join ''
        [IO.File]::WriteAllBytes('C:\edgebat\p.gz', [Convert]::FromBase64String($clean))
        tar -xzf C:\edgebat\p.gz -C C:\edgebat
        Get-ChildItem C:\edgebat | ForEach-Object { '{0} {1}' -f $_.Name, $_.Length }
        $tok=$null; $err=$null
        [void][System.Management.Automation.Language.Parser]::ParseFile('C:\edgebat\run3.ps1',[ref]$tok,[ref]$err)
        Write-Host ('ps_parse_errors=' + $err.Count)
        foreach ($e in $err) { Write-Host ('  PSERR line ' + $e.Extent.StartLineNumber + ': ' + $e.Message) }
        if ($err.Count -gt 0) { exit 2 }
        pwsh -NoProfile -ExecutionPolicy Bypass -File C:\edgebat\run3.ps1
    - name: upload
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: edgebat-pdf
        path: C:\edgebat\out
        if-no-files-found: warn
