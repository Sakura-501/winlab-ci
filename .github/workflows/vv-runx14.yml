name: vviewer-fmt4-runx14
on:
  push:
    paths:
      - '.github/workflows/vv-runx14.yml'
  workflow_dispatch:
jobs:
  t:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
    - name: Download ODT
      shell: pwsh
      run: |
        $page = (Invoke-WebRequest -Uri "https://www.microsoft.com/en-us/download/details.aspx?id=49117" -UseBasicParsing).Content
        if ($page -match 'href="(https://download\.microsoft\.com/download/[^"]+officedeploymenttool[^"]*\.exe)"') { Invoke-WebRequest -Uri $Matches[1] -OutFile odt.exe } else { throw "odt" }
        Start-Process -Wait -FilePath .\odt.exe -ArgumentList "/extract:odtx /quiet"
    - name: Install Office
      shell: pwsh
      run: |
        $xml = '<Configuration><Add OfficeClientEdition="64" Channel="CurrentPreview"><Product ID="O365ProPlusRetail"><Language ID="en-us" /><ExcludeApp ID="Excel" /><ExcludeApp ID="PowerPoint" /><ExcludeApp ID="Outlook" /><ExcludeApp ID="OneDrive" /><ExcludeApp ID="OneNote" /><ExcludeApp ID="Lync" /><ExcludeApp ID="Bing" /></Product></Add><Display Level="None" AcceptEULA="TRUE" /><Updates Enabled="FALSE" /></Configuration>'
        Set-Content -Path cfg.xml -Value $xml
        $p = Start-Process -FilePath .\odtx\setup.exe -ArgumentList "/configure","cfg.xml" -PassThru -Wait
        "exit=$($p.ExitCode)"
        $vv = Get-Item "C:\Program Files\Microsoft Office\root\Office16\VVIEWER.DLL" -ErrorAction SilentlyContinue
        if (-not $vv) { throw "no VVIEWER" }
        "VVIEWER v$($vv.VersionInfo.FileVersion)"
    - name: Install debugger
      shell: pwsh
      run: |
        winget install Microsoft.WinDbg --accept-source-agreements --accept-package-agreements --silent --disable-interactivity
        Get-ChildItem "C:\Program Files\WindowsApps\Microsoft.WinDbg*" -Directory | Select-Object -First 3 | ForEach-Object { $_.FullName }
    - uses: actions/checkout@v4
    - name: Run experiment
      shell: pwsh
      run: |
        $py = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
        $py | Set-Content vvrun.ps1 -Encoding UTF8
        powershell -NoProfile -ExecutionPolicy Bypass -File .\vvrun.ps1
    - name: Dump
      if: always()
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path outart | Out-Null
        Copy-Item log.txt, cdb_*.log, v12_*.png, r_*.txt, bp_cmds.txt, page_*.html -Destination outart -ErrorAction SilentlyContinue
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: vvx-logs
        path: outart
