name: mso-css-word-pageheap-x64
# The div/span + CSS record corpus that the in-process and cdb arms measure, opened instead by Word
# in a full-page-heap runner with WER local dumps. No debugger is in the loop: the earlier cdb arm
# on the VM set its anchors (loaded=True bpset=True) and Word still exited within ~20 s with every
# counter at 0, so that channel could not answer "does the product path run". A fault under page
# heap lands in C:\dumps with the carrier open, which is the same evidence shape the Excel sweep
# already uses.
#
# Carriers are written with Zone.Identifier (ZoneId=3) before Word opens them, nothing is clicked:
# Word parses the document while it sits in Protected View, so a dump from this loop needs no
# dialog dismissal to mean anything.
'on':
  workflow_dispatch:
    inputs:
      cap:
        description: 'max carriers'
        required: false
        default: '70'
jobs:
  t:
    runs-on: windows-latest
    timeout-minutes: 230
    steps:
    - uses: actions/checkout@v4

    - name: Download ODT
      shell: pwsh
      run: |
        $page = (Invoke-WebRequest -Uri "https://www.microsoft.com/en-us/download/details.aspx?id=49117" -UseBasicParsing).Content
        if ($page -match 'href="(https://download\.microsoft\.com/download/[^"]+officedeploymenttool[^"]*\.exe)"') {
          Invoke-WebRequest -Uri $Matches[1] -OutFile odt.exe
        } else { throw "odt link not found" }
        Start-Process -Wait -FilePath .\odt.exe -ArgumentList "/extract:odtx /quiet"

    - name: Install x64 Office (Word needed)
      shell: pwsh
      run: |
        $xml = '<Configuration><Add OfficeClientEdition="64" Channel="CurrentChannel"><Product ID="O365ProPlusRetail"><Language ID="en-us" /><ExcludeApp ID="OneDrive" /><ExcludeApp ID="Lync" /><ExcludeApp ID="Bing" /></Product></Add><Display Level="None" AcceptEULA="TRUE" /><Updates Enabled="FALSE" /></Configuration>'
        Set-Content -Path cfg.xml -Value $xml
        Start-Process -Wait -FilePath .\odtx\setup.exe -ArgumentList "/configure","cfg.xml"
        $w = Get-Item "C:\Program Files\Microsoft Office\root\Office16\WINWORD.EXE" -EA SilentlyContinue
        if (-not $w) { throw "word install failed" }
        "word: $($w.Length) bytes v=$($w.VersionInfo.FileVersion)"
        $m = Get-Item "C:\Program Files\Common Files\Microsoft Shared\OFFICE16\mso.dll" -EA SilentlyContinue
        if (-not $m) { $m = Get-ChildItem "C:\Program Files\Microsoft Office\root" -Recurse -Filter mso.dll -EA SilentlyContinue | Sort-Object Length -Descending | Select-Object -First 1 }
        "mso: v=$($m.VersionInfo.FileVersion) size=$($m.Length) path=$($m.FullName)"
        $m.VersionInfo.FileVersion | Out-File ver.txt

    - name: Page heap for WINWORD plus WER full dumps
      shell: pwsh
      run: |
        $log = "out\setup_log.txt"
        New-Item -ItemType Directory -Force -Path out, C:\dumps, tools | Out-Null
        $gfs = @(Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Debuggers" -Recurse -Include gflags.exe -EA SilentlyContinue)
        $gf = @($gfs | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1)
        if (-not $gf) { $gf = @($gfs | Select-Object -First 1) }
        if ($gf) {
          try { & $gf.FullName /p /enable WINWORD.EXE /full | Out-Null; "gflags_path=$($gf.FullName)" | Add-Content $log }
          catch { "gflags_unusable=$($gf.FullName) -> registry page heap only" | Add-Content $log }
        }
        $k = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\WINWORD.EXE"
        New-Item -Path $k -Force | Out-Null
        Set-ItemProperty -Path $k -Name GlobalFlag -Value 0x02000000 -Type DWord
        Set-ItemProperty -Path $k -Name EnableVerifier -Value 1 -Type DWord
        Set-ItemProperty -Path $k -Name VerifierFlags -Value 0 -Type DWord
        Set-ItemProperty -Path $k -Name PageHeapFlags -Value 0x3 -Type DWord
        $ld = "HKLM:\SOFTWARE\Microsoft\Windows Error Reporting\LocalDumps"
        New-Item -Path $ld -Force | Out-Null
        Set-ItemProperty -Path $ld -Name DumpFolder -Value "C:\dumps" -Type ExpandString
        Set-ItemProperty -Path $ld -Name DumpType -Value 2 -Type DWord
        Set-ItemProperty -Path $ld -Name DumpCount -Value 40 -Type DWord
        "pageheap GlobalFlag=$((Get-ItemProperty $k).GlobalFlag) verifier=$((Get-ItemProperty $k).EnableVerifier)" | Tee-Object -FilePath $log -Append

    - name: Emit the div/span + CSS carriers
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path corpus | Out-Null
        python ppseed\mso_divneg_corpus.py corpus\all.htm corpus
        $n = @(Get-ChildItem corpus -Filter *.htm -File).Count
        "htm_carriers=$n"
        if ($n -lt 200) { throw "div/span carrier generation failed ($n)" }

    - name: Positive control - page heap must be loaded in WINWORD
      shell: pwsh
      run: |
        $exe = "C:\Program Files\Microsoft Office\root\Office16\WINWORD.EXE"
        Set-Content -Path corpus\ctrl_plain.htm -Value "<html><body><p>hello</p></body></html>" -Encoding ASCII
        $k2 = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\WINWORD.EXE"
        $p = Start-Process -FilePath $exe -ArgumentList '"corpus\ctrl_plain.htm"' -PassThru
        $ver = 0
        for ($i = 0; $i -lt 30; $i++) {
          Start-Sleep -Seconds 2
          try {
            $mods = @($p.Modules | ForEach-Object { $_.ModuleName.ToLower() })
            if ($mods -contains 'verifier.dll') { $ver = 1; break }
          } catch { }
          if ($p.HasExited) { break }
        }
        "CONTROL verifier_loaded=$ver title=$($p.MainWindowTitle)" | Tee-Object -FilePath out\control.txt
        Get-Process WINWORD -EA SilentlyContinue | Stop-Process -Force
        $mods2 = ''
        try { $mods2 = @(Get-Process WINWORD -EA SilentlyContinue | Select-Object -First 1).Modules.Count } catch { $mods2 = 'enum_threw' }
        $k2v = Get-ItemProperty $k2
        "CONTROL readback GlobalFlag=$($k2v.GlobalFlag) PageHeapFlags=$($k2v.PageHeapFlags) EnableVerifier=$($k2v.EnableVerifier) modules_seen=$mods2 exited=$($p.HasExited)" | Add-Content out\control.txt
        if ($ver -ne 1 -and $k2v.EnableVerifier -ne 1) { throw "page heap neither loaded into WINWORD nor present in IFEO (verifier.dll absent, EnableVerifier=$($k2v.EnableVerifier)): every dump=0 row below would be an instrument failure" }

    - name: Open every carrier, watch for faults
      shell: pwsh
      run: |
        $exe = "C:\Program Files\Microsoft Office\root\Office16\WINWORD.EXE"
        $log = "out\sweep_log.txt"
        $cap = [int]('${{ github.event.inputs.cap }}')
        if ($cap -le 0) { $cap = 70 }
        function DumpList { @(Get-ChildItem C:\dumps -EA SilentlyContinue | ForEach-Object { $_.Name }) }
        $files = @(Get-ChildItem corpus -Filter *.htm | Where-Object { $_.Name -notlike 'ctrl_*' } | Sort-Object Name | Select-Object -First $cap)
        "cases=$($files.Count)" | Tee-Object -FilePath $log
        if ($files.Count -lt 40) { throw "corpus not materialized in corpus\ (cases=$($files.Count))" }
        $bad = @()
        $unopened = @()
        foreach ($f in $files) {
          $before = DumpList
          Set-Content -Path ($f.FullName + ':Zone.Identifier') -Value "[ZoneTransfer]`r`nZoneId=3" -Encoding ASCII
          $t0 = Get-Date
          $p = Start-Process -FilePath $exe -ArgumentList ('"' + $f.FullName + '"') -PassThru
          $alive = 1; $opened = 0; $ver = 0; $exit = ''; $title = ''; $shot = 0; $pv = ''
          for ($i = 0; $i -lt 25; $i++) {
            Start-Sleep -Seconds 2
            try { if ($p.HasExited) { $alive = 0; $exit = '0x' + ('{0:X8}' -f $p.ExitCode); break } } catch { $alive = 0; break }
            try { if (@($p.Modules | Where-Object { $_.ModuleName -ieq 'verifier.dll' }).Count) { $ver = 1 } } catch { }
            $tt = @(Get-Process WINWORD -EA SilentlyContinue | ForEach-Object { $_.MainWindowTitle } | Where-Object { $_ })
            $title = ($tt | Where-Object { $_ -like ('*' + $f.BaseName + '*') }) | Select-Object -First 1
            if ($title) {
              $opened = 1
              if (-not $shot) {
                $shot = 1
                try { Add-Type -AssemblyName System.Windows.Forms,System.Drawing; $b = [System.Windows.Forms.SystemInformation]::VirtualScreen; $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height; $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.X, $b.Y, 0, 0, $bmp.Size); New-Item -ItemType Directory -Force -Path out\shots | Out-Null; $bmp.Save(('out\shots\' + $f.BaseName + '.png')); $g.Dispose(); $bmp.Dispose() } catch { "shot_failed " + $_.Exception.Message | Add-Content out\sweep_extra.txt }
              }
            }
            if ((DumpList).Count -gt $before.Count) { break }
          }
          $after = DumpList
          $new = @($after | Where-Object { $before -notcontains $_ })
          $line = '{0,-40} alive={1} opened={2} verifier={3} dumps={4} exit={5} s={6} title={7}' -f $f.Name, $alive, $opened, $ver, $new.Count, $exit, [int]((Get-Date) - $t0).TotalSeconds, $title
          $line | Tee-Object -FilePath $log -Append
          if (-not $opened) { $unopened += $f.Name }
          if ($new.Count -or ($alive -eq 0 -and $opened -eq 0)) {
            $bad += $f.Name
            New-Item -ItemType Directory -Force -Path out\bad | Out-Null
            Copy-Item $f.FullName ('out\bad\CRASH_' + $f.Name) -Force -EA SilentlyContinue
            foreach ($d in $new) { Copy-Item ('C:\dumps\' + $d) ('out\bad\' + $d) -Force -EA SilentlyContinue }
          }
          Get-Process WINWORD -EA SilentlyContinue | Stop-Process -Force -EA SilentlyContinue
          Remove-Item 'HKCU:\SOFTWARE\Microsoft\Office\16.0\word\Resiliency' -Recurse -Force -EA SilentlyContinue
          for ($i = 0; $i -lt 40; $i++) { if (-not (Get-Process WINWORD -EA SilentlyContinue)) { break }; Start-Sleep -Milliseconds 500 }
        }
        "SUMMARY cases=$($files.Count) flagged=$($bad.Count) [$($bad -join ' ')]" | Tee-Object -FilePath $log -Append
        "unopened=$($unopened.Count) [$($unopened -join ' ')]" | Tee-Object -FilePath $log -Append
        if ($unopened.Count * 20 -gt $files.Count) { throw "$($unopened.Count)/$($files.Count) carriers never opened: the sweep would read as clean without covering them (first: $($unopened[0]))" }
        "dumps_total=$((DumpList).Count)" | Tee-Object -FilePath $log -Append
        $bad -join "`r`n" | Out-File out\bad.txt
        if ($bad.Count) { throw "flagged carriers: $($bad -join ', ')" }

    - name: Upload evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mso-css-word-pageheap
        path: |
          out
          ver.txt
          corpus
