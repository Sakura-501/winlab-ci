        '@
        $clean = ($b64 -split "\s+" | Where-Object { $_ -ne '' }) -join ''
        [IO.File]::WriteAllBytes('C:\edgebat\p.gz', [Convert]::FromBase64String($clean))
        tar -xzf C:\edgebat\p.gz -C C:\edgebat
        Get-ChildItem C:\edgebat | ForEach-Object { '{0} {1}' -f $_.Name, $_.Length }
        python -c "import ast,glob;[ast.parse(open(f,encoding='utf-8').read()) for f in glob.glob(r'C:\edgebat\\*.py')];print('py_parse_ok')"
        $tok=$null; $err=$null
        [void][System.Management.Automation.Language.Parser]::ParseFile('C:\edgebat\run11.ps1',[ref]$tok,[ref]$err)
        Write-Host ('ps_parse_errors=' + $err.Count)
        foreach ($e in $err) { Write-Host ('  PSERR line ' + $e.Extent.StartLineNumber + ': ' + $e.Message) }
        if ($err.Count -gt 0) { exit 2 }
        pwsh -NoProfile -ExecutionPolicy Bypass -File C:\edgebat\run11.ps1
    - name: upload
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: edgebat-wp2
        path: C:\edgebat\out
        if-no-files-found: warn
