name: mso-html-flags-pageheap-x64

# Full-page-heap sweep of mso.dll's HTML/CSS/XML importer on native x64.
#
# mso's importer is the engine OUTLMIME drives for every inbound HTML body (HrGetWebRefDataFromStream
# -> MsoHrSetupHTMLImport -> FDoImport); its buffers come out of mso's own heaps, which the
# OLMAPI32 allocator slots do not cover, so the guard here is the process-wide one: IFEO
# GlobalFlag=0x02000000 turns every heap the process creates (including private ones) into a
# verifiable heap with a guard page behind each block.
#
# The driver is the same harness that armed OLMAPI32's slots; in msohtml mode it builds the HICD
# exactly as OUTLMIME's caller does and calls the importer slot that consumes the stream, which
# the harness discovers per build by ranking bytes-read (IMPORT_SLOT).  A stage is only counted as
# covered when the importer's own callbacks move: handle=/commit=/inswide= are the per-tag counts
# the shipping binary reports through IMsoHTMLImportUser (slot order read out of the shipping
# vtable ??_7CHtmlSegmentImportUser@@6BIMsoHTMLImportUser@@@ in OUTLMIME 20326.20144).

on:
  workflow_dispatch:
    inputs:
      dense_per_stage:
        description: 'dense-corpus records per dense stage (0 = skip dense stages)'
        default: '4600'

jobs:
  guard:
    runs-on: windows-latest
    steps:
    - name: Download ODT
      shell: pwsh
      run: |
        $urls = @()
        for ($t = 0; $t -lt 4 -and $urls.Count -eq 0; $t++) {
          try {
            $page = (Invoke-WebRequest -Uri "https://www.microsoft.com/en-us/download/details.aspx?id=49117" -UseBasicParsing -TimeoutSec 90).Content
            foreach ($m in [regex]::Matches($page, 'https://download[.]microsoft[.]com/download/[^ <>"]+officedeploymenttool[^ <>"]+[.]exe')) { $urls += $m.Value }
          } catch { "fetch attempt $t failed: $($_.Exception.Message)" }
          if ($urls.Count -eq 0) { Start-Sleep -Seconds (5 * ($t + 1)) }
        }
        if ($urls.Count -eq 0) { throw "odt link not found after retries" }
        $got = $false
        foreach ($u in $urls) {
          for ($t = 0; $t -lt 3 -and -not $got; $t++) {
            try { Invoke-WebRequest -Uri $u -OutFile odt.exe -UseBasicParsing -TimeoutSec 300; if ((Get-Item odt.exe).Length -gt 1MB) { $got = $true } }
            catch { "dl attempt $t failed: $($_.Exception.Message)"; Start-Sleep -Seconds (5 * ($t + 1)) }
          }
          if ($got) { break }
        }
        if (-not $got) { throw "odt.exe download failed" }
        Remove-Item odtx -Recurse -Force -EA SilentlyContinue
        $x = $false
        for ($t = 0; $t -lt 3 -and -not $x; $t++) {
          Start-Process -Wait -FilePath .\odt.exe -ArgumentList "/extract:`"$PWD\odtx`" /quiet"
          $x = Test-Path odtx\setup.exe
          if (-not $x) { "extract attempt $t produced no setup.exe"; Start-Sleep -Seconds (5 * ($t + 1)) }
        }
        if (-not $x) { throw "odt extract failed" }

    - name: Install Current x64 (Outlook kept, rest excluded)
      shell: pwsh
      run: |
        $xml = '<Configuration><Add OfficeClientEdition="64" Channel="Current"><Product ID="O365ProPlusRetail"><Language ID="en-us" /><ExcludeApp ID="Excel" /><ExcludeApp ID="PowerPoint" /><ExcludeApp ID="OneDrive" /><ExcludeApp ID="OneNote" /><ExcludeApp ID="Lync" /><ExcludeApp ID="Access" /><ExcludeApp ID="Groove" /><ExcludeApp ID="Publisher" /><ExcludeApp ID="Teams" /><ExcludeApp ID="Bing" /><ExcludeApp ID="Word" /></Product></Add><Display Level="None" AcceptEULA="TRUE" /><Updates Enabled="FALSE" /></Configuration>'
        Set-Content -Path cfg.xml -Value $xml
        Start-Process -Wait -FilePath .\odtx\setup.exe -ArgumentList "/configure","cfg.xml"
        if (-not (Test-Path "C:\Program Files\Microsoft Office\root\Office16\OUTLOOK.EXE")) { throw "outlook install failed" }
        $olm = Get-Item "C:\Program Files\Microsoft Office\root\Office16\OLMAPI32.DLL"
        "olmapi32 len=$($olm.Length) v=$($olm.VersionInfo.FileVersion)" | Tee-Object ver.txt
        $ol = Get-Item "C:\Program Files\Microsoft Office\root\Office16\OUTLMIME.DLL"
        "outlmime len=$($ol.Length) v=$($ol.VersionInfo.FileVersion)" | Tee-Object -Append ver.txt

    - name: Materialize harness and corpus generator
      run: |
        New-Item -ItemType Directory -Force -Path bin, build, corpus, out, tools | Out-Null
        Set-Content -Path gb.b64 -Value ''
        Set-Content -Path gen.b64 -Value ''
        python -c "import base64;open('bin/guardbench.c','wb').write(base64.b64decode(open('gb.b64').read()))"
        python -c "import base64;open('tools/mk_html_corpus.py','wb').write(base64.b64decode(open('gen.b64').read()))"
        Get-Item bin\guardbench.c, tools\mk_html_corpus.py | Select-Object Name, Length | Format-Table | Out-String
    - name: Build harness (x64)
      run: |
        $vc = (Get-ChildItem 'C:\Program Files\Microsoft Visual Studio' -Recurse -Filter 'VsDevCmd.bat' -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
        $cmd = '"' + $vc + '" -arch=x64 && cl /nologo /O2 /W3 /std:c17 /Tc bin\guardbench.c /Fe:bin\gbx.exe /Fo:build\ /link ole32.lib oleaut32.lib advapi32.lib user32.lib'
        cmd /c $cmd
        if (-not (Test-Path bin\gbx.exe)) { throw 'harness build failed' }

    - name: Full page heap for the harness plus WER local dumps
      run: |
        $ifeo = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\gbx.exe'
        New-Item -Path $ifeo -Force | Out-Null
        New-ItemProperty -Path $ifeo -Name GlobalFlag -PropertyType DWord -Value 0x02000000 -Force | Out-Null
        New-ItemProperty -Path $ifeo -Name PageHeapFlags -PropertyType DWord -Value 3 -Force | Out-Null
        $wer = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\gbx.exe'
        New-Item -Path $wer -Force | Out-Null
        New-ItemProperty -Path $wer -Name DumpFolder -PropertyType ExpandString -Value 'C:\actions\_w\dumps' -Force | Out-Null
        New-ItemProperty -Path $wer -Name DumpType -PropertyType DWord -Value 2 -Force | Out-Null
        New-ItemProperty -Path $wer -Name DumpCount -PropertyType DWord -Value 24 -Force | Out-Null
        New-Item -ItemType Directory -Force -Path C:\actions\_w\dumps | Out-Null
        # The importer resolves web references inside the call; a dead local proxy makes those
        # attempts fail in milliseconds instead of stalling a stage on DNS/connect timeouts.
        $isie = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings'
        New-ItemProperty -Path $isie -Name ProxyEnable -PropertyType DWord -Value 1 -Force | Out-Null
        New-ItemProperty -Path $isie -Name ProxyServer -PropertyType String -Value 'http=127.0.0.1:9;https=127.0.0.1:9;ftp=127.0.0.1:9' -Force | Out-Null
        'page heap + local dumps + dead proxy armed'

    - name: Build the corpus
      run: |
        python tools\mk_html_corpus.py corpus
        "base_html=" + (Get-Item corpus\html.txt).Length
        python tools\mk_html_corpus.py corpus dense
        "dense_html=" + (Get-Item corpus\html.txt).Length
        if ((Get-Item corpus\html.txt).Length -lt 1000000) { throw 'corpus not materialized' }
        "mime25=" + (Get-Item corpus\mime25.txt).Length
        if ((Get-Item corpus\mime25.txt).Length -lt 100000) { throw 'MIME tail family not materialized' }

    - name: Gate - page heap must be loaded and the importer must parse
      run: |
        $env:PATH = 'C:\Program Files\Microsoft Office\root\Office16;' + $env:PATH
        $o = & .\bin\gbx.exe msohtml corpus\mime25.txt 3 0 none norel noskip slot=17 2>&1 | Out-String
        $code = $LASTEXITCODE
        $o | Out-File out\gate.txt
        "---- gate raw (exit=$code) ----"
        $o
        "---- end gate raw ----"
        ($o -split "`n" | Where-Object { $_ -match 'ARM |IMPORT_SLOT|MSOHTML|TAGS|callbacks|rec=' }) -join "`n" | Tee-Object out\gate_sum.txt
        $armed = ($o -match 'ARM verifier_dll=0*[1-9a-f][0-9a-f]*') -or ($o -match 'pageheap_bit=0x200')
        if (-not $armed) { throw 'page heap is not loaded in the harness: aborting' }
                if ($o -notmatch 'handle=([1-9][0-9]*)') { throw 'importer reported no tags: instrument blind' }
        if ($o -notmatch 'rd\+([1-9][0-9]*)') { throw 'importer read no stream bytes' }
        'gate: ARMED and parsing'
        exit 0

    - name: Flag ladder over the base corpus (HICD+0x60)
      timeout-minutes: 150
      run: |
        $env:PATH = 'C:\Program Files\Microsoft Office\root\Office16;' + $env:PATH
        # MsoHrSetupHTMLImport reads [hicd+0x60] twelve times (bit tests & 0x804, & 0x1000000,
        # <<1 & 8, >>4), so this dword selects import modes.  Outlook's caller writes 0x020001D1;
        # walking every single bit plus the corner values drives the same corpus through the other
        # modes of the same shipping code with the same armed memory.
        $vals = @()
        for ($b = 0; $b -lt 32; $b++) { $vals += ("0x{0:X}" -f (1 -shl $b)) }
        $vals += @("0x0","0x804","0x1000004","0x20001D1","0x3FFFFFFF","0xFFFFFFFF","0x10000","0x20000000","0x8","0x10")
        $tbl = @()
        $sumcb = 0
        $blind = 0
        foreach ($v in $vals) {
          $env:GBFLAGS = $v
          $o = & .\bin\gbx.exe msohtml corpus\html.txt 946 0 none norel noskip slot=17 2>&1 | Out-String
          $code = $LASTEXITCODE
          $t = ($o -split "`n" | Where-Object { $_ -match 'MSOHTML totals' }) -join ''
          $c = ($o -split "`n" | Where-Object { $_ -match 'MSOHTML callbacks' }) -join ''
          $f = ($o -split "`n" | Where-Object { $_ -match 'MSOHTML faults' }) -join ''
          $av = ([regex]::Matches($o, '\[g\] AV-')).Count
          $line = ("{0,-12} exit={1} {2} {3} {4} av_in_log={5}" -f $v, $code, $t.Trim(), $c.Trim(), $f.Trim(), $av)
          $tbl += $line
          $line | Out-File -Append -Encoding utf8 out\flags_raw.txt
          if ($o -notmatch 'recs=946') { $blind++ }
          $m = [regex]::Match($c, 'handle=(\d+)')
          if ($m.Success) { $sumcb += [int]$m.Groups[1].Value }
          "progress: $line"
        }
        $tbl | Out-File -Encoding utf8 out\flags_table.txt
        "flag_values=$($vals.Count) total_handle_callbacks=$sumcb flags_with_partial_coverage=$blind"
        if ($sumcb -lt 1000) { throw "the flag ladder produced almost no callbacks: instrument blind" }
        if ($blind -gt 0) { throw "$blind flag values did not cover all 946 records" }
        exit 0

    - name: Flag ladder over the MIME tail
      timeout-minutes: 60
      run: |
        $env:PATH = 'C:\Program Files\Microsoft Office\root\Office16;' + $env:PATH
        $vals = @("0x0","0x1","0x4","0x100","0x1000000","0x2000000","0x20001D1","0x804","0x8","0xFFFFFFFF")
        $sumcb = 0
        foreach ($v in $vals) {
          $env:GBFLAGS = $v
          $o = & .\bin\gbx.exe msohtml corpus\mime25.txt 300 0 none norel noskip slot=17 2>&1 | Out-String
          $c = ($o -split "`n" | Where-Object { $_ -match 'MSOHTML callbacks|MSOHTML totals|MSOHTML faults' }) -join ' | '
          ("{0,-12} {1}" -f $v, $c.Trim()) | Out-File -Append -Encoding utf8 out\flags_mime.txt
          $m = [regex]::Match($c, 'handle=(\d+)')
          if ($m.Success) { $sumcb += [int]$m.Groups[1].Value }
          "progress[$v] $c"
        }
        "mime_ladder_callbacks=$sumcb"
        if ($sumcb -lt 100) { throw 'MIME flag ladder reported no callbacks' }
        exit 0

    - name: Collect faults and dumps

      run: |
        $st = Get-ChildItem out\stage*.txt, out\gate.txt -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -ErrorAction SilentlyContinue }
        $av = @($st | Select-String '\[g\] AV-')
        "av_lines=" + $av.Count
        $av | Select-Object -First 60 | ForEach-Object Line | Out-File out\faults.txt
        $st | Select-String 'MSOHTML totals|MSOHTML callbacks|MSOHTML slots|IMPORT_SLOT|STOP_EVENT' | ForEach-Object Line | Out-File -Append out\faults.txt
        $st += Get-ChildItem out\flags_raw.txt, out\flags_table.txt, out\flags_mime.txt -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -ErrorAction SilentlyContinue }
        Copy-Item C:\actions\_w\dumps\* out\dumps\ -Force -ErrorAction SilentlyContinue
        "dumps=" + (Get-ChildItem out\dumps -ErrorAction SilentlyContinue).Count
        Get-Content out\faults.txt

    - name: Upload evidence
      uses: actions/upload-artifact@v4
      with:
        name: mso-html-flags-pageheap
        path: out
        if-no-files-found: warn
