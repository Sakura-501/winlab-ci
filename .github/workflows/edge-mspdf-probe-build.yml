        $clean = ($b64 -split "\s+" | Where-Object { $_ -ne '' }) -join ''
        [IO.File]::WriteAllBytes('C:\mspdfprobe\p.gz', [Convert]::FromBase64String($clean))
        tar -xzf C:\mspdfprobe\p.gz -C C:\mspdfprobe
        $dll = Get-ChildItem 'C:\Program Files (x86)\Microsoft\Edge\Application' -Recurse -Filter mspdf.dll -EA SilentlyContinue | Select-Object -First 1
        Write-Host ('mspdf=' + $dll.FullName + ' size=' + $dll.Length + ' v=' + $dll.VersionInfo.FileVersion)
        Copy-Item $dll.FullName C:\mspdfprobe\mspdf.dll -Force
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
        Write-Host ('vs=' + $vs)
        $vc = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
        Write-Host ('vcvars=' + $vc + ' exists=' + (Test-Path $vc))
        Push-Location C:\mspdfprobe
        cmd /c "`"$vc`" && cl /EHsc /W3 /Fe:mspdf_probe.exe mspdf_probe.cpp"
        Write-Host ('build_exit=' + $LASTEXITCODE)
        Write-Host ('exe_present=' + (Test-Path C:\mspdfprobe\mspdf_probe.exe))
        .\mspdf_probe.exe C:\mspdfprobe\mspdf.dll 0
        Write-Host ('mode0_exit=' + $LASTEXITCODE)
        .\mspdf_probe.exe C:\mspdfprobe\mspdf.dll 1
        Write-Host ('mode1_exit=' + $LASTEXITCODE)
        Pop-Location
        Get-Content C:\mspdfprobe\mspdf.dll.probe.log | Select-Object -First 200
        Copy-Item C:\mspdfprobe\*.log C:\mspdfprobe\out_dir -Force -EA SilentlyContinue
