name: rtf2-delprop-probe
'on': {workflow_dispatch: null}
jobs:
  t:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
    - name: Download ODT
      shell: pwsh
      run: "$page = (Invoke-WebRequest -Uri \"https://www.microsoft.com/en-us/download/details.aspx?id=49117\" -UseBasicParsing).Content\nif ($page -match 'href=\\\"(https://download\\.microsoft\\.com/download/[^\\\"]+officedeploymenttool[^\\\"]*\\.exe)\\\"') {\n  Invoke-WebRequest -Uri $Matches[1] -OutFile odt.exe\n} else { throw \"odt link not found\" }\nStart-Process -Wait -FilePath .\\odt.exe -ArgumentList \"/extract:odtx /quiet\""
    - name: Install CurrentPreview x64 Word
      shell: pwsh
      run: '$xml = ''<Configuration><Add OfficeClientEdition="64" Channel="CurrentChannelPreview"><Product ID="O365ProPlusRetail"><Language ID="en-us" /><ExcludeApp ID="Excel" /><ExcludeApp ID="PowerPoint" /><ExcludeApp ID="Outlook" /><ExcludeApp ID="OneDrive" /><ExcludeApp ID="OneNote" /><ExcludeApp ID="Lync" /><ExcludeApp ID="Bing" /></Product></Add><Display Level="None" AcceptEULA="TRUE" /><Updates Enabled="FALSE" /></Configuration>''

        Set-Content -Path cfg.xml -Value $xml

        Start-Process -Wait -FilePath .\odtx\setup.exe -ArgumentList "/configure","cfg.xml"

        $w = Get-Item "C:\Program Files\Microsoft Office\root\Office16\wwlib.dll" -ErrorAction SilentlyContinue

        if (-not $w) { throw "install failed" }

        "wwlib: {0} bytes v{1}" -f $w.Length, $w.VersionInfo.FileVersion

        $w.VersionInfo.FileVersion | Out-File ver.txt'
    - name: Write probe documents
      shell: pwsh
      run: '[IO.File]::WriteAllBytes("$PWD\rtf_benign.rtf", [Convert]::FromBase64String("e1xydGYxXGFuc2lcYW5zaWNwZzEyNTJcZGVmZjBcbm91aWNvbXBhdFxkZWZsYW5nMTAzM3tcZm9udHRibHtcZjBcZm5pbFxmY2hhcnNldDAgQ2FsaWJyaTt9fXtcKlxnZW5lcmF0b3IgUmljaGVkMjBfMTZfMF8yMDMyNjt9XHZpZXdraW5kNFx1YzEgXGYwXGZzMjAgcGxhaW4gcGFyYWdyYXBoIHRleHRccGFyCn0K"))

        [IO.File]::WriteAllBytes("$PWD\rtf_tx_many.rtf", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\base_clean.doc", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\tx_style_direct.rtf", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\tx_pard_reset.rtf", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\tx_300_style_300.rtf", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\tx_253_boundary.rtf", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\tx_254_boundary.rtf", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\tx_255_boundary.rtf", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\tx_256_boundary.rtf", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\tx_neg_direct.rtf", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\tx_dup_exact.rtf", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\tx_list_pnlvl.rtf", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\tx_tbl_row.rtf", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\tx_reset_then_300.rtf", [Convert]::FromBase64String(""))'
    - name: Configure LocalDumps
      shell: pwsh
      run: '$k = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\WINWORD.EXE"

        New-Item -Path $k -Force | Out-Null

        Set-ItemProperty -Path $k -Name DumpFolder -Value "C:\dumps" -Type ExpandString

        Set-ItemProperty -Path $k -Name DumpType -Value 2 -Type DWord'
    - name: Build minidbg16 and resolve DeleteProperty
      shell: pwsh
      run: "[IO.File]::WriteAllBytes(\"$PWD\\minidbg16.cs\", [Convert]::FromBase64String(\"\"\
        ))\n$csc = \"C:\\Windows\\Microsoft.NET\\Framework64\\v4.0.30319\\csc.exe\"\n& $csc /nologo /out:minidbg16.exe minidbg16.cs\nif (-not (Test-Path minidbg16.exe)) { throw 'csc failed' }\n$ww = [IO.File]::ReadAllBytes('C:\\Program Files\\Microsoft Office\\root\\Office16\\wwlib.dll')\n\"wwlib bytes: \" + $ww.Length\nAdd-Type -TypeDefinition @'\nusing System;\npublic static class Scan3 {\n  public static string Find(byte[] d, byte[] sig, int add) {\n    int idx = -1;\n    for (int i = 0; i + sig.Length < d.Length; i++) {\n      bool ok = true;\n      for (int j = 0; j < sig.Length; j++) if (d[i + j] != sig[j]) { ok = false; break; }\n      if (ok) { idx = i; break; }\n    }\n    if (idx < 0) return \"NOTFOUND\";\n    int pe = BitConverter.ToInt32(d, 0x3C);\n    ushort nsec = BitConverter.ToUInt16(d, pe + 6);\n    ushort szopt = BitConverter.ToUInt16(d, pe + 20);\n    int so = pe + 24 + szopt;\n    for (int s2 = 0; s2 < nsec; s2++) {\n      int e = so + 40 * s2;\n      uint vsz = BitConverter.ToUInt32(d, e + 8);\n      uint va = BitConverter.ToUInt32(d, e + 12);\n      uint praw = BitConverter.ToUInt32(d, e + 16);\n      uint poff = BitConverter.ToUInt32(d, e + 20);\n      uint span = Math.Max(vsz, praw);\n      if (idx >= (int)poff && idx < (int)(poff + span))\n        return (va + (uint)(idx - (int)poff) + (uint)add).ToString(\"X\");\n    }\n    return \"SECTMAPFAIL_\" + idx;\n  }\n}\n'@\n$sig = [byte[]](0x40,0x53,0x55,0x56,0x57,0x48,0x83,0xEC,0x28,0x44,0x0F,0xB7,0x0A)\n$rva = [Scan3]::Find($ww, $sig, 129)\nWrite-Host ('DELETEPROPERTY memmove-call RVA hex: ' + $rva)\nSet-Content -Path dp_rva.txt -Value $rva"
    - name: Probe each document
      shell: pwsh
      run: "$word = \"C:\\Program Files\\Microsoft Office\\root\\Office16\\WINWORD.EXE\"\n$rva = (Get-Content dp_rva.txt).Trim()\nif ($rva -notmatch '^[0-9A-Fa-f]+$') { Write-Host ('RESOLVE FAILED: ' + $rva); exit 0 }\nforeach ($n in @('rtf_benign','rtf_tx_many','base_clean','tx_style_direct','tx_pard_reset','tx_300_style_300','tx_253_boundary','tx_254_boundary','tx_255_boundary','tx_256_boundary','tx_neg_direct','tx_dup_exact','tx_list_pnlvl','tx_tbl_row','tx_reset_then_300')) {\n  Write-Host \"===== PROBE $n =====\"\n  Remove-Item -Path 'HKCU:\\Software\\Microsoft\\Office\\16.0\\Word\\Resiliency' -Recurse -ErrorAction SilentlyContinue\n  $f = (Get-ChildItem -Path \".\" -Filter \"$n.*\" | Select-Object -First 1).FullName\n  & .\\minidbg16.exe $word $f -- 50 \"0x148805c=rtf,0x153d2b0=core,0x$($rva)=mm\" 2>&1 | Tee-Object \"probe_$n.txt\" | Select-String -Pattern \"HIT |MM |RET |DST0|SRC0|ITEM |DPE |ccess violation|usage|EXCEPTION\" | ForEach-Object { $_.Line }\n  Get-Process WINWORD -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue\n  Start-Sleep 2\n}\nGet-ChildItem C:\\dumps -ErrorAction SilentlyContinue | ForEach-Object { Write-Host (\"DUMP: \" + $_.Name + \" \" + $_.Length) }"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: rtf2-delprop-probe
        path: 'probe_rtf_benign.txt

          probe_rtf_tx_many.txt

          probe_base_clean.txt

          probe_tx_style_direct.txt

          probe_tx_pard_reset.txt

          probe_tx_300_style_300.txt

          probe_tx_253_boundary.txt

          probe_tx_254_boundary.txt

          probe_tx_255_boundary.txt

          probe_tx_256_boundary.txt

          probe_tx_neg_direct.txt

          probe_tx_dup_exact.txt

          probe_tx_list_pnlvl.txt

          probe_tx_tbl_row.txt

          probe_tx_reset_then_300.txt

          dp_rva.txt

          ver.txt'
        if-no-files-found: ignore
