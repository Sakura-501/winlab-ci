name: dns-matrix
on:
  workflow_dispatch:
jobs:
  sac:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install latest SAC x64 Word (SemiAnnual)
        shell: pwsh
        run: |
          $page = (Invoke-WebRequest -Uri "https://www.microsoft.com/en-us/download/details.aspx?id=49117" -UseBasicParsing).Content
          if ($page -match 'href="(https://download\.microsoft\.com/download/[^"]+officedeploymenttool[^"]*\.exe)"') {
            Invoke-WebRequest -Uri $Matches[1] -OutFile odt.exe
          } else { throw "odt link not found" }
          Start-Process -Wait -FilePath .\odt.exe -ArgumentList "/extract:odtx /quiet"
          $xml = '<Configuration><Add OfficeClientEdition="64" Channel="SemiAnnual"><Product ID="O365ProPlusRetail"><Language ID="en-us" /><ExcludeApp ID="Excel" /><ExcludeApp ID="PowerPoint" /><ExcludeApp ID="Outlook" /><ExcludeApp ID="OneDrive" /><ExcludeApp ID="OneNote" /><ExcludeApp ID="Lync" /><ExcludeApp ID="Bing" /></Product></Add><Display Level="None" AcceptEULA="TRUE" /><Updates Enabled="FALSE" /></Configuration>'
          Set-Content -Path cfg.xml -Value $xml
          Start-Process -Wait -FilePath .\odtx\setup.exe -ArgumentList "/configure","cfg.xml"
          $m = Get-ChildItem "C:\Program Files\Microsoft Office\root\vfs\ProgramFilesCommonX64" -Recurse -Filter mso.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $m) { $m = Get-Item "C:\Program Files\Microsoft Office\root\Office16\mso.dll" -ErrorAction SilentlyContinue }
          if (-not $m) { throw "mso not found" }
          "mso v{0} len={1}" -f $m.VersionInfo.FileVersion, $m.Length | Out-File ver.txt
          Copy-Item $m.FullName sac_mso.dll
      - name: FixParseDnsTargetBufferOverflow tag check
        shell: pwsh
        run: |
          $b = [IO.File]::ReadAllBytes("sac_mso.dll")
          $txt = [Text.Encoding]::ASCII.GetString($b)
          $hit = $txt.Contains("FixParseDnsTargetBufferOverflow")
          $hit2 = $txt.Contains("CLP.CG.FixParseDnsTargetBufferOverflow")
          "FixParseDnsTargetBufferOverflow present=$hit clp_present=$hit2" | Out-File verdict.txt
          if (-not $hit) { "VERDICT: SAC still unfixed -> DNS candidate window OPENS" | Out-File verdict.txt -Append }
          else { "VERDICT: SAC has fix tag -> candidate closed" | Out-File verdict.txt -Append }
          Get-Content verdict.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dns-matrix-result
          path: |
            ver.txt
            verdict.txt
            sac_mso.dll
          if-no-files-found: ignore
