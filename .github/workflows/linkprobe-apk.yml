name: linkprobe-apk-builder
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: toolchain inventory
        shell: pwsh
        run: |
          "JAVA_HOME=$env:JAVA_HOME"
          "ANDROID_HOME=$env:ANDROID_HOME"
          if ($env:JAVA_HOME) { & "$env:JAVA_HOME\bin\java.exe" -version }
          Get-ChildItem "$env:ANDROID_HOME\build-tools" -Directory -EA 0 | ForEach-Object { $_.Name }
          Get-ChildItem "$env:ANDROID_HOME\platforms" -Directory -EA 0 | ForEach-Object { $_.Name }
      - name: build apk
        shell: pwsh
        run: ./tools/build_linkprobe.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: linkprobe-apk
          path: tools/linkprobe.apk
          if-no-files-found: error
