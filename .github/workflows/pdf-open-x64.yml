name: pdf-open-x64
jobs:
  t:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
    - name: Download ODT
      shell: pwsh
      run: "$page = (Invoke-WebRequest -Uri \"https://www.microsoft.com/en-us/download/details.aspx?id=49117\" -UseBasicParsing).Content\nif ($page -match 'href=\\\"(https://download\\.microsoft\\.com/download/[^\\\"]+officedeploymenttool[^\\\"]*\\.exe)\\\"') {\n  Invoke-WebRequest -Uri $Matches[1] -OutFile odt.exe\n} else { throw \"odt link not found\" }\nStart-Process -Wait -FilePath .\\odt.exe -ArgumentList \"/extract:odtx /quiet\""
    - name: Install CurrentChannelPreview x64 Word
      shell: pwsh
      run: '$xml = ''<Configuration><Add OfficeClientEdition="64" Channel="CurrentChannelPreview"><Product ID="O365ProPlusRetail"><Language ID="en-us" /><ExcludeApp ID="Excel" /><ExcludeApp ID="PowerPoint" /><ExcludeApp ID="Outlook" /><ExcludeApp ID="OneDrive" /><ExcludeApp ID="OneNote" /><ExcludeApp ID="Lync" /><ExcludeApp ID="Bing" /></Product></Add><Display Level="None" AcceptEULA="TRUE" /><Updates Enabled="FALSE" /></Configuration>''

        Set-Content -Path cfg.xml -Value $xml

        Start-Process -Wait -FilePath .\odtx\setup.exe -ArgumentList "/configure","cfg.xml"

        $w = Get-Item "C:\Program Files\Microsoft Office\root\Office16\wwlib.dll" -ErrorAction SilentlyContinue

        if (-not $w) { throw "install failed" }

        "wwlib v$($w.VersionInfo.FileVersion)"

        $w.VersionInfo.FileVersion | Out-File ver.txt'
    - name: Write pdfs and probe script
      shell: pwsh
      run: '[IO.File]::WriteAllBytes("$PWD\annot_huge.pdf", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\big_text.pdf", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\clean.pdf", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\cmap_long.pdf", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\hex_unterminated.pdf", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\image.pdf", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\length_big.pdf", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\length_negative.pdf", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\no_length.pdf", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\objstm_bad.pdf", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\off_shift.pdf", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\size_wrong.pdf", [Convert]::FromBase64String(""))

        [IO.File]::WriteAllBytes("$PWD\pdf_open_probe.ps1", [Convert]::FromBase64String(""))'
    - name: LocalDumps
      shell: pwsh
      run: '$ld = "HKLM:\SOFTWARE\Microsoft\Windows Error Reporting\LocalDumps"

        New-Item -Path $ld -Force | Out-Null

        Set-ItemProperty -Path $ld -Name DumpFolder -Value "C:\dumps" -Type ExpandString

        Set-ItemProperty -Path $ld -Name DumpType -Value 2 -Type DWord

        Set-ItemProperty -Path $ld -Name DumpCount -Value 12 -Type DWord

        New-Item -ItemType Directory -Force -Path C:\dumps | Out-Null

        $ld2="$ld\PDFREFLOW.EXE"

        New-Item -Path $ld2 -Force|Out-Null

        Set-ItemProperty -Path $ld2 -Name DumpFolder -Value "C:\dumps" -Type ExpandString

        Set-ItemProperty -Path $ld2 -Name DumpType -Value 2 -Type DWord'
    - name: Open each pdf and watch for the parser
      shell: pwsh
      run: '$ErrorActionPreference=''Continue''

        powershell -NoProfile -ExecutionPolicy Bypass -File .\pdf_open_probe.ps1 2>&1 | Tee-Object pdf_log.txt'
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pdf-open-x64
        path: 'pdf_log.txt

          ver.txt'
'on':
  workflow_dispatch: null
