name: dsr-merge-oracle
'on':
  workflow_dispatch: {}
jobs:
  t:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - name: Decode blob
      shell: pwsh
      run: |
        $b = '${{ secrets.DSR_ORACLE_B64 }}'
        [IO.File]::WriteAllBytes("$PWD/blob.tgz", [Convert]::FromBase64String($b))
        tar xzf blob.tgz
    - name: Locate VS
      shell: pwsh
      run: |
        $vs = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter vcvarsall.bat -EA SilentlyContinue | Select-Object -First 1
        $dia = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter dia2.h -EA SilentlyContinue | Select-Object -First 1
        Add-Content $env:GITHUB_ENV "VCVARS=$($vs.FullName)"
        Add-Content $env:GITHUB_ENV "DIAINC=$($dia.DirectoryName)"
    - name: Compile object (cross ARM64)
      shell: cmd
      run: |
        call "%VCVARS%" x64_arm64
        (echo int data_x=7;)> t.c
        (echo int __declspec(noinline^) tiny(int p^){ return p + data_x; })>> t.c
        cl /nologo /Zi /Gy /O2 /c t.c
    - name: Patch evil variant
      shell: pwsh
      run: |
        python patch_obj.py
        Copy-Item t.pdb vm_t_stub.pdb -Force
    - name: Prepare fixtures
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path C:\Users\nonoge\Documents\encobj | Out-Null
        Copy-Item t.c, t.obj, t_evil.obj C:\Users\nonoge\Documents\encobj\ -Force
        Copy-Item fixtures\vm_t.pdb vm_t.pdb -Force
        Get-ChildItem vm_t.pdb
    - name: Build host (x64)
      shell: cmd
      run: |
        call "%VCVARS%" x64
        cl /nologo /EHa /O2 /I"%DIAINC%" /Femo11.exe mo11.cpp /link ole32.lib oleaut32.lib
    - name: Fetch DSR packages
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path pkgB | Out-Null
        Invoke-WebRequest -UseBasicParsing -Uri "https://www.nuget.org/api/v2/package/Microsoft.DiaSymReader.Native/18.8.4-beta1.26356.2" -OutFile b.nupkg
        tar xf b.nupkg -C pkgB
        Get-ChildItem -Recurse -Filter *amd64*.dll pkgB | ForEach-Object { Copy-Item $_.FullName dsr_x64_B.dll }
        Get-ChildItem dsr_*.dll | ForEach-Object { $_.Name }
    - name: Differential matrix
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path out | Out-Null
        $cases = @(
          @{ obj = 't';      objfile = 't.obj';      pdb = 't.pdb' },
          @{ obj = 't_evil'; objfile = 't_evil.obj'; pdb = 't.pdb' },
          @{ obj = 'vm';     objfile = 't.obj';      pdb = 'vm_t.pdb' },
          @{ obj = 'vm_evil'; objfile = 't_evil.obj'; pdb = 'vm_t.pdb' }
        )
        $dll = "$PWD\dsr_x64_B.dll"
        foreach ($c in $cases) {
          Copy-Item $c.objfile t.obj -Force
          Copy-Item $c.pdb t_use.pdb -Force
          $o = & "$PWD\mo11.exe" "$PWD\t_use.pdb" $dll 'BFBF0' 2>&1 | Out-String
          $line = "=== case=$($c.obj) exit=$LASTEXITCODE ==="
          $line | Tee-Object -FilePath "out\log_$($c.obj).txt"
          $o | Tee-Object -FilePath "out\log_$($c.obj).txt" -Append
        }
    - name: Upload logs
      uses: actions/upload-artifact@v4
      with: { name: dsr-oracle-logs, path: out }
