name: dsr-merge-oracle
'on':
  workflow_dispatch: {}
jobs:
  t:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - name: Decode blob
      shell: pwsh
      run: |
        $b = '${{ secrets.DSR_ORACLE_B64 }}'
        [IO.File]::WriteAllBytes("$PWD/blob.tgz", [Convert]::FromBase64String($b))
        tar xzf blob.tgz
    - name: Locate VS
      shell: pwsh
      run: |
        $vs = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter vcvarsall.bat -EA SilentlyContinue | Select-Object -First 1
        $dia = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter dia2.h -EA SilentlyContinue | Select-Object -First 1
        Add-Content $env:GITHUB_ENV "VCVARS=$($vs.FullName)"
        Add-Content $env:GITHUB_ENV "DIAINC=$($dia.DirectoryName)"
        Write-Host "vcvars=$($vs.FullName)"
        Write-Host "diainc=$($dia.DirectoryName)"
    - name: Compile object (cross ARM64, small section + relocs)
      shell: cmd
      run: |
        call "%VCVARS%" x64_arm64
        (echo int data_x=7;)> t.c
        (echo int __declspec(noinline^) tiny(int p^){ return p + data_x; })>> t.c
        cl /nologo /Zi /Gy /O2 /c t.c
        dir t.obj t.pdb
    - name: Patch evil variant
      shell: pwsh
      run: python patch_obj.py
    - name: Prepare VM-path fixture
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path C:\Users\nonoge\Documents\encobj | Out-Null
        Copy-Item t.c, t.obj, t_evil.obj C:\Users\nonoge\Documents\encobj\ -Force
        if (Test-Path "$PWD\fixtures\vm_t.pdb") { Copy-Item "$PWD\fixtures\vm_t.pdb" "$PWD\vm_t.pdb" -Force; "vm pdb staged" } else { "vm_t.pdb MISSING in fixtures" }
        "PWD=$PWD"
        Get-ChildItem . -Filter *.pdb | ForEach-Object { $_.Name }
    - name: Build host (x64)
      shell: cmd
      run: |
        call "%VCVARS%" x64
        cl /nologo /EHa /O2 /I"%DIAINC%" /Femo11.exe mo11.cpp /link ole32.lib oleaut32.lib
    - name: Fetch DSR packages
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path pkgA, pkgB | Out-Null
        Invoke-WebRequest -UseBasicParsing -Uri "https://www.nuget.org/api/v2/package/Microsoft.DiaSymReader.Native/18.8.4-beta1.26356.2" -OutFile b.nupkg
        tar xf b.nupkg -C pkgB
        try {
          Invoke-WebRequest -UseBasicParsing -Uri "https://www.nuget.org/api/v2/package/Microsoft.DiaSymReader.Native/18.9.0-beta1.26405.2" -OutFile a.nupkg
          tar xf a.nupkg -C pkgA
        } catch { Write-Host "A package unavailable on nuget (unlisted after servicing) - A dynamic case skipped" }
        Get-ChildItem -Recurse -Filter *amd64*.dll pkgA, pkgB | ForEach-Object { Copy-Item $_.FullName ("dsr_" + $_.Directory.Parent.Name + ".dll") -EA SilentlyContinue }
        Get-ChildItem *.dll | ForEach-Object { $_.Name }
    - name: Differential matrix
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path out | Out-Null
        $combos = @()
        $aDll = (Get-ChildItem dsr_*amd64*.dll | Where-Object Name -match '26405' | Select-Object -First 1)
        if ($aDll) { $combos += @{ dll = $aDll.FullName; tag = 'A_35738'; rva = 'A1CC0' } }
        $combos += @{ dll = (Get-ChildItem dsr_*.dll | Where-Object Name -match 'x64' | Select-Object -First 1).FullName; tag = 'B_36250'; rva = 'BFBF0' }
        foreach ($c in $combos) {
          foreach ($obj in @('t','t_evil','vm_t_pdb')) {
          if ($obj -eq 'vm_t_pdb') {
            if (-not (Test-Path "$PWD\vm_t.pdb")) { "vm_t.pdb absent - skip"; continue }
            Copy-Item "$PWD\vm_t.pdb" "$PWD\t.pdb" -Force
          }
            if ($obj -ne 't') { Copy-Item "$obj.obj" t.obj -Force }
            $o = & .\mo11.exe t.pdb $c.dll $c.rva 2>&1 | Out-String
            "=== dll=$($c.tag) obj=$obj exit=$LASTEXITCODE ===" | Tee-Object -FilePath "out\log_$($c.tag)_$obj.txt"
            $o | Tee-Object -FilePath "out\log_$($c.tag)_$obj.txt" -Append
          }
        }
    - name: Upload logs
      uses: actions/upload-artifact@v4
      with: { name: dsr-oracle-logs, path: out }
