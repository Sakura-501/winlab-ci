name: ppt-timing-order
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Download ODT
        shell: pwsh
        run: |
          $page = (Invoke-WebRequest -Uri "https://www.microsoft.com/en-us/download/details.aspx?id=49117" -UseBasicParsing).Content
          if ($page -match 'href="(https://download\.microsoft\.com/download/[^"]+officedeploymenttool[^"]*\.exe)"') {
            Invoke-WebRequest -Uri $Matches[1] -OutFile odt.exe
          } else { throw "odt link not found" }
          Start-Process -Wait -FilePath .\odt.exe -ArgumentList "/extract:odtx /quiet"
      - name: Install pinned 20326.20144 Office (with PowerPoint)
        shell: pwsh
        run: |
          $xml = '<Configuration><Add OfficeClientEdition="64" Channel="http://officecdn.microsoft.com/pr/5440fd1f-7ecb-4221-8110-145efaa6372f" Version="16.0.20326.20144"><Product ID="O365ProPlusRetail"><Language ID="en-us" /><ExcludeApp ID="Excel" /><ExcludeApp ID="Outlook" /><ExcludeApp ID="OneDrive" /><ExcludeApp ID="OneNote" /><ExcludeApp ID="Lync" /><ExcludeApp ID="Bing" /></Product></Add><Display Level="None" AcceptEULA="TRUE" /><Updates Enabled="FALSE" /></Configuration>'
          Set-Content -Path cfg.xml -Value $xml
          Start-Process -Wait -FilePath .\odtx\setup.exe -ArgumentList "/configure","cfg.xml"
          (Get-Item "C:\Program Files\Microsoft Office\root\Office16\POWERPNT.EXE").VersionInfo.FileVersion | Out-File ver.txt
          (Get-Item "C:\Program Files\Microsoft Office\root\Office16\ppcore.dll").Length | Out-File ppsize.txt
      - name: Run timing order probe
        shell: powershell
        run: |
          & tools\pptorder\run_step.ps1
      - name: Collect
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ${{ github.workspace }}\out | Out-Null
          Copy-Item C:\pptorder\out\* -Destination ${{ github.workspace }}\out -Force -ErrorAction SilentlyContinue
          Copy-Item ver.txt,ppsize.txt -Destination ${{ github.workspace }}\out -Force -ErrorAction SilentlyContinue
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppt-timing-order-out
          path: out\
