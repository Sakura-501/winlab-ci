name: ppt-timing-order
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Download ODT
        shell: pwsh
        run: |
          $page = (Invoke-WebRequest -Uri "https://www.microsoft.com/en-us/download/details.aspx?id=49117" -UseBasicParsing).Content
          if ($page -match 'href="(https://download\.microsoft\.com/download/[^"]+officedeploymenttool[^"]*\.exe)"') {
            Invoke-WebRequest -Uri $Matches[1] -OutFile odt.exe
          } else { throw "odt link not found" }
          Start-Process -Wait -FilePath .\odt.exe -ArgumentList "/extract:odtx /quiet"
      - name: Install pinned 20326.20144 Office (with PowerPoint)
        shell: pwsh
        run: |
          $xml = '<Configuration><Add OfficeClientEdition="64" Channel="http://officecdn.microsoft.com/pr/5440fd1f-7ecb-4221-8110-145efaa6372f" Version="16.0.20326.20144"><Product ID="O365ProPlusRetail"><Language ID="en-us" /><ExcludeApp ID="Excel" /><ExcludeApp ID="Outlook" /><ExcludeApp ID="OneDrive" /><ExcludeApp ID="OneNote" /><ExcludeApp ID="Lync" /><ExcludeApp ID="Bing" /></Product></Add><Display Level="None" AcceptEULA="TRUE" /><Updates Enabled="FALSE" /></Configuration>'
          Set-Content -Path cfg.xml -Value $xml
          Start-Process -Wait -FilePath .\odtx\setup.exe -ArgumentList "/configure","cfg.xml"
          (Get-Item "C:\Program Files\Microsoft Office\root\Office16\POWERPNT.EXE").VersionInfo.FileVersion | Out-File ver.txt
          (Get-Item "C:\Program Files\Microsoft Office\root\Office16\ppcore.dll").Length | Out-File ppsize.txt
      - name: Run timing order probe
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path C:\pptorder\out | Out-Null
          Copy-Item tools\pptorder\cdb_cmd.txt C:\pptorder\cdb_cmd.txt -Force
          Copy-Item carriers\timing_sample2.pptx C:\pptorder\timing_sample2.pptx -Force
          $c = $null
          foreach ($base in @('C:\Program Files\WindowsApps','C:\Users\runneradmin\AppData\Local\Microsoft\WindowsApps')) {
            if (-not $c) { $c = Get-ChildItem $base -Directory -Filter 'Microsoft.WinDbg*' -ErrorAction SilentlyContinue | ForEach-Object { Get-ChildItem $_.FullName -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue | Where-Object {$_.DirectoryName -match 'amd64|x64'} } | Select-Object -First 1 }
          }
          if (-not $c) {
            # fallback: check common WinDbg paths
            foreach ($p in @('C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe','C:\Program Files\Windows Kits\10\Debuggers\x64\cdb.exe')) {
              if (Test-Path $p) { $c = Get-Item $p; break }
            }
          }
          if (-not $c) {
            winget install Microsoft.WinDbg --accept-source-agreements --accept-package-agreements --disable-interactivity
            Start-Sleep 10
            $c = Get-ChildItem 'C:\Program Files\WindowsApps' -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue | Where-Object {$_.DirectoryName -match 'amd64|x64'} | Select-Object -First 1
          }
          if (-not $c) { Get-ChildItem 'C:\Program Files\WindowsApps' -Directory -EA SilentlyContinue | Select-Object -First 20 Name | Out-File C:\pptorder\wa_dirs.txt; throw "cdb truly not found" }
          New-Item -ItemType Directory -Force -Path C:\pptorder\dbg | Out-Null
          Copy-Item $c.FullName C:\pptorder\dbg\cdb.exe
          Get-ChildItem $c.DirectoryName -Filter *.dll | Copy-Item -Destination C:\pptorder\dbg\ -Force
          # cdb cmd: sxdn noise + bu deferred bps + long wait
          Set-Content -Path C:\pptorder\cdb_cmd.txt -Value @'
          sxdn av
          sxdn e06d7363
          sxdn 40080201
          sxdn c000041d
          sxdn c000001d
          sxn ld
          sxn unld
          bu ppcore+0x788e8 "k 5; g"
          bu ppcore+0x9f3e8 "k 5; g"
          bu ppcore+0x5a878 "k 5; g"
          g
          '@ -Encoding ASCII
          $p = Start-Process -FilePath C:\pptorder\dbg\cdb.exe -ArgumentList '-logo','C:\pptorder\out\cdb_order.log','-cf','C:\pptorder\cdb_cmd.txt','C:\Program Files\Microsoft Office\root\Office16\POWERPNT.EXE','C:\pptorder\timing_sample2.pptx' -PassThru -WindowStyle Hidden
          # wait up to 45 min for open to complete (poll title)
          $deadline = (Get-Date).AddMinutes(45)
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 30
            $t = (Get-Process POWERPNT -ErrorAction SilentlyContinue).MainWindowTitle
            if ($t -and $t -notmatch 'Opening') { break }
          }
          Start-Sleep -Seconds 60
          (Get-Process POWERPNT -ErrorAction SilentlyContinue).MainWindowTitle | Out-File C:\pptorder\out\title.txt
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5
          Copy-Item C:\pptorder\out\cdb_order.log C:\pptorder\out\cdb_order_copy.txt -Force

      - name: Collect
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ${{ github.workspace }}\out | Out-Null
          Copy-Item C:\pptorder\out\* -Destination ${{ github.workspace }}\out -Force -ErrorAction SilentlyContinue
          Copy-Item ver.txt,ppsize.txt -Destination ${{ github.workspace }}\out -Force -ErrorAction SilentlyContinue
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppt-timing-order-out
          path: out\
