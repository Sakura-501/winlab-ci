name: sac-gateprobe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install latest SAC x64 Word
        shell: pwsh
        run: |
          $page = (Invoke-WebRequest -Uri "https://www.microsoft.com/en-us/download/details.aspx?id=49117" -UseBasicParsing).Content
          if ($page -match 'href="(https://download\.microsoft\.com/download/[^"]+officedeploymenttool[^"]*\.exe)"') {
            Invoke-WebRequest -Uri $Matches[1] -OutFile odt.exe
          } else { throw "odt link not found" }
          Start-Process -Wait -FilePath .\odt.exe -ArgumentList "/extract:odtx /quiet"
          $xml = '<Configuration><Add OfficeClientEdition="64" Channel="SemiAnnual"><Product ID="O365ProPlusRetail"><Language ID="en-us" /><ExcludeApp ID="Excel" /><ExcludeApp ID="PowerPoint" /><ExcludeApp ID="Outlook" /><ExcludeApp ID="OneDrive" /><ExcludeApp ID="OneNote" /><ExcludeApp ID="Lync" /><ExcludeApp ID="Bing" /></Product></Add><Display Level="None" AcceptEULA="TRUE" /><Updates Enabled="FALSE" /></Configuration>'
          Set-Content -Path cfg.xml -Value $xml
          Start-Process -Wait -FilePath .\odtx\setup.exe -ArgumentList "/configure","cfg.xml"
          $m = Get-ChildItem "C:\Program Files\Microsoft Office\root\vfs\ProgramFilesCommonX64" -Recurse -Filter wwlib.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $m) { $m = Get-Item "C:\Program Files\Microsoft Office\root\Office16\wwlib.dll" -ErrorAction SilentlyContinue }
          if (-not $m) { throw "wwlib not found" }
          "wwlib v{0} len={1}" -f $m.VersionInfo.FileVersion, $m.Length | Out-File ver.txt
          Copy-Item $m.FullName sac_wwlib.dll
      - name: Build trigger docs (field/move rev marks) with revision logging
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path C:\t -Force | Out-Null
          function New-RevDoc($path, $tag) {
            $w = New-Object -ComObject Word.Application
            $w.Visible = $false
            $w.DisplayAlerts = 0
            $doc = $w.Documents.Add()
            $doc.Content.Text = "Alpha beta gamma delta. "
            $doc.TrackRevisions = $true
            try { $w.Options.TrackMoves = $true } catch { "opt.trackmoves err" | Out-File C:\t\gen.log -Append }
            try { $w.TrackMoves = $true } catch { "w.trackmoves err" | Out-File C:\t\gen.log -Append }
            $w.Selection.EndKey(6) | Out-Null
            $w.Selection.TypeText("Tracked inserted text. ")
            try { $w.Selection.Fields.Add($w.Selection.Range, -1, 'TC "EntryText" \f C', $false) | Out-Null } catch { "fields.add err: $($_.Exception.Message)" | Out-File C:\t\gen.log -Append }
            $w.Selection.TypeText(" after field. ")
            try {
              $rng = $doc.Content
              $rng.Start = 0; $rng.End = 5
              $rng.Cut()
              $w.Selection.EndKey(6) | Out-Null
              $w.Selection.Paste()
            } catch { "move err: $($_.Exception.Message)" | Out-File C:\t\gen.log -Append }
            $revCount = $doc.Revisions.Count
            "revcount[$tag]=$revCount" | Out-File C:\t\gen.log -Append
            for ($i=1; $i -le $revCount -and $i -le 8; $i++) {
              try { "  rev[$i] type=$($doc.Revisions.Item($i).Type)" | Out-File C:\t\gen.log -Append } catch {}
            }
            try { $doc.Fields.Update() } catch {}
            $doc.SaveAs2($path, 0)
            $doc.Saved = $true
            $doc.Close(0)
            $w.Quit()
            [GC]::Collect(); [GC]::WaitForPendingFinalizers()
            Start-Sleep -Seconds 3
          }
          New-RevDoc "C:\t\f_accept.doc" "accept"
          New-RevDoc "C:\t\f_reject.doc" "reject"
          Get-Item C:\t\f_*.doc | Select-Object Name,Length | Out-File docinfo.txt
      - name: Open docs, accept/reject revisions, read gates
        shell: powershell
        run: |
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public class Mem {
            [DllImport("kernel32.dll", SetLastError=true)] public static extern IntPtr OpenProcess(uint a, bool b, uint pid);
            [DllImport("kernel32.dll", SetLastError=true)] public static extern bool ReadProcessMemory(IntPtr h, IntPtr a, byte[] b, IntPtr s, out IntPtr r);
            [DllImport("kernel32.dll")] public static extern bool CloseHandle(IntPtr h);
          }
          "@
          function Read-Gates($tag) {
            $p = Get-Process WINWORD | Select-Object -First 1
            if (-not $p) { "NO WINWORD ($tag)" | Out-File result.txt -Append; return }
            $h = [Mem]::OpenProcess(0x0010, $false, [uint32]$p.Id)
            $base = 0
            foreach ($m in $p.Modules) { if ($m.ModuleName -eq "wwlib.dll") { $base = $m.BaseAddress.ToInt64() } }
            "pid={0} base=0x{1:X} [{2}]" -f $p.Id, $base, $tag | Out-File result.txt -Append
            foreach ($gateRva in @(0x2CC69F8, 0x2CC69E8, 0x2CC7110)) {
              $buf = New-Object byte[] 16
              $rd = [IntPtr]::Zero
              $ok = [Mem]::ReadProcessMemory($h, [IntPtr]($base + $gateRva), $buf, [IntPtr]16, [ref]$rd)
              $q0 = [BitConverter]::ToUInt64($buf,0)
              "  gate rva=0x{0:X} q0=0x{1:X} read={2}" -f $gateRva, $q0, $ok | Out-File result.txt -Append
              if ($q0 -eq 0x55FF) { "    UNEVAL" | Out-File result.txt -Append }
              elseif (($q0 -band 0xFF) -eq 1) { "    EVAL ON" | Out-File result.txt -Append }
              elseif (($q0 -band 0xFF) -eq 0) { "    EVAL OFF" | Out-File result.txt -Append }
              else { "    UNKNOWN 0x{0:X}" -f $q0 | Out-File result.txt -Append }
            }
            [Mem]::CloseHandle($h) | Out-Null
          }
          Start-Process "C:\Program Files\Microsoft Office\root\Office16\WINWORD.EXE" -ArgumentList "/q","/n","C:\t\f_accept.doc"
          Start-Sleep -Seconds 18
          try {
            $w = [System.Runtime.InteropServices.Marshal]::GetActiveObject("Word.Application")
            $doc = $w.Documents.Item(1)
            "open_revcount=$($doc.Revisions.Count)" | Out-File result.txt -Append
            try { $doc.Fields.Update() } catch {}
            try { $doc.AcceptAllRevisions() } catch { "accept err: $($_.Exception.Message)" | Out-File update.log -Append }
            Start-Sleep -Seconds 8
            $doc.Saved = $true
          } catch { "attach1 err: $($_.Exception.Message)" | Out-File update.log -Append }
          Read-Gates "after_accept"
          try { $w.Quit() } catch {}
          Start-Sleep -Seconds 6
          Start-Process "C:\Program Files\Microsoft Office\root\Office16\WINWORD.EXE" -ArgumentList "/q","/n","C:\t\f_reject.doc"
          Start-Sleep -Seconds 18
          try {
            $w = [System.Runtime.InteropServices.Marshal]::GetActiveObject("Word.Application")
            $doc = $w.Documents.Item(1)
            "open_revcount=$($doc.Revisions.Count)" | Out-File result.txt -Append
            try { $doc.Fields.Update() } catch {}
            try { $doc.RejectAllRevisions() } catch { "reject err: $($_.Exception.Message)" | Out-File update.log -Append }
            Start-Sleep -Seconds 8
            $doc.Saved = $true
          } catch { "attach2 err: $($_.Exception.Message)" | Out-File update.log -Append }
          Read-Gates "after_reject"
          try { $w.Quit() } catch {}
          Get-Content result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sac-gateprobe-result
          path: |
            ver.txt
            docinfo.txt
            result.txt
            update.log
            gen.log
            sac_wwlib.dll
          if-no-files-found: ignore
