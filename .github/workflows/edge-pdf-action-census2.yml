        tar -xzf C:\edgebat\p.gz -C C:\edgebat
        Get-ChildItem C:\edgebat | ForEach-Object { '{0} {1}' -f $_.Name, $_.Length }
        $tok=$null; $err=$null
        [void][System.Management.Automation.Language.Parser]::ParseFile('C:\edgebat\run27.ps1',[ref]$tok,[ref]$err)
        Write-Host ('ps_parse_errors=' + $err.Count)
        foreach ($e in $err) { Write-Host ('  PSERR line ' + $e.Extent.StartLineNumber + ': ' + $e.Message) }
        if ($err.Count -gt 0) { exit 2 }
        pwsh -NoProfile -ExecutionPolicy Bypass -File C:\edgebat\run27.ps1
    - name: upload
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: payload27
        path: C:\edgebat\out
        if-no-files-found: warn
