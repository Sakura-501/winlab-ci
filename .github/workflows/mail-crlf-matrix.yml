      - name: Install SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install exact runtimes
        run: |
          mkdir -p rt && cd rt
          for v in 8.0.31 9.0.20 10.0.5 10.0.12; do
            curl -sL -o rt-$v.tar.gz "https://builds.dotnet.microsoft.com/dotnet/Runtime/$v/dotnet-runtime-$v-linux-x64.tar.gz"
            mkdir -p $v && tar xzf rt-$v.tar.gz -C $v
            echo "== runtime $v =="
            sha256sum rt-$v.tar.gz
          done
          echo "== System.Net.Mail.dll sha256 per runtime =="
          sha256sum */shared/Microsoft.NETCore.App/*/System.Net.Mail.dll
      - name: Build
        run: |
          cd probe
          dotnet build -c Release 2>&1 | tail -5
      - name: Run matrix on exact runtimes
        run: |
          ROOT=$PWD
          for v in 8.0.31 9.0.20 10.0.12 10.0.5; do
            case $v in
              8.0.31) TFM=net8.0;; 9.0.20) TFM=net9.0;; *) TFM=net10.0;;
            esac
            out=$ROOT/evidence/$v
            mkdir -p $out
            echo "########## runtime $v (TFM $TFM) ##########"
            DOTNET_ROOT=$ROOT/rt/$v $ROOT/rt/$v/dotnet $ROOT/probe/bin/Release/$TFM/mailprobe.dll $out
            echo "exit=$?"
          done
      - name: Forensic dumps
        run: |
          find evidence -name '*.eml' | sort | while read f; do
            { echo "=== $f ==="; od -c "$f"; } > "$f.od"
          done
          find evidence -type f | sort
      - uses: actions/upload-artifact@v4
        with:
          name: mail-crlf-evidence
          path: evidence
          if-no-files-found: error
